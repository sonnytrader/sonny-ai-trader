function sgn(x,n){x=Number(x);return isFinite(x)?(x>=0?"+":"")+x.toFixed(n==null?2:n):"-";}

function api(p,o){return fetch(p,o).then(function(r){return r.json();}).catch(function(){return null;});}
function post(p,b){return api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});}

/* ── USDT yardımcı: kapalı işlemlerde kullanılır ── */
function pnlOf(x){
  if(!x)return null;
  if(x.pnlUsdt!=null&&isFinite(x.pnlUsdt))return Number(x.pnlUsdt);
  if(x.pnl!=null&&isFinite(x.pnl))return Number(x.pnl);
  return null;
}
function durOf(x){
  if(!x)return 0;
  if(x.durationMs!=null)return Number(x.durationMs)||0;
  var end=x.closedAt||Date.now();
  var start=x.openedAt||x.createdAt||end;
  return Math.max(0,end-start);
}
/* ── API uyumluluk katmanı: server formatını UI'nin beklediği {active,closed}'a çevirir ── */
function shimSignals(d){
  if(!d)return {active:[],closed:[]};
  if(Array.isArray(d.active)&&Array.isArray(d.closed))return d;
  var sigs=d.signals||d.items||[];
  if(!Array.isArray(sigs))return {active:[],closed:[]};
  var act=[],cls=[];
  for(var i=0;i<sigs.length;i++){
    var s=sigs[i];if(!s)continue;
    if(s.status==="AKTIF"||s.status==="AI_BEKLIYOR"||s.status==="ONAY_BEKLIYOR")act.push(s);
    else if(s.status==="KAPANDI"||s.status==="IPTAL")cls.push(s);
  }
  return {active:act,closed:cls};
}
function shimPaper(d){
  if(!d)return null;
  if(d.summary&&d.settings)return d;
  var op=Array.isArray(d.open)?d.open:[];
  var cl=Array.isArray(d.closed)?d.closed:[];
  var wins=0,sumPnl=0,unreal=0;
  for(var i=0;i<cl.length;i++){var p=pnlOf(cl[i]);if(p!=null){sumPnl+=p;if(p>0)wins++;}}
  for(var j=0;j<op.length;j++){unreal+=Number(op[j].livePnl)||0;}
  var eq=d.equity!=null?d.equity:(g(S.state,"paper.equity",0)||0);
  var st=d.start!=null?d.start:(g(S.state,"paper.start",eq)||eq);
  return {
    settings:{auto:!!g(S.state,"settings.auto",false),tradeMode:g(S.state,"settings.tradeMode","paper"),margin:g(S.state,"settings.margin",100),leverage:g(S.state,"settings.leverage",5),riskPct:g(S.state,"settings.riskPct",0.5),maxOpen:g(S.state,"settings.maxOpen",3),dailyLossPct:g(S.state,"settings.dailyLossPct",3)},
    summary:{equity:eq,start:st,balance:eq,dayPnl:sumPnl,dayStart:st,open:op.length,closed:cl.length,wins:wins,losses:cl.length-wins,winRate:cl.length?wins/cl.length*100:0,sumPnl:sumPnl,unrealized:unreal},
    open:op,closed:cl,live:null
  };
}

function resChip(r){var k=/^(TP1|TP2)$/.test(r)?"long":/^(SL|ZAYIF_IVME|AI_RED|AI_ERROR|AI_TIMEOUT)$/.test(r)?"short":/^(FADE|MOMENTUM|APPROVAL_EXPIRED|AI_STALE|MATH_ONLY|SKIP)$/.test(r)?"gold":"neutral";return '<span class="chip '+k+'">'+esc(RES[r]||r||"-")+'</span>';}

function evPhaseChip(p){var idx={PRE_BREAKOUT:0,TRIGGER_PENDING:1,CONFIRMED:2,LATE:3,INVALID:4,EARLY:4,CONTINUATION:2,PULLBACK:1,EXHAUSTION:3,UNCLEAR:4}[p]||4;return '<span class="phase-chip p'+idx+'">'+esc(EV_PH_TR[p]||p||"—")+'</span>';}
function listHtml(a){if(!a||!a.length)return '<span class="mut">—</span>';return a.map(function(x){return '<div style="display:flex;gap:7px;margin:4px 0"><span class="gold">•</span><span>'+esc(x)+'</span></div>';}).join("");}

   (a.checks&&Object.keys(a.checks).length?'<div style="margin-top:10px;font-size:11.5px"><b class="mut">Kontrol Listesi</b>'+Object.keys(a.checks).map(function(k){var v=a.checks[k];return '<div style="display:flex;gap:7px;margin:3px 0"><span class="'+(v===true?'up':v===false?'dn':'mut')+'">'+(v===true?'✔':v===false?'✘':'•')+'</span><span>'+esc(k)+'</span></div>';}).join("")+'</div>':"")+

function indicatorTag(k,v){if(typeof v!=="number")return "";k=String(k).toLowerCase();var l="",c="";
  if(k==="adx"){if(v>=30){l="GÜÇLÜ";c="ok";}else if(v<20){l="ZAYIF";c="bad";}}
  else if(k==="volratio"){if(v>=1.5){l="GÜÇLÜ HACİM";c="ok";}else if(v<1){l="ZAYIF HACİM";c="bad";}}
  else if(k==="rsi"){if(v>70||v<30){l="AŞIRI";c="bad";}}
  return l?'<span class="tag '+c+'">'+l+'</span>':"";
}

  /* düzeltme: yüzde yerine USDT göster */

  var conf=clamp(Number(s.conf)||0,0,100),i=s.info||{},tags="";
  if(s.marketAlign==="TERS")tags+='<span class="chip gold">PİYASAYA TERS</span>';else if(s.marketAlign==="UYUMLU")tags+='<span class="chip long">PİYASA UYUMLU</span>';
  if(i.tf)tags+='<span class="chip neutral">'+esc(i.tf)+'</span>';
  if(i.setup)tags+='<span class="chip neutral">'+esc(i.setup)+'</span>';
  if(i.shape)tags+='<span class="chip neutral">'+esc(i.shape)+'</span>';
  if(pAI)tags+='<span class="chip gold"><i class="fa-solid fa-hourglass-half"></i> AI BEKLİYOR</span>';

  var bar="";
  if(pAp)bar='<button class="btn green" style="padding:7px;font-size:12px;width:100%" data-act="execSig" data-id="'+esc(s.id)+'">Onayla ve Aç</button>';
  return '<article class="sig '+(s.dir==="LONG"?"long":"short")+'" data-act="open" data-id="'+esc(s.id)+'"><div class="sig-h"><div class="sym">'+esc(s.base)+'<span>USDT</span></div>'+dirChip(s.dir)+'<span class="age">'+dur(Date.now()-s.createdAt)+'</span></div>'+

/* ══════════════════════════════════════════════════════════════════════════════
   GRAFİK ÇİZİM
   ══════════════════════════════════════════════════════════════════════════════ */
function drawChart(cv,d){
  if(!cv||!d||!d.candles||!d.candles.length)return;
  var c=d.candles,s=d.signal||{},W=cv.clientWidth||900,H=380,dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+"px";
  var x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);
  x.fillStyle="#0b0e11";x.fillRect(0,0,W,H);
  var padL=8,padR=78,padT=20,padB=20,cw=W-padL-padR,ch=H-padT-padB;
  var future=0;
  if(d.triangle&&d.triangle.upper&&d.triangle.upper.length){
    var lastT=c[c.length-1][0],maxT=lastT;
    d.triangle.upper.forEach(function(q){if(Number(q[0])>maxT)maxT=Number(q[0]);});
    var step=c.length>1?c[c.length-1][0]-c[c.length-2][0]:0;
    if(step>0)future=Math.min(30,Math.max(0,Math.round((maxT-lastT)/step)));
  }
  var bars=c.length+future;
  var hi=-Infinity,lo=Infinity;
  c.forEach(function(k){if(k[2]>hi)hi=k[2];if(k[3]<lo)lo=k[3];});
  if(d.triangle){
    (d.triangle.upper||[]).forEach(function(q){var v=Number(q[1]);if(isFinite(v)&&v>0){if(v>hi)hi=v;if(v<lo)lo=v;}});
    (d.triangle.lower||[]).forEach(function(q){var v=Number(q[1]);if(isFinite(v)&&v>0){if(v>hi)hi=v;if(v<lo)lo=v;}});
  }
  if(hi===lo){hi++;lo--;}
  var pad=(hi-lo)*0.06;hi+=pad;lo-=pad;var rg=hi-lo;
  function Y(v){return padT+(hi-v)/rg*ch;}
  function X(i){return padL+(i+0.5)*(cw/bars);}
  var bw=Math.max(1,Math.min(11,(cw/bars)*0.66));
  c.forEach(function(k,i){
    var col=k[4]>=k[1]?"#0ecb81":"#f6465d";x.strokeStyle=col;x.fillStyle=col;
    x.beginPath();x.moveTo(X(i),Y(k[2]));x.lineTo(X(i),Y(k[3]));x.stroke();
    var t=Y(Math.max(k[1],k[4])),b=Y(Math.min(k[1],k[4]));
    x.fillRect(X(i)-bw/2,t,bw,Math.max(1,b-t));
  });
  function level(v,col,l){if(!(Number(v)>0))return;var yy=Y(v);if(yy<padT-4||yy>padT+ch+4)return;
    x.strokeStyle=col;x.setLineDash([5,4]);x.beginPath();x.moveTo(padL,yy);x.lineTo(padL+cw,yy);x.stroke();x.setLineDash([]);
    x.fillStyle=col;x.font="700 10px sans-serif";x.textAlign="left";x.fillText(l+" "+px(v),padL+cw+3,yy+3);}
  function eline(arr,col){if(!arr||!arr.length)return;x.strokeStyle=col;x.lineWidth=1.2;x.beginPath();var st=false;
    for(var i=0;i<arr.length&&i<c.length;i++){var v=Number(arr[i]);if(!isFinite(v)||v<=0){st=false;continue;}var xx=X(i),yy=Y(v);if(!st){x.moveTo(xx,yy);st=true;}else x.lineTo(xx,yy);}
    x.stroke();x.lineWidth=1;}
  function tIndex(t){if(c.length<2)return 0;var st=c[c.length-1][0]-c[c.length-2][0];if(!(st>0))return c.length-1;return (Number(t)-c[0][0])/st;}
  function triLine(arr,col,label){if(!arr||!arr.length)return;x.strokeStyle=col;x.lineWidth=2.2;x.lineJoin="round";x.beginPath();
    var started=false,lastX=0,lastY=0;
    for(var i=0;i<arr.length;i++){var t=Number(arr[i][0]),v=Number(arr[i][1]);if(!isFinite(t)||!isFinite(v))continue;
      var idx=clamp(tIndex(t),0,bars-1);var xx=X(idx),yy=Y(v);if(!started){x.moveTo(xx,yy);started=true;}else x.lineTo(xx,yy);lastX=xx;lastY=yy;}
    x.stroke();x.lineWidth=1;
    if(label){x.fillStyle=col;x.font="700 9.5px sans-serif";x.textAlign="left";x.fillText(label,Math.min(lastX+4,padL+cw-52),lastY+(label==="ÜST"?"-4":"10"));}}
  eline(d.ema20,"#f0b90b");eline(d.ema50,"#4b9cf5");
  level(s.sl,"#f6465d","SL");level(s.tp1,"#0ecb81","TP1");level(s.tp2,"#0ecb81","TP2");level(s.entry,"#eaecef","G");
  (d.levels||[]).forEach(function(o){level(o.v,o.col||"#848e9c",o.l||"");});
  if(d.triangle){
    triLine(d.triangle.upper,"#f6465d","ÜST");
    triLine(d.triangle.lower,"#0ecb81","ALT");
    (d.triangle.pivots||[]).forEach(function(q){
      var idx=clamp(tIndex(q.t),0,bars-1),xx=X(idx),yy=Y(Number(q.p));
      x.fillStyle=q.side==="H"?"#f6465d":"#0ecb81";x.beginPath();x.arc(xx,yy,2.6,0,Math.PI*2);x.fill();
    });
  }
  x.fillStyle="#eaecef";x.font="700 11px sans-serif";x.textAlign="left";
  x.fillText(s.base?s.base+"USDT · "+String(d.tf).toUpperCase():"",padL+2,10);
  if(d.ema20&&d.ema20.length){x.fillStyle="#f0b90b";x.font="600 9px sans-serif";x.fillText("EMA20",padL+cw-92,10);}
  if(d.ema50&&d.ema50.length){x.fillStyle="#4b9cf5";x.fillText("EMA50",padL+cw-48,10);}
}

async function refresh(){
  if(S.busy)return;S.busy=true;
  try{
    var st=await api("/api/state");
    if(st&&st.version){S.state=st;S.lastAt=Date.now();}
    var t=S.tab,jobs=[];
    if(MODN[t]){
      /* düzeltme: /api/signals yanıtını {active,closed} formatına çevir */
      jobs.push(api("/api/signals?module="+t).then(function(d){if(d)S.sig[t]=shimSignals(d);}));
      if(t==="PUMP")jobs.push(api("/api/paper").then(function(d){if(d)S.paper=shimPaper(d);}));
      if(t==="AUTO"){
        jobs.push(api("/api/paper").then(function(d){if(d)S.paper=shimPaper(d);}));
        jobs.push(api("/api/auto/watch").then(function(d){if(d)S.autoWatch=d;}));
      }
      if(t==="LT")jobs.push(api("/api/watch/lt").then(function(d){if(d)S.watch.lt=d;}));
    }
    if(t==="home"){
      /* düzeltme: home için modül bazlı gruplama */
      jobs.push(api("/api/signals").then(function(d){
        if(!d)return;
        var sigs=d.signals||d.active||[];
        var by={};
        for(var i=0;i<sigs.length;i++){
          var s=sigs[i];if(!s)continue;
          var m=s.module||"UNKNOWN";
          if(!by[m])by[m]={active:[],closed:[]};
          if(s.status==="AKTIF"||s.status==="AI_BEKLIYOR"||s.status==="ONAY_BEKLIYOR")by[m].active.push(s);
          else if(s.status==="KAPANDI"||s.status==="IPTAL")by[m].closed.push(s);
        }
        S.sig=by;
      }));
      jobs.push(api("/api/paper").then(function(d){if(d)S.paper=shimPaper(d);}));
      jobs.push(api("/api/rejections").then(function(d){if(d)S.rejections=d;}));
      jobs.push(api("/api/watch/lt").then(function(d){if(d)S.watch.lt=d;}));
      jobs.push(api("/api/watch/scalp").then(function(d){if(d)S.watch.scalp=d;}));
      jobs.push(api("/api/auto/watch").then(function(d){if(d)S.autoWatch=d;}));
    }
    if(t==="ai"){
      jobs.push(api("/api/ai/status").then(function(d){if(d)S.ai=d;}));
      jobs.push(api("/api/ai/history").then(function(d){if(d&&d.items){S.ai=S.ai||{};S.ai.hist=d.items;}}));
      jobs.push(api("/api/ai/accuracy").then(function(d){if(d)S.ai=S.ai||{};if(d)S.ai.accuracy=d;}));
    }
    if(t==="stats"){
      jobs.push(api("/api/stats").then(function(d){if(d)S.stats=d;}));
      jobs.push(api("/api/ai/accuracy").then(function(d){if(d)S.ai=S.ai||{};if(d)S.ai.accuracy=d;}));
    }
    if(t==="radar")jobs.push(api("/api/radar").then(function(d){if(d)S.radar=d;}));
    if(t==="opps")jobs.push(api("/api/opportunities").then(function(d){if(d)S.opportunities=d;}));
    if(t==="outcomes")jobs.push(api("/api/outcomes").then(function(d){if(d)S.outcomes=d;}));
    if(t==="strat"&&!S.strat)jobs.push(api("/api/strategies").then(function(d){if(d)S.strat=d;}));
    await Promise.all(jobs);
  }catch(e){console.error(e);}
  S.busy=false;try{render();}catch(e){console.error(e);}
}

    else if(a==="toggleAutoTrade"){
      var rA=await post("/api/auto/toggle");
      toast(rA&&rA.note?rA.note:("OtoTrade "+g(rA,"enabled",false)?"AÇIK":"KAPALI"),rA&&rA.ok?"ok":"err");await refresh();
    }
    else if(a==="scanAuto"){
      toast("Pump/dump taranıyor…");
      var rAs=await post("/api/auto/scan");
      toast("Tarama bitti ("+g(rAs,"items.length",0)+" aday)","ok");await refresh();
    }
    else if(a==="refreshLive"){
      toast("Bitget bakiye/pozisyon…");
      var rL=await post("/api/live/sync");
      toast(rL&&rL.ok?"Senkronize":(rL&&rL.error)||"Hata",rL&&rL.ok?"ok":"err");await refresh();
    }
    else if(a==="saveAutoSet"){
      var av=function(i){var el=document.getElementById(i);return el?Number(el.value):undefined;};
      var rS=await post("/api/paper/settings",{autoMaxOpen:av("a_max"),riskPct:av("a_risk"),leverage:av("a_lev"),margin:av("a_margin"),autoAiPerHour:av("a_ai")});
      toast(rS&&rS.ok?"Kaydedildi":"Hata",rS&&rS.ok?"ok":"err");await refresh();
    }
    else if(a==="toggleMode"){
      var cm=g(S.state,"settings.tradeMode","paper"),nw=cm==="live"?"paper":"live";
      if(nw==="live"&&!confirm("Gerçek para! Emin misin?"))return;
      var r4=await post("/api/trade/mode",{mode:nw});
      toast(r4&&r4.note?r4.note:("Mod "+nw.toUpperCase()),r4&&r4.ok?"ok":"err");await refresh();
    }
    else if(a==="saveSet"){
      var v=function(i){var el=document.getElementById(i);return el?Number(el.value):undefined;};
      var r6=await post("/api/paper/settings",{margin:v("s_margin"),leverage:v("s_lev"),riskPct:v("s_risk"),maxOpen:v("s_maxopen"),dailyLossPct:v("s_dl")});
      toast(r6&&r6.ok?"Kaydedildi":"Hata",r6&&r6.ok?"ok":"err");await refresh();
    }
    else if(a==="runBt"){
      var b={module:document.getElementById("b_mod").value,coins:Number(document.getElementById("b_coins").value)||8};
      var rs=await post("/api/backtest",b);if(!rs||!rs.id){toast("Başlamadı","err");return;}
      S.jobId=rs.id;S.job={status:"çalışıyor",progress:0};render();pollJob();
    }
  }catch(err){console.error(err);toast("Hata: "+err.message,"err");}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});
function pollJob(){if(!S.jobId)return;api("/api/backtest/"+S.jobId).then(function(j){if(j){S.job=j;if(S.tab==="bt")render();}if(j&&j.status==="çalışıyor")setTimeout(pollJob,2000);});}

/* ══════════════════════════════════════════════════════════════════════════════
   BAŞLAT
   ══════════════════════════════════════════════════════════════════════════════ */
renderNav();renderTop();refresh();setInterval(refresh,5000);
</script>
