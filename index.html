<meta charset="utf-8">

<style>
:root{--bg:#080b0f;--panel:#10151b;--panel-2:#151b23;--panel-3:#1c242e;--line:#222b36;--line-soft:#181f28;--txt:#e9eef5;--mut:#8a94a3;--mut-2:#5a6472;--green:#0ecb81;--green-dim:rgba(14,203,129,.12);--red:#f6465d;--red-dim:rgba(246,70,93,.12);--gold:#fcd535;--gold-dim:rgba(252,213,53,.12);--blue:#4b9cf5;--blue-dim:rgba(75,156,245,.12);--purple:#a855f7;--purple-dim:rgba(168,85,247,.12);--shadow:0 24px 60px -28px rgba(0,0,0,.95);--shadow-sm:0 12px 30px -20px rgba(0,0,0,.9);--r:16px;--r-sm:11px;--mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;--ease:cubic-bezier(.22,.61,.36,1)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1100px 620px at 8% -12%,rgba(252,213,53,.05),transparent 60%),var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid rgba(252,213,53,.6);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#26303b;border-radius:99px;border:2px solid var(--bg)}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--green)}.dn{color:var(--red)}.mut{color:var(--mut)}.gold{color:var(--gold)}.blue{color:var(--blue)}.purple{color:var(--purple)}
.hide{display:none!important}
#app{display:flex;min-height:100vh}
#side{width:240px;flex:0 0 240px;position:sticky;top:0;height:100vh;z-index:60;display:flex;flex-direction:column;padding:18px 12px 12px;overflow-y:auto;background:linear-gradient(180deg,#0c1117,#090d12);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.brand .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#ffe066,#f0b90b 58%,#c99400);color:#0a0d11;font-size:17px;box-shadow:0 10px 24px -10px rgba(252,213,53,.7)}
.brand b{display:block;font-size:16px;letter-spacing:-.015em}
.brand .ver{display:inline-flex;gap:5px;margin-top:4px;font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.nav-group{margin-top:13px}
.nav-group>h6{margin:0 0 6px;padding:0 12px;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--mut-2);font-weight:800}
.nav{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:10px;color:#aeb7c3;font-size:13.5px;text-align:left;transition:.16s var(--ease)}
.nav i{width:17px;text-align:center;font-size:12.5px;color:var(--mut-2)}
.nav:hover{background:var(--panel);color:var(--txt)}
.nav.on{background:linear-gradient(90deg,rgba(252,213,53,.13),rgba(252,213,53,.04));color:var(--gold);font-weight:700}
.nav.on i{color:var(--gold)}
.nav.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 4px 4px 0;background:var(--gold)}
.nav .cnt{margin-left:auto;min-width:21px;padding:0 6px;border-radius:99px;font-size:10px;font-weight:800;text-align:center;line-height:17px;color:var(--mut);background:var(--panel-2);border:1px solid var(--line)}
.nav.on .cnt{background:var(--gold-dim);border-color:rgba(252,213,53,.28);color:var(--gold)}
.side-foot{margin-top:auto;padding:14px 12px 4px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--mut-2);line-height:1.9}
.side-foot .row{display:flex;justify-content:space-between;gap:10px}
.side-foot .row span:last-child{color:#aeb7c3}
#wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:9px;height:60px;padding:0 18px;background:rgba(8,11,15,.84);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
#top>*{flex:0 0 auto}
#main{width:100%;max-width:1600px;margin:0 auto;padding:22px;flex:1}
#foot{padding:18px 22px 26px;font-size:11px;color:var(--mut-2);text-align:center}
.mkt{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:800;white-space:nowrap}
.mkt.long{color:var(--green);background:var(--green-dim);border-color:rgba(14,203,129,.28)}
.mkt.short{color:var(--red);background:var(--red-dim);border-color:rgba(246,70,93,.28)}
.mkt.neutral{color:var(--mut)}
.tick{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12px;white-space:nowrap}
.tick b{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--mut)}
.tick .p{font-family:var(--mono);font-size:11.5px;color:#cdd5df}
.chipbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:11px;font-weight:700;color:var(--mut);white-space:nowrap;transition:.16s}
.chipbtn:hover{color:var(--txt);border-color:#33404d}
.chipbtn.on{color:var(--green);background:var(--green-dim);border-color:rgba(14,203,129,.28)}
.chipbtn.warn{color:var(--gold);background:var(--gold-dim);border-color:rgba(252,213,53,.28)}
.chipbtn.off{color:var(--mut-2)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:9px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut-2);display:inline-block}
.dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(14,203,129,.16)}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--mut);border:1px solid transparent;transition:.16s}
.icon-btn:hover{background:var(--panel-2);border-color:var(--line);color:var(--txt)}
#menu{display:none}
.card{background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,0) 42%),var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.panel-pad{padding:16px 18px}
.panel-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:800;margin-bottom:12px}
.panel-title .mut{font-weight:600}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.sigs{grid-template-columns:repeat(auto-fill,minmax(278px,1fr))}
.kpi{position:relative;padding:15px 16px 14px;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;border-radius:0 2px 2px 0;background:var(--line)}
.kpi.g::after{background:var(--green)}.kpi.r::after{background:var(--red)}.kpi.y::after{background:var(--gold)}
.kpi .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:800}
.kpi .v{margin-top:8px;font-size:23px;font-weight:750;letter-spacing:-.02em;line-height:1.15}
.kpi .s{margin-top:4px;font-size:11.5px;color:var(--mut)}
.sec{display:flex;align-items:center;gap:12px;margin:26px 0 12px;min-height:20px}
.sec h3{margin:0;font-size:14px;font-weight:800;white-space:nowrap}
.sec h3 i{color:var(--mut-2);font-size:11.5px;margin-right:7px}
.sec .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec .more{font-size:11px;color:var(--mut);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:7px;border:1px solid transparent;font-size:10.5px;font-weight:800;line-height:1.7;white-space:nowrap}
.chip.long{color:var(--green);background:var(--green-dim);border-color:rgba(14,203,129,.26)}
.chip.short{color:var(--red);background:var(--red-dim);border-color:rgba(246,70,93,.26)}
.chip.gold{color:var(--gold);background:var(--gold-dim);border-color:rgba(252,213,53,.26)}
.chip.neutral{color:var(--mut);background:rgba(132,142,156,.11);border-color:rgba(132,142,156,.2)}
.chip.blue{color:var(--blue);background:var(--blue-dim);border-color:rgba(75,156,245,.26)}
.chip.purple{color:var(--purple);background:var(--purple-dim);border-color:rgba(168,85,247,.26)}
.bar{height:4px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--green);transition:width .4s var(--ease)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-size:12.5px;font-weight:700;white-space:nowrap;transition:.16s var(--ease)}
.btn:hover{background:var(--panel-3);border-color:#33404d}
.btn.gold{background:linear-gradient(180deg,#ffe066,#fcd535);border-color:var(--gold);color:#12140a}
.btn.green{background:linear-gradient(180deg,#17d98b,#0ecb81);border-color:var(--green);color:#03231a}
.btn.red{background:linear-gradient(180deg,#ff5a70,#f6465d);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.lg{padding:15px 16px;font-size:13.5px;width:100%}
.btn.xs{padding:3px 8px;font-size:10px;border-radius:7px;gap:5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{width:100%;height:38px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:#0a0e13;color:var(--txt);font-size:13px;outline:none}
.inp:focus{border-color:rgba(252,213,53,.55);box-shadow:0 0 0 3px rgba(252,213,53,.09)}
select.inp{appearance:none;padding-right:30px}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--mut)}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.form-grid label{display:flex;flex-direction:column;gap:6px;font-size:10.5px;font-weight:700;color:var(--mut)}
.form-grid input,.form-grid select{height:38px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:#0a0e13;color:var(--txt);font-size:13px;outline:none}
.form-grid input:focus,.form-grid select:focus{border-color:rgba(252,213,53,.55)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.tbl th{position:sticky;top:0;z-index:2;padding:10px 14px;text-align:left;background:var(--panel);border-bottom:1px solid var(--line);font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:rgba(255,255,255,.022)}
.tbl tbody tr.click{cursor:pointer}
.tbl td.wrap{white-space:normal}
.scroll{overflow:auto;border-radius:var(--r);max-height:min(72vh,760px)}
.tbl-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 9px;font-size:11px;color:var(--mut)}
.empty{padding:26px 18px;text-align:center;color:var(--mut);font-size:12.5px}
.empty i{display:block;font-size:20px;margin-bottom:9px;color:var(--mut-2)}
.note{padding:12px 15px;margin-bottom:12px;font-size:12px;line-height:1.65;border-radius:var(--r-sm)}
.note i{margin-right:6px}
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,.9fr);gap:22px;padding:20px 22px;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow-sm);background:radial-gradient(120% 170% at 0% 0%,rgba(252,213,53,.07),transparent 55%),linear-gradient(180deg,#121820,#0d1117)}
.hero-label{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.hero-dir{display:flex;align-items:center;gap:12px;margin:9px 0 12px}
.hero-score{font-size:26px;font-weight:750;letter-spacing:-.03em}
.hero-why{margin:11px 0 0;font-size:11.5px;line-height:1.6;color:var(--mut)}
.hero-side{display:flex;flex-direction:column;gap:9px;justify-content:center}
.mini{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:1px solid var(--line-soft);background:rgba(255,255,255,.018)}
.mini i{width:30px;height:30px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);font-size:12px;color:var(--gold)}
.mini .t{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut-2)}
.mini .v{font-size:12.5px;font-weight:800}
.mini .s{font-size:10.5px;color:var(--mut-2)}
.sig{position:relative;display:flex;flex-direction:column;gap:11px;padding:14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 45%),var(--panel);cursor:pointer;overflow:hidden;transition:transform .18s var(--ease),border-color .18s,box-shadow .18s}
.sig:hover{transform:translateY(-2px);border-color:#33404d;box-shadow:var(--shadow-sm)}
.sig::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;border-radius:0 2px 2px 0;background:var(--line)}
.sig.long::before{background:var(--green)}.sig.short::before{background:var(--red)}
.sig-h{display:flex;align-items:center;gap:8px}
.sig-h .sym{font-size:15px;font-weight:800}
.sig-h .sym span{font-size:9.5px;font-weight:700;color:var(--mut-2);margin-left:3px}
.sig-h .age{margin-left:auto;font-size:10.5px;color:var(--mut-2)}
.sig-mod{font-size:10.5px;color:var(--mut);margin-top:-5px}
.sig-px{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:9px 10px;border-radius:10px;border:1px solid var(--line-soft);background:#0a0e13}
.sig-px div{display:flex;flex-direction:column;gap:2px;min-width:0}
.sig-px span{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut-2)}
.sig-px b{font-size:12px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis}
.sig-f{display:flex;align-items:center;gap:10px;margin-top:2px}
.sig-f .conf{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.sig-f .conf .bar{flex:1}
.sig-f .conf em{font-style:normal;font-size:10px;color:var(--mut);white-space:nowrap}
.sig-f .pnl{font-size:12.5px;font-weight:800;white-space:nowrap}
.sig-tags{display:flex;flex-wrap:wrap;gap:5px}
.ctrl{display:grid;grid-template-columns:2fr 1.1fr;gap:12px}
.pos{display:flex;flex-direction:column;gap:10px;padding:14px}
.pos-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pos-h .sym{font-size:14px;font-weight:800}
.pos-h .lev{margin-left:auto;font-size:10.5px;color:var(--mut)}
.pos-px{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-size:11.5px}
.pos-px span{color:var(--mut)}
.pos-px b{float:right;font-family:var(--mono)}
.pos .pnl{font-size:19px;font-weight:750;letter-spacing:-.02em}
.pos .pnl small{font-size:11.5px;font-weight:600;margin-left:5px;opacity:.85}
.mod-card{display:flex;align-items:center;gap:12px;padding:14px;text-align:left;transition:transform .16s var(--ease),border-color .16s}
.mod-card:hover{transform:translateY(-1px);border-color:#33404d}
.mod-ico{width:37px;height:37px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);font-size:14px}
.mod-card.auto .mod-ico{color:var(--green)}.mod-card.pump .mod-ico{color:var(--gold)}.mod-card.lt .mod-ico{color:var(--blue)}.mod-card.mom .mod-ico{color:var(--purple)}
.mod-body{min-width:0;display:flex;flex-direction:column;gap:2px}
.mod-body b{font-size:13px}
.mod-body span{font-size:10.5px;color:var(--mut)}
.mod-cnt{margin-left:auto;font-size:21px;font-weight:750}
.chartwrap{border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#0a0e13}
#modal{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow-y:auto;background:rgba(0,0,0,.8);backdrop-filter:blur(4px)}
.modal-box{width:100%;max-width:980px;border-radius:16px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:16px 18px 20px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:0 20px;margin-top:14px;font-size:12px}
.info-grid .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line-soft)}
.info-grid .row span{color:var(--mut)}
.info-grid .row b{text-align:right;font-weight:700}
#toast{position:fixed;left:50%;bottom:22px;z-index:120;max-width:min(560px,92vw);padding:11px 18px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);box-shadow:var(--shadow);font-size:12.5px;line-height:1.5;opacity:0;pointer-events:none;transform:translate(-50%,8px);transition:.22s var(--ease)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-color:rgba(14,203,129,.45)}
#toast.err{border-color:rgba(246,70,93,.45)}
.rej-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.rej-filter .btn{padding:5px 11px;font-size:10.5px}
.rej-filter .btn.on{background:var(--gold);border-color:var(--gold);color:#12140a}
.tag{padding:1px 6px;border-radius:5px;font-size:9px;font-weight:800;margin-left:5px;white-space:nowrap}
.tag.ok{color:var(--green);background:var(--green-dim)}
.tag.warn{color:var(--gold);background:var(--gold-dim)}
.tag.bad{color:var(--red);background:var(--red-dim)}
.ai-cell{min-width:180px;max-width:320px;white-space:normal;font-size:11px;line-height:1.5}
.ai-cell .meta{margin-top:4px;font-size:9.5px;color:var(--mut-2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line-soft);font-size:12px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--mut)}
.kv b{text-align:right}
.skeleton{padding:26px;text-align:center;color:var(--mut);font-size:12.5px}
@media(max-width:1280px){.hide-md{display:none!important}}
@media(max-width:1100px){.ctrl{grid-template-columns:1fr}.hero{grid-template-columns:1fr;gap:16px}}
@media(max-width:980px){#side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .26s var(--ease);box-shadow:var(--shadow)}#side.open{transform:none}#menu{display:grid}#main{padding:16px}.hide-sm{display:none!important}#backdrop{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.62)}}
@media(max-width:640px){#top{height:54px;padding:0 12px}.kpi .v{font-size:20px}.hero{padding:16px}.hero-score{font-size:22px}}
</style>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function px(x){const v=Number(x);if(!Number.isFinite(v)||v===0)return '—';return v>=100?v.toFixed(2):v>=1?v.toFixed(4):v>=0.01?v.toFixed(6):v.toFixed(8)}
function dur(ms){ms=Math.max(0,Number(ms)||0);const s=Math.floor(ms/1000);if(s<60)return s+' sn';const m=Math.floor(s/60);return m<60?m+' dk':Math.floor(m/60)+' sa '+(m%60)+' dk'}
function cls(x){return Number(x)>=0?'up':'dn'}

function resChip(r){const k=/^(TP1|TP2)$/.test(r)?'long':/^SL$/.test(r)?'short':/^(MOMENTUM|STALL|TIME|AI_.*|REVERSAL)$/.test(r)?'gold':'neutral';return '<span class="chip '+k+'">'+esc(RES[r]||r||'—')+'</span>'}
function aiChip(a){if(!a||!a.decision)return '';const d=a.decision,k=d==='APPROVE'?'long':d==='REJECT'?'short':'gold';const l=d==='APPROVE'?'AI ONAY':d==='REJECT'?'AI RED':'AI BEKLE';return '<span class="chip '+k+'"><i class="fa-solid fa-brain"></i> '+l+(a.confidence!=null?' · '+num(a.confidence,0):'')+'</span>'}
function sigStatusChip(s){const st=s&&s.status;if(st==='AKTIF')return '<span class="chip long">AKTİF</span>';if(st==='AI_BEKLIYOR')return '<span class="chip gold">AI KUYRUKTA</span>';if(st==='BEKLE')return '<span class="chip gold">AI TEKRAR DENEYECEK</span>';return resChip(s&&s.result)}
function sec(t,r){return '<div class="sec"><h3>'+t+'</h3><div class="line"></div>'+(r?'<div class="more">'+r+'</div>':'')+'</div>'}

function sigCard(s){
  const act=s.status==='AKTIF',pAI=s.status==='AI_BEKLIYOR',wait=s.status==='BEKLE';
  const pl=s.pl||{},usdt=pl.usdt,livePx=pl.price;
  const conf=clamp(Number(s.conf)||0,0,100),i=s.info||{};let tags='';
  const stopVal=s.curSl||s.sl;
  if(s.marketAlign==='TERS')tags+='<span class="chip gold">PİYASAYA TERS</span>';
  else if(s.marketAlign==='UYUMLU')tags+='<span class="chip long">PİYASA UYUMLU</span>';
  if(s.module==='AUTO'){
    tags+='<span class="chip '+(s.dir==='LONG'?'long':'short')+'">'+(i.setup||'')+'</span>';
    tags+='<span class="chip neutral">1m %'+num(i.chg1,2)+'</span><span class="chip neutral">Hacim '+num(i.volRatio,1)+'x</span><span class="chip neutral">'+num(i.progAtr,1)+' ATR</span>';
  }
  if(s.module==='PUMP'){
    tags+='<span class="chip gold">5m '+(i.trend||'')+'</span>';
    if(i.trigger)tags+='<span class="chip neutral">tetik '+px(i.trigger)+'</span>';
  }
  if(s.module==='MOM'){
    tags+='<span class="chip purple">Sıkışma '+num(i.rangeAtr,1)+' ATR</span>';
    if(i.level)tags+='<span class="chip neutral">seviye '+px(i.level)+'</span>';
  }
  if(s.module==='LT'){
    tags+='<span class="chip blue">'+esc(i.tf||'')+' '+esc(i.shape||'')+'</span><span class="chip gold">'+(i.line||'')+' ÇİZGİ TEMAS</span>';
  }
  if(pAI)tags+='<span class="chip gold"><i class="fa-solid fa-hourglass-half"></i> AI KUYRUKTA</span>';
  else if(wait)tags+='<span class="chip gold">AI TEKRAR DENEYECEK</span>';
  else if(s.ai)tags+=aiChip(s.ai);
  if(act&&s.tp1Hit)tags+='<span class="chip long">TP1 ✔</span>';
  if(!act&&!pAI&&!wait)tags+=resChip(s.result);
  if(s.tradeable===false)tags+='<span class="chip neutral">SANAL</span>';
  if(s.note)tags+='<span class="chip neutral" title="'+esc(s.note)+'">NOT</span>';
  let bar='';
  if(act&&s.module==='AUTO'&&s.tradeable){
    bar='<button class="btn green" style="padding:7px;font-size:12px;width:100%;margin-top:4px" data-act="execSig" data-id="'+esc(s.id)+'">Onayla ve Aç</button>';
  }
  const pnlHtml=(act&&livePx)?'<span class="pnl '+cls(usdt)+'">'+(pl.netR!=null?sgn(pl.netR,2)+'R ':'')+(usdt!=null?'('+sgn(usdt,2)+'U)':'')+'</span>':'<span class="pnl mut">—</span>';
  return '<article class="sig '+(s.dir==='LONG'?'long':'short')+'" data-act="open" data-id="'+esc(s.id)+'">'+
    '<div class="sig-h"><div class="sym">'+esc(s.base)+'<span>USDT</span></div>'+dirChip(s.dir)+'<span class="age">'+dur(Date.now()-s.createdAt)+'</span></div>'+
    '<div class="sig-mod"><i class="fa-solid '+MODICON[s.module]+'" style="margin-right:5px"></i>'+esc(MODN[s.module]||s.module)+'</div>'+
    '<div class="sig-px"><div><span>Giriş</span><b>'+px(s.entry)+'</b></div><div><span>Hedef</span><b class="up">'+px(s.tp1)+'</b></div><div><span>Stop</span><b class="dn">'+px(stopVal)+'</b></div></div>'+
    '<div class="sig-f"><div class="conf"><div class="bar"><i style="width:'+conf+'%;background:'+(conf>=70?'var(--green)':conf>=50?'var(--gold)':'var(--red)')+'"></i></div><em>Matematik '+num(conf,0)+'</em></div>'+pnlHtml+'</div>'+
    bar+(tags?'<div class="sig-tags">'+tags+'</div>':'')+'</article>';
}

function drawChartLW(el,d){
  if(!el||!d||!d.candles||!d.candles.length)return;
  if(!window.LightweightCharts){el.innerHTML="<div class='empty'>Grafik kütüphanesi yüklenemedi.</div>";return}
  el.innerHTML='';
  const chart=LightweightCharts.createChart(el,{layout:{background:{color:'#0a0e13'},textColor:'#8a94a3'},grid:{vertLines:{color:'#151c24'},horzLines:{color:'#151c24'}},timeScale:{timeVisible:true,secondsVisible:false,rightOffset:12,borderColor:'#222b36'},rightPriceScale:{borderColor:'#222b36'},crosshair:{mode:0,vertLine:{color:'#3a4653',labelBackgroundColor:'#1c242e'},horzLine:{color:'#3a4653',labelBackgroundColor:'#1c242e'}}});
  const cs=chart.addCandlestickSeries({upColor:'#0ecb81',downColor:'#f6465d',borderVisible:false,wickUpColor:'#0ecb81',wickDownColor:'#f6465d'});
  const cdata=d.candles.map(c=>({time:Math.floor(c[0]/1000),open:c[1],high:c[2],low:c[3],close:c[4]}));
  cs.setData(cdata);
  const noScale={autoscaleInfoProvider:()=>null};
  const drawLine=(arr,color,w)=>{if(!arr||!arr.length)return;const s=chart.addLineSeries(Object.assign({color,lineWidth:w,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false},noScale));const seen=new Set(),pts=[];for(const [t,v] of arr){const k=Math.floor(t/1000);if(!seen.has(k)){seen.add(k);pts.push({time:k,value:v})}}s.setData(pts.sort((a,b)=>a.time-b.time))};
  if(d.ema20){const s=chart.addLineSeries({color:'#f0b90b',lineWidth:1,priceLineVisible:false,lastValueVisible:false});s.setData(d.candles.map((c,i)=>d.ema20[i]?{time:Math.floor(c[0]/1000),value:d.ema20[i]}:null).filter(Boolean))}
  if(d.ema50){const s=chart.addLineSeries({color:'#4b9cf5',lineWidth:1,priceLineVisible:false,lastValueVisible:false});s.setData(d.candles.map((c,i)=>d.ema50[i]?{time:Math.floor(c[0]/1000),value:d.ema50[i]}:null).filter(Boolean))}
  if(d.triangle){
    drawLine(d.triangle.upper,'#f6465d',2);
    drawLine(d.triangle.lower,'#0ecb81',2);
    if(d.triangle.upperNow>0)cs.createPriceLine({price:d.triangle.upperNow,color:'#f6465d',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'ÜST'});
    if(d.triangle.lowerNow>0)cs.createPriceLine({price:d.triangle.lowerNow,color:'#0ecb81',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'ALT'});
  }
  const sg=d.signal||{};
  [['entry','#e9eef5','Giriş'],['sl','#f6465d','Stop'],['tp1','#0ecb81','TP1'],['tp2','#0ecb81','TP2']].forEach(([k,c,t])=>{if(sg[k]>0)cs.createPriceLine({price:sg[k],color:c,lineWidth:1,lineStyle:k==='entry'?0:2,axisLabelVisible:true,title:t})});
  const n=cdata.length;
  const triFrom=d.triangle&&Number.isFinite(Number(d.triangle.firstIdx))?Number(d.triangle.firstIdx):n-320;
  const visFrom=d.triangle?Math.max(0,Math.min(n-320,triFrom-20)):Math.max(0,n-150);
  chart.timeScale().setVisibleLogicalRange({from:visFrom,to:n+30});
  try{new ResizeObserver(()=>{if(chart)chart.applyOptions({width:el.clientWidth,height:el.clientHeight})}).observe(el)}catch(e){}
}

    else if(a==='execSig'){if(!confirm('İşlemi aç?'))return;const r=await post('/api/signal/'+encodeURIComponent(id)+'/execute');toast(r&&r.ok?'Açıldı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err');closeModal();await refresh()}
    else if(a==='aiReview'){const old=t.innerHTML;t.disabled=true;t.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>';const r=await post('/api/signal/'+encodeURIComponent(id)+'/ai');if(r&&r.ok){toast('AI yorumu alındı','ok');await openDetail(id)}else{toast((r&&r.error)||'AI yanıt vermedi','err');t.disabled=false;t.innerHTML=old}}
    else if(a==='aiTest'){toast('Test ediliyor…');const r=await post('/api/ai/test');let okc=0,tot=0;((r&&r.providers)||[]).forEach(p=>{tot++;if(p.ok)okc++});toast('Test: '+okc+'/'+tot,okc?'ok':'err');await refresh()}
    else if(a==='aiReset'){await post('/api/ai/reset');toast('Soğumalar sıfırlandı','ok');await refresh()}
    else if(a==='closePaper'){if(confirm('Pozisyonu kapat?')){const r=await post('/api/paper/'+encodeURIComponent(id)+'/close');toast(r&&r.ok?'Kapatıldı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err');await refresh()}}
    else if(a==='closeLive'){if(confirm('Canlı pozisyonu kapat?')){const r=await post('/api/live/'+encodeURIComponent(id)+'/close');toast(r&&r.ok?'Kapatıldı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err');await refresh()}}
    else if(a==='toggleAutoTrade'){const on=g(S.state,'settings.autoTrade',false)===true;const r=await post('/api/auto/toggle',{enabled:!on});toast(r&&r.ok?('OtoTrade '+(!on?'AÇIK':'KAPALI')):((r&&r.error)||'Hata'),r&&r.ok?'ok':'err');await refresh()}
    else if(a==='scanAuto'){toast('Taranıyor…');await post('/api/auto/scan');await refresh()}
    else if(a==='refreshLive'){toast('Bitget bakiye/pozisyon…');const r=await post('/api/live/sync');toast(r&&r.ok?'Senkronize':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err');await refresh()}
    else if(a==='toggleMode'){const cm=g(S.state,'settings.tradeMode','paper'),nw=cm==='live'?'paper':'live';if(nw==='live'&&!confirm('Gerçek para! Emin misin?'))return;const r=await post('/api/trade/mode',{mode:nw});toast(r&&r.ok?('Mod '+nw.toUpperCase()):((r&&r.error)||'Hata'),r&&r.ok?'ok':'err');await refresh()}
    else if(a==='saveAutoSet'){const av=i=>{const el=document.getElementById(i);return el?Number(el.value):undefined};const r=await post('/api/paper/settings',{autoMaxOpen:av('a_max'),riskPct:av('a_risk'),leverage:av('a_lev'),margin:av('a_margin')});toast(r&&r.ok?'Kaydedildi':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err');await refresh()}
    else if(a==='resetPaper'){if(confirm('Sanal cüzdan sıfırlansın mı?')){const r=await post('/api/paper/reset');toast(r&&r.ok?'Sıfırlandı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err');await refresh()}}
    else if(a==='saveToken'){const el=document.getElementById('set_token');const tk=el?el.value.trim():'';try{tk?localStorage.setItem('alphason_token',tk):localStorage.removeItem('alphason_token')}catch(e){}S.token=tk;S.unauth=false;toast('Token kaydedildi','ok');await refresh()}
    else if(a==='clearToken'){try{localStorage.removeItem('alphason_token')}catch(e){}S.token='';S.unauth=false;toast('Token temizlendi','ok');await refresh()}
    else if(a==='saveAllSettings'){
      const setObj={};
      ['tradeMode','margin','leverage','riskPct','autoMaxOpen','dailyLossPct','paperEquity','includeStocks','maxSpreadPct','minQuoteVol','topN','ltTfs'].forEach(k=>{
        const el=document.getElementById('set_'+k);if(!el)return;
        let val=el.value;
        if(val==='true')val=true;else if(val==='false')val=false;else if(el.type==='number')val=Number(val);
        setObj[k]=val;
      });
      if(setObj.ltTfs)setObj.ltTfs=String(setObj.ltTfs).split(',').map(x=>x.trim()).filter(x=>['1h','2h'].includes(x));
      const r=await post('/api/paper/settings',setObj);
      if(!r||!r.ok){toast((r&&r.error)||'Hata','err');return}
      if(setObj.tradeMode)await post('/api/trade/mode',{mode:setObj.tradeMode});
      toast('Ayarlar kaydedildi','ok');
      await refresh();
    }
    else if(a==='diag'){const elD=document.getElementById('diagBox');if(elD){elD.classList.remove('hide');elD.textContent='Yükleniyor...';try{const j=await api(url);elD.textContent=JSON.stringify(j,null,2)}catch(err){elD.textContent='Hata: '+err.message}}}
  }catch(err){console.error(err);toast('Hata: '+(err&&err.message?err.message:''),'err')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
async function init(){
  renderNav();renderTop();
  await refresh();
  setInterval(()=>refresh({soft:true}),5000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh({soft:true})});
}
init();
</script>
</body>
</html>
