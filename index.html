<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlphaSon v91.0 · Sade Sinyal Paneli</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0b0e11; --panel:#12161c; --panel2:#171c24; --line:#1e242e; --line-soft:#181e27;
  --txt:#eaecef; --mut:#848e9c; --up:#0ecb81; --dn:#f6465d; --warn:#f0b90b;
  --blue:#4a9efd; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 60px}
/* Üst bar */
header.top{position:sticky;top:0;z-index:50;background:rgba(11,14,17,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px}
.logo small{font-weight:500;color:var(--mut);font-size:11px;margin-left:6px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-weight:700;font-size:12px;border:1px solid var(--line)}
.badge.LONG{color:var(--up);border-color:rgba(14,203,129,.4);background:rgba(14,203,129,.08)}
.badge.SHORT{color:var(--dn);border-color:rgba(246,70,93,.4);background:rgba(246,70,93,.08)}
.badge.NOTR{color:var(--mut)}
.badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.clock{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px}
.conn{font-size:11px;color:var(--mut)}
.conn.on{color:var(--up)}
/* Sekmeler */
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
nav.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--mut);padding:8px 16px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600}
nav.tabs button.on{color:var(--txt);border-color:var(--blue);background:rgba(74,158,253,.1)}
nav.tabs button .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--blue);color:#fff;font-size:11px;text-align:center}
/* Kartlar */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h3{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;font-weight:700}
.grid{display:grid;gap:14px}
.grid.mods{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.mod{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.mod .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mod .name{font-weight:700;font-size:15px}
.mod .tf{color:var(--mut);font-size:12px;margin-left:8px}
.mod .desc{color:var(--mut);font-size:12px;min-height:48px}
.stat-row{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mut)}
.stat .g{color:var(--up)} .stat .r{color:var(--dn)} .stat .y{color:var(--warn)}
/* Anahtar */
.switch{position:relative;width:44px;height:24px;flex:none;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#2b3340;border-radius:999px;transition:.2s}
.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--up)}
.switch input:checked + .slider:before{transform:translateX(20px)}
/* Tablo */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.tbl th{position:sticky;top:0;background:var(--panel2);color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:rgba(255,255,255,.02)}
.tbl tr.clickable{cursor:pointer}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700}
.chip.LONG{color:var(--up);background:rgba(14,203,129,.12)}
.chip.SHORT{color:var(--dn);background:rgba(246,70,93,.12)}
.chip.KAR{color:#03251a;background:var(--up)}
.chip.ZARAR{color:#fff;background:var(--dn)}
.chip.ZAMAN{color:#333;background:var(--mut)}
.chip.ABIK{color:var(--blue);background:rgba(74,158,253,.12)}
.chip.TREND{color:var(--blue);background:rgba(74,158,253,.12)}
.chip.HIZLI{color:var(--warn);background:rgba(240,185,11,.12)}
.chip.LT{color:#b388ff;background:rgba(179,136,255,.12)}
.pos{color:var(--up)} .neg{color:var(--dn)} .mut{color:var(--mut)}
.empty{padding:40px;text-align:center;color:var(--mut)}
/* Piyasa özeti */
.mkt{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.mkt .it b{font-size:16px;display:block;font-variant-numeric:tabular-nums}
.mkt .it span{font-size:11px;color:var(--mut)}
/* Ayarlar */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.set-row:last-child{border-bottom:none}
.set-row label{font-size:13px}
.set-row .hint{display:block;font-size:11px;color:var(--mut)}
.set-row input[type=number]{width:90px;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font-size:13px}
.btn{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.danger{background:transparent;border:1px solid rgba(246,70,93,.5);color:var(--dn)}
.btn:disabled{opacity:.4;cursor:default}
/* Toast + modal */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:100}
#toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:960px;max-height:90vh;overflow:auto;padding:18px}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.kv .b{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kv .b span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;display:block}
.kv .b b{font-size:15px;font-variant-numeric:tabular-nums}
#tvChart{height:460px;border-radius:10px;overflow:hidden;background:#000}
.logs{font:12px/1.6 ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:300px;overflow:auto;white-space:pre-wrap;color:#b7c0cc}
@media(max-width:640px){ .clock{display:none} .tbl{min-width:640px} }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo">ALPHASON<small id="ver">v91.0</small></div>
  <span class="badge NOTR" id="mktBadge"><span class="dot"></span><span id="mktDir">PİYASA …</span></span>
  <span class="conn" id="conn">bağlanıyor…</span>
  <span class="clock" id="clock"></span>
</div></header>

<div class="wrap">
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal">
  <div class="mhead"><b id="mTitle">Sinyal</b><button class="btn ghost" onclick="closeModal()">Kapat</button></div>
  <div id="mBody"></div>
</div></div>
<div id="toast"></div>

<script>
/* ── Durum ─────────────────────────────────────────────────────────────── */
const S = { tab: 'home', state: null, sig: { active: [], closed: [] }, watch: { lt: [] }, token: localStorage.getItem('as_token') || '', logs: [] };
const TABS = [
  ['home', 'Ana Sayfa'], ['signals', 'Sinyaller'], ['trend', 'Trend Takip'],
  ['hizli', 'Hızlı Trend'], ['lt', 'LT Üçgen'], ['settings', 'Ayarlar']
];
const MOD_LABEL = { TREND: 'Trend Takip', HIZLI: 'Hızlı Trend', LT: 'LT Üçgen' };

/* ── API ───────────────────────────────────────────────────────────────── */
async function api(path, opts) {
  const headers = Object.assign({}, (opts && opts.headers) || {});
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) { askToken(); throw new Error('yetkisiz'); }
  return r.json();
}
function post(path, body) { return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); }
function askToken() {
  const t = prompt('API token gerekli (ALPHASON_API_TOKEN):', S.token);
  if (t !== null) { S.token = t.trim(); localStorage.setItem('as_token', S.token); refresh(); }
}
function toast(m) { const el = document.getElementById('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2500); }

/* ── Yardımcılar ───────────────────────────────────────────────────────── */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const px = v => (v == null || !(v > 0)) ? '—' : (+v).toPrecision(6).replace(/\.?0+$/, '');
const pct = v => (v == null || !isFinite(v)) ? '—' : (v > 0 ? '+' : '') + (+v).toFixed(2) + '%';
const cls = v => v > 0 ? 'pos' : v < 0 ? 'neg' : 'mut';
const dur = ms => { if (!(ms > 0)) return '—'; const s = Math.floor(ms / 1000); if (s < 60) return s + 'sn'; const m = Math.floor(s / 60); if (m < 60) return m + 'dk'; return Math.floor(m / 60) + 'sa ' + (m % 60) + 'dk'; };
const time = ts => ts ? new Date(ts).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—';
const dateTime = ts => ts ? new Date(ts).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
function openCount(mod) { return S.sig.active.filter(s => s.module === mod).length; }

/* ── Sekme çubuğu ──────────────────────────────────────────────────────── */
function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = TABS.map(t => {
    const c = t[0] === 'signals' ? S.sig.active.length : (t[0] === 'trend' ? openCount('TREND') : t[0] === 'hizli' ? openCount('HIZLI') : t[0] === 'lt' ? openCount('LT') : 0);
    return '<button class="' + (S.tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + (c > 0 ? '<span class="cnt">' + c + '</span>' : '') + '</button>';
  }).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
}

/* ── Görünümler ────────────────────────────────────────────────────────── */
function sigRow(s, live) {
  const pnl = s.status === 'ACIK' ? s.livePnlPct : (((s.exit - s.entry) / s.entry * 100) * (s.dir === 'LONG' ? 1 : -1));
  const status = s.status === 'ACIK'
    ? '<span class="chip ABIK">AÇIK ' + pct(pnl) + '</span>'
    : '<span class="chip ' + s.result + '">' + (s.result === 'KAR' ? 'KAR' : s.result === 'ZARAR' ? 'ZARAR' : 'SÜRE DOLDU') + '</span>';
  return '<tr class="clickable" data-sig="' + esc(s.id) + '">' +
    '<td><b>' + esc(s.base) + '</b></td>' +
    '<td><span class="chip ' + s.module + '">' + esc(MOD_LABEL[s.module] || s.module) + '</span></td>' +
    '<td><span class="chip ' + s.dir + '">' + s.dir + '</span></td>' +
    '<td>' + px(s.entry) + '</td>' +
    '<td class="pos">' + px(s.tp1) + '</td>' +
    '<td class="pos">' + px(s.tp2) + '</td>' +
    '<td class="neg">' + px(s.sl) + '</td>' +
    (live
      ? '<td>' + px(s.livePrice) + '</td><td class="' + cls(pnl) + '">' + pct(pnl) + '</td><td class="mut">' + dur(s.maxAgeMs - (Date.now() - s.createdAt)) + '</td>'
      : '<td>' + px(s.exit) + '</td><td class="' + cls(pnl) + '"><b>' + pct(pnl) + '</b></td><td class="mut">' + dateTime(s.exitAt) + '</td>') +
    '<td>' + (s.conf || '—') + '</td>' +
    '<td>' + status + '</td></tr>';
}

function openSignalsTable(list) {
  if (!list.length) return '<div class="empty">Açık sinyal yok. Piyasa yönü netleşince stratejiler sinyal üretir; nötr piyasada beklerler.</div>';
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Coin</th><th>Strateji</th><th>Yön</th><th>Giriş</th><th>TP1</th><th>TP2</th><th>Stop</th><th>Canlı</th><th>Getiri</th><th>Kalan</th><th>Güven</th><th>Durum</th></tr></thead><tbody>' +
    list.map(s => sigRow(s, true)).join('') + '</tbody></table></div>';
}

function viewHome() {
  const st = S.state; if (!st) return '<div class="empty">Yükleniyor…</div>';
  const m = st.market;
  const mods = Object.keys(st.modules).map(k => {
    const md = st.modules[k], s = md.stats;
    return '<div class="mod"><div class="head"><div><span class="name">' + esc(md.label) + '</span><span class="tf">' + esc(md.tf) + '</span></div>' +
      '<label class="switch"><input type="checkbox" data-mod="' + k + '"' + (md.enabled ? ' checked' : '') + '><span class="slider"></span></label></div>' +
      '<div class="desc">' + descOf(k) + '</div>' +
      '<div class="stat-row">' +
      '<div class="stat"><b class="g">' + s.win + '</b><span>Kazanç</span></div>' +
      '<div class="stat"><b class="r">' + s.loss + '</b><span>Kayıp</span></div>' +
      '<div class="stat"><b class="y">' + s.time + '</b><span>Süre doldu</span></div>' +
      '<div class="stat"><b>' + (s.winPct == null ? '—' : '%' + s.winPct) + '</b><span>Başarı</span></div>' +
      '<div class="stat"><b>' + s.open + '</b><span>Açık sinyal</span></div>' +
      '</div></div>';
  }).join('');
  return '<div class="card"><div class="mkt">' +
    '<div class="it"><span>Piyasa yönü</span><b class="' + (m.dir === 'LONG' ? 'pos' : m.dir === 'SHORT' ? 'neg' : 'mut') + '">' + m.dir + '</b></div>' +
    '<div class="it"><span>Yön skoru</span><b>' + Math.round((m.score || 0) * 100) + '/100</b></div>' +
    '<div class="it"><span>Genişlik</span><b>%' + Math.round((m.breadth || 0) * 100) + '</b></div>' +
    '<div class="it"><span>BTC skor</span><b>' + (m.btc == null ? '—' : m.btc.toFixed(2)) + '</b></div>' +
    '<div class="it"><span>ETH skor</span><b>' + (m.eth == null ? '—' : m.eth.toFixed(2)) + '</b></div>' +
    '<div class="it"><span>Evren</span><b>' + st.universe + ' coin</b></div>' +
    '<div class="it"><span>İzlenen üçgen</span><b>' + (st.scan ? st.scan.ltWatch : 0) + '</b></div>' +
    '</div><div class="mut" style="font-size:12px;margin-top:10px">' + esc(m.why || '') + '</div></div>' +
    '<div class="grid mods">' + mods + '</div>' +
    '<div class="card"><h3>Açık Sinyaller (' + S.sig.active.length + ')</h3>' + openSignalsTable(S.sig.active) + '</div>';
}
function descOf(k) {
  return k === 'TREND' ? '15m EMA21/55 rejimi + geri çekilmeye yapı kırılımı. Piyasa yönüyle aynı yönde, nötr piyasada sessiz.'
    : k === 'HIZLI' ? '5m EMA9/21 kesişimi + VWAP + RSI + hacim. Günlük hızlı işlemler için; taze kesişimde sinyal.'
    : '1h+2h üçgen: en yüksek tepe + en düşük dip çizgileri sağda birleşir. Fiyat çizgiye DEYİNCE sinyal.';
}

function viewSignals() {
  const closed = S.sig.closed;
  const rows = closed.map(s => sigRow(s, false)).join('');
  return '<div class="card"><h3>Açık Sinyaller (' + S.sig.active.length + ')</h3>' + openSignalsTable(S.sig.active) + '</div>' +
    '<div class="card"><h3>Geçmiş (' + closed.length + ') — Hedefe giden KAR, stopa giden ZARAR</h3>' +
    (rows ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Coin</th><th>Strateji</th><th>Yön</th><th>Giriş</th><th>TP1</th><th>TP2</th><th>Stop</th><th>Çıkış</th><th>Sonuç %</th><th>Kapanış</th><th>Güven</th><th>Durum</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<div class="empty">Henüz kapanan sinyal yok.</div>') + '</div>';
}

function viewModule(mod) {
  const mine = S.sig.active.filter(s => s.module === mod);
  const closed = S.sig.closed.filter(s => s.module === mod).slice(0, 30);
  return '<div class="card"><h3>' + esc(MOD_LABEL[mod]) + ' — Açık (' + mine.length + ')</h3>' + openSignalsTable(mine) + '</div>' +
    '<div class="card"><h3>Son Kapananlar</h3>' +
    (closed.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Coin</th><th>Yön</th><th>Giriş</th><th>TP1</th><th>TP2</th><th>Stop</th><th>Çıkış</th><th>Sonuç %</th><th>Kapanış</th><th>Güven</th><th>Durum</th></tr></thead><tbody>' +
      closed.map(s => sigRow(s, false)).join('') + '</tbody></table></div>' : '<div class="empty">Yok.</div>') + '</div>';
}

function viewLT() {
  const rows = (S.watch.lt || []).map(t =>
    '<tr class="clickable" data-coin="' + esc(t.base) + '"><td><b>' + esc(t.base) + '</b></td><td class="mut">' + esc(t.tf) + '</td>' +
    '<td>' + esc(t.shape) + '</td><td>' + px(t.upper) + '</td><td>' + px(t.lower) + '</td>' +
    '<td>' + (t.widthPct == null ? '—' : '%' + t.widthPct) + '</td><td>%' + Math.round((t.compression || 0) * 100) + '</td>' +
    '<td>%' + Math.round((t.maturity || 0) * 100) + '</td><td class="mut">' + (t.apexX || '—') + ' mum</td><td>' + (t.score || 0) + '</td></tr>').join('');
  return '<div class="card"><h3>İzlenen Üçgenler (' + (S.watch.lt || []).length + ') — fiyat çizgiye değince sinyal düşer</h3>' +
    (rows ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Coin</th><th>TF</th><th>Form</th><th>Üst Çizgi</th><th>Alt Çizgi</th><th>Genişlik</th><th>Sıkışma</th><th>Olgunluk</th><th>Apeks</th><th>Skor</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<div class="empty">İzlenen üçgen yok. Simetrik sıkışma oluştuğunda burada listelenir.</div>') + '</div>' +
    '<div class="card"><h3>LT Üçgen Açık Sinyaller</h3>' + openSignalsTable(S.sig.active.filter(s => s.module === 'LT')) + '</div>';
}

function viewSettings() {
  const st = S.state.settings;
  const num = (k, label, hint) => '<div class="set-row"><div><label>' + label + '</label><span class="hint">' + hint + '</span></div><input type="number" step="1" data-set="' + k + '" value="' + st[k] + '"></div>';
  return '<div class="card"><h3>Strateji Ayarları</h3>' +
    num('trendScan', 'Trend Takip tarama boyutu', 'Tur başına taranan coin sayısı') +
    num('hizliScan', 'Hızlı Trend tarama boyutu', 'Tur başına taranan coin sayısı') +
    num('ltScan', 'LT Üçgen izleme boyutu', 'Round-robin ile izlenen coin sayısı') +
    num('signalCooldownMin', 'Sinyal bekleme süresi (dk)', 'Aynı coin + stratejide tekrar sinyal için bekleme') +
    num('minStopPct', 'Stop alt sınırı (%)', 'Girişe göre minimum stop mesafesi') +
    num('maxStopPct', 'Stop üst sınırı (%)', 'Girişe göre maksimum stop mesafesi') +
    '<div style="margin-top:14px"><button class="btn" id="saveSet">Kaydet</button></div></div>' +
    '<div class="card"><h3>Geçmiş</h3><div class="set-row"><div><label>Sinyal geçmişini temizle</label><span class="hint">Kapanan sinyalleri siler; açık olanlar ve istatistik sıfırlanır</span></div><button class="btn danger" id="clearHist">Temizle</button></div></div>' +
    '<div class="card"><h3>Sistem Günlüğü</h3><div class="logs" id="logBox">' + esc(S.logs.join('\\n') || '—') + '</div></div>';
}

/* ── Sinyal detay + grafik ─────────────────────────────────────────────── */
function openSignal(id) {
  const s = S.sig.active.concat(S.sig.closed).find(x => x.id === id);
  if (!s) return;
  const pnl = s.status === 'ACIK' ? s.livePnlPct : (((s.exit - s.entry) / s.entry * 100) * (s.dir === 'LONG' ? 1 : -1));
  document.getElementById('mTitle').textContent = s.base + ' · ' + MOD_LABEL[s.module] + ' · ' + s.dir;
  document.getElementById('mBody').innerHTML =
    '<div class="kv">' +
    kv('Giriş', px(s.entry)) + kv('TP1', px(s.tp1)) + kv('TP2', px(s.tp2)) + kv('Stop', px(s.sl)) +
    kv('Risk', '%' + (s.riskPct || 0)) + kv('Güven', s.conf || '—') + kv('Sonuç', s.status === 'ACIK' ? 'AÇIK ' + pct(pnl) : (s.result === 'KAR' ? 'KAR' : s.result === 'ZARAR' ? 'ZARAR' : 'SÜRE DOLDU') + ' (' + pct(pnl) + ')') +
    kv('Zaman', time(s.createdAt)) + kv('TF', s.tf || '—') +
    '</div>' +
    (s.note ? '<div class="mut" style="font-size:12px;margin-bottom:10px">' + esc(s.note) + '</div>' : '') +
    '<div id="tvChart"></div>' +
    '<div style="margin-top:10px"><a href="https://www.tradingview.com/chart/?symbol=BITGET:' + encodeURIComponent(s.base) + 'USDT.P" target="_blank">TradingView\'da aç ↗</a></div>';
  document.getElementById('modalBg').classList.add('open');
  loadTV(s.base);
}
function kv(k, v) { return '<div class="b"><span>' + k + '</span><b>' + v + '</b></div>'; }
function loadTV(base) {
  const box = document.getElementById('tvChart');
  box.innerHTML = '';
  const s = document.createElement('script');
  s.src = 'https://s3.tradingview.com/tv.js';
  s.onload = () => {
    if (!window.TradingView) return;
    new TradingView.widget({
      container_id: 'tvChart', symbol: 'BITGET:' + base + 'USDT.P',
      interval: '60', theme: 'dark', style: '1', locale: 'tr', toolbar_bg: '#000',
      enable_publishing: false, hide_side_toolbar: false, allow_symbol_change: true,
      width: '100%', height: 460, studies: ['MASimple@tv-basicstudies']
    });
  };
  s.onerror = () => { box.innerHTML = '<div class="empty">Grafik yüklenemedi (çevrimdışı?). TradingView bağlantısı gerekli.</div>'; };
  document.head.appendChild(s);
}
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });

/* ── Render ────────────────────────────────────────────────────────────── */
function render() {
  renderTabs();
  const v = document.getElementById('view');
  if (S.tab === 'home') v.innerHTML = viewHome();
  else if (S.tab === 'signals') v.innerHTML = viewSignals();
  else if (S.tab === 'trend') v.innerHTML = viewModule('TREND');
  else if (S.tab === 'hizli') v.innerHTML = viewModule('HIZLI');
  else if (S.tab === 'lt') v.innerHTML = viewLT();
  else v.innerHTML = viewSettings();
  // olaylar
  v.querySelectorAll('input[data-mod]').forEach(el => el.onchange = async () => {
    const r = await post('/api/module/' + el.dataset.mod + '/toggle', { enabled: el.checked });
    if (r && r.ok) { toast(el.checked ? 'Açıldı' : 'Kapatıldı'); refresh(); } else toast((r && r.error) || 'Hata');
  });
  v.querySelectorAll('tr[data-sig]').forEach(tr => tr.onclick = () => openSignal(tr.dataset.sig));
  v.querySelectorAll('tr[data-coin]').forEach(tr => tr.onclick = () => {
    document.getElementById('mTitle').textContent = tr.dataset.coin;
    document.getElementById('mBody').innerHTML = '<div id="tvChart"></div>';
    document.getElementById('modalBg').classList.add('open');
    loadTV(tr.dataset.coin);
  });
  const save = document.getElementById('saveSet');
  if (save) save.onclick = async () => {
    const body = {};
    v.querySelectorAll('input[data-set]').forEach(i => body[i.dataset.set] = Number(i.value));
    const r = await post('/api/settings', body);
    toast(r && r.ok ? 'Kaydedildi' : ((r && r.error) || 'Hata')); refresh();
  };
  const clr = document.getElementById('clearHist');
  if (clr) clr.onclick = async () => {
    if (!confirm('Kapanan tüm sinyal geçmişi silinsin mi?')) return;
    const r = await post('/api/signals/clear', {});
    toast(r && r.ok ? 'Temizlendi' : 'Hata'); refresh();
  };
}

/* ── Veri akışı ────────────────────────────────────────────────────────── */
async function refresh() {
  try {
    const [st, sg, wa] = await Promise.all([api('/api/state'), api('/api/signals'), S.tab === 'lt' ? api('/api/watch') : Promise.resolve(null)]);
    S.state = st; S.sig = sg;
    if (wa) S.watch = wa;
    const conn = document.getElementById('conn');
    conn.textContent = 'bağlı · ' + (st.counts ? st.counts.open : 0) + ' açık sinyal';
    conn.classList.add('on');
    const badge = document.getElementById('mktBadge');
    badge.className = 'badge ' + st.market.dir;
    document.getElementById('mktDir').textContent = 'PİYASA ' + st.market.dir;
    document.getElementById('ver').textContent = st.version || 'v91.0';
    render();
  } catch (e) {
    const conn = document.getElementById('conn');
    conn.textContent = 'bağlantı yok'; conn.classList.remove('on');
  }
}
async function refreshLogs() {
  try { const d = await api('/api/logs'); S.logs = d.logs || []; } catch (e) {}
  if (S.tab === 'settings') { const b = document.getElementById('logBox'); if (b) b.textContent = S.logs.join('\n') || '—'; }
}
setInterval(refresh, 5000);
setInterval(refreshLogs, 10000);
setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('tr-TR'); }, 1000);
refresh(); refreshLogs();
</script>
</body>
