<style>

.inp{width:100%;height:38px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:#0a0e13;color:var(--txt);font-size:13px;outline:none;transition:border-color .16s,box-shadow .16s}

label.fld{display:flex;flex-direction:column;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--mut)}

  .hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,.9fr);gap:22px;padding:20px 22px;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow-sm);background:radial-gradient(120% 170% at 0% 0%,rgba(252,213,53,.075),transparent 55%),radial-gradient(120% 170% at 100% 0%,rgba(14,203,129,.06),transparent 55%),linear-gradient(180deg,#121820,#0d1117)}

function resChip(r){ var k=/^(TP1|TP2)$/.test(r)?'long':/^SL$/.test(r)?'short':/^(FADE|MOMENTUM|ZAYIF_IVME|STALL|APPROVAL_EXPIRED|AI_EXIT|AI_.*|REVERSAL|FIRST_IMPULSE)$/.test(r)?'gold':'neutral'; return '<span class="chip '+k+'">'+esc(RES[r]||r||'—')+'</span>'; }
function verdictChip(a){ if(!a||!a.verdict) return ''; var v=String(a.verdict).toUpperCase(), k=v==='ONY'?'long':v==='RED'?'short':'gold'; var l=a.verdictLabel||(v==='ONY'?'GİRİLİR':v==='RED'?'GİRİLMEZ':'BEKLE'); return '<span class="chip '+k+'"><i class="fa-solid fa-brain"></i> '+esc(l)+(a.trust?' · '+esc(a.trust):'')+(a.score!=null?' '+num(a.score,0):'')+'</span>'; }

function drawChartLW(el, d){
  if(!el||!d||!d.candles||!d.candles.length) return;
  if(!window.LightweightCharts){ el.innerHTML="<div class='empty'>Grafik kütüphanesi yüklenemedi.</div>"; return; }
  el.innerHTML='';
  const chart=LightweightCharts.createChart(el,{ layout:{ background:{ color:'#0a0e13' }, textColor:'#8a94a3' }, grid:{ vertLines:{ color:'#151c24' }, horzLines:{ color:'#151c24' } }, timeScale:{ timeVisible:true, secondsVisible:false, rightOffset:12, borderColor:'#222b36' }, rightPriceScale:{ borderColor:'#222b36' } });
  const cs=chart.addCandlestickSeries({ upColor:'#0ecb81', downColor:'#f6465d', borderVisible:false, wickUpColor:'#0ecb81', wickDownColor:'#f6465d' });
  const cdata=d.candles.map(c=>({ time:Math.floor(c[0]/1000), open:c[1], high:c[2], low:c[3], close:c[4] }));
  cs.setData(cdata);
  const noScale={ autoscaleInfoProvider:()=>null };
  const drawLine=(arr,color,w)=>{ if(!arr||!arr.length) return; const s=chart.addLineSeries(Object.assign({ color, lineWidth:w, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false },noScale)); const seen=new Set(), pts=[]; for(const [t,v] of arr){ const k=Math.floor(t/1000); if(!seen.has(k)){ seen.add(k); pts.push({ time:k, value:v }); } } s.setData(pts.sort((a,b)=>a.time-b.time)); };
  const e20=chart.addLineSeries({ color:'#f0b90b', lineWidth:1, priceLineVisible:false, lastValueVisible:false });
  e20.setData(d.candles.map((c,i)=>d.ema20&&d.ema20[i]?{ time:Math.floor(c[0]/1000), value:d.ema20[i] }:null).filter(Boolean));
  const e50=chart.addLineSeries({ color:'#4b9cf5', lineWidth:1, priceLineVisible:false, lastValueVisible:false });
  e50.setData(d.candles.map((c,i)=>d.ema50&&d.ema50[i]?{ time:Math.floor(c[0]/1000), value:d.ema50[i] }:null).filter(Boolean));
  if(d.triangle){ drawLine(d.triangle.upper||d.triangle.upperFull,'#f6465d',2); drawLine(d.triangle.lower||d.triangle.lowerFull,'#0ecb81',2); }
  (d.supportResistance||[]).forEach(l=>cs.createPriceLine({ price:l.v, color:l.kind==='R'?'#f6465d88':'#0ecb8188', lineWidth:1, lineStyle:2, axisLabelVisible:true, title:l.l }));
  (d.levels||[]).forEach(l=>cs.createPriceLine({ price:l.v, color:l.col||'#848e9c', lineWidth:1, lineStyle:2, axisLabelVisible:true, title:l.l }));
  const sg=d.signal||{};
  [['entry','#e9eef5','Giriş'],['sl','#f6465d','Stop'],['tp1','#0ecb81','TP1'],['tp2','#0ecb81','TP2']].forEach(([k,c,t])=>{ if(sg[k]>0) cs.createPriceLine({ price:sg[k], color:c, lineWidth:1, lineStyle:k==='entry'?0:2, axisLabelVisible:true, title:t }); });
  const n=cdata.length;
  const triFrom=d.triangle&&Number.isFinite(Number(d.triangle.firstIdx))?Number(d.triangle.firstIdx):n-320;
  const visFrom=d.triangle?Math.max(0,Math.min(n-320,triFrom-20)):Math.max(0,n-150);
  chart.timeScale().setVisibleLogicalRange({ from:visFrom, to:n+30 });
  try{ new ResizeObserver(()=>{ if(chart) chart.applyOptions({ width:el.clientWidth, height:el.clientHeight }); }).observe(el); }catch(e){}
}

  async function refresh(opts){
  if(S.busy) return;
  S.busy=true;
  try{
    const st=await api('/api/state');
    if(st&&st.version){ S.state=st; S.lastAt=Date.now(); S.unauth=false; }
    const t=S.tab, jobs=[];
    if(MODN[t]){
      jobs.push(api('/api/signals?module='+t).then(d=>{ if(d) S.sig[t]=d; }));
      if(t==='PUMP'){ jobs.push(api('/api/paper').then(d=>{ if(d) S.paper=d; })); jobs.push(api('/api/watch/scalp').then(d=>{ if(d) S.watch.scalp=d; })); }
      if(t==='AUTO'){ jobs.push(api('/api/paper').then(d=>{ if(d) S.paper=d; })); jobs.push(api('/api/auto/watch').then(d=>{ if(d) S.autoWatch=d; })); }
      if(t==='LT'){ jobs.push(api('/api/watch/lt').then(d=>{ if(d) S.watch.lt=d; })); }
    }
    if(t==='home'||t==='opps'){
      jobs.push(api('/api/signals').then(d=>{ if(!d) return; const by={}; (d.active||[]).forEach(s=>{ const b=by[s.module]=by[s.module]||{ active:[],closed:[] }; b.active.push(s); }); S.sig=by; }));
      jobs.push(api('/api/paper').then(d=>{ if(d) S.paper=d; }));
      jobs.push(api('/api/rejections').then(d=>{ if(d) S.rejections=d; }));
      jobs.push(api('/api/watch/lt').then(d=>{ if(d) S.watch.lt=d; }));
      jobs.push(api('/api/watch/scalp').then(d=>{ if(d) S.watch.scalp=d; }));
      jobs.push(api('/api/auto/watch').then(d=>{ if(d) S.autoWatch=d; }));
    }
    if(t==='outcomes') jobs.push(api('/api/outcomes').then(d=>{ if(d) S.outcomes=d; }));
    if(t==='ai'){ jobs.push(api('/api/ai/status').then(d=>{ if(d) S.ai=d; })); jobs.push(api('/api/ai/history').then(d=>{ if(d&&d.items){ S.ai=S.ai||{}; S.ai.hist=d.items; } })); }
    if(t==='radar') jobs.push(api('/api/radar').then(d=>{ if(d) S.radar=d; }));
    if(t==='stats') jobs.push(api('/api/stats').then(d=>{ if(d) S.stats=d; }));
    if(t==='strat'&&!S.strat) jobs.push(api('/api/strategies').then(d=>{ if(d) S.strat=d; }));
    await Promise.all(jobs);
  }catch(e){ console.error(e); }
  S.busy=false;
  try{ render(opts); }catch(e){ console.error(e); }
}

    else if(a==='closeModal') closeModal();
    else if(a==='rejFilter'){ S.rejFilter=id; render(); }
    else if(a==='closeSig'){ if(confirm('Sinyali kapat?')){ const r=await post('/api/signal/'+encodeURIComponent(id)+'/close'); toast(r&&r.ok?'Kapatıldı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); closeModal(); await refresh(); } }
    else if(a==='execSig'){ if(!confirm('İşlemi aç?')) return; const r=await post('/api/signal/'+encodeURIComponent(id)+'/execute'); toast(r&&r.ok?'Açıldı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); closeModal(); await refresh(); }
    else if(a==='aiWatch'){ if(!base) return; const old=t.innerHTML; t.disabled=true; t.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>'; const kd=kind||'lt'; const rr=await post('/api/watch/'+kd+'/'+encodeURIComponent(base)+'/ai'); if(rr&&rr.ok){ toast('AI değerlendirmesi alındı','ok'); await refresh(); } else { toast((rr&&rr.error)||'AI yanıt vermedi','err'); t.disabled=false; t.innerHTML=old; } }
    else if(a==='aiReview'){ const old=t.innerHTML; t.disabled=true; t.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>'; const r=await post('/api/signal/'+encodeURIComponent(id)+'/ai'); if(r&&r.ok){ toast('AI raporu alındı','ok'); await openDetail(id); } else { toast((r&&r.error)||'AI yanıt vermedi','err'); t.disabled=false; t.innerHTML=old; } }
    else if(a==='aiTest'){ toast('Test ediliyor…'); const r=await api('/api/ai/test'); let okc=0,tot=0; ((r&&r.providers)||[]).forEach(p=>(p.results||[]).forEach(m=>{ tot++; if(m.ok) okc++; })); toast('Test: '+okc+'/'+tot,okc?'ok':'err'); await refresh(); }
    else if(a==='aiDiscover'){ toast('Modeller taranıyor…'); const r=await post('/api/ai/discover'); toast(r&&r.ok?'Keşif tamam':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); }
    else if(a==='aiReset'){ await post('/api/ai/reset'); toast('Soğumalar ve sayaçlar sıfırlandı','ok'); await refresh(); }
    else if(a==='aiBrief'){ const r=await post('/api/ai/brief'); toast(r&&r.ok?'Brifing alındı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); }
    else if(a==='closePaper'){ if(confirm('Pozisyonu kapat?')){ const r=await post('/api/paper/'+encodeURIComponent(id)+'/close'); toast(r&&r.ok?'Kapatıldı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); } }
    else if(a==='closeLive'){ if(confirm('Canlı pozisyonu kapat?')){ const r=await post('/api/live/'+encodeURIComponent(id)+'/close'); toast(r&&r.ok?'Canlı kapatıldı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); } }
    else if(a==='toggleAutoTrade'){ const on=g(S.state,'settings.autoTrade',false)===true; const r=await post('/api/auto/toggle',{ enabled:!on }); let msg=r&&r.note?r.note:(r&&r.ok?('OtoTrade '+(!on?'AÇIK':'KAPALI')):'Hata'); msg+=purgeText(r); toast(msg,r&&r.ok?'ok':'err'); await refresh(); }
    else if(a==='scanAuto'){ toast('Pump/dump taranıyor…'); const r=await post('/api/auto/scan'); if(r&&r.items) S.autoWatch=r; toast('Tarama bitti ('+((r&&r.items&&r.items.length)||0)+' aday)','ok'); await refresh(); }
    else if(a==='refreshLive'){ toast('Bitget bakiye/pozisyon…'); const r=await post('/api/live/sync'); toast(r&&r.ok?'Senkronize':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); }
    else if(a==='saveAutoSet'){ const av=i=>{ const el=document.getElementById(i); return el?el.value:undefined; }; const payload={ autoMaxOpen:Number(av('a_max')), riskPct:Number(av('a_risk')), leverage:Number(av('a_lev')), margin:Number(av('a_margin')), autoEntryMode:av('a_entry'), autoExitAi:av('a_exitai')==='true' }; const r=await post('/api/paper/settings',payload); toast((r&&r.ok?'Kaydedildi':((r&&r.error)||'Hata'))+purgeText(r),r&&r.ok?'ok':'err'); await refresh(); }
    else if(a==='toggleMode'){ const cm=g(S.state,'settings.tradeMode','paper'), nw=cm==='live'?'paper':'live'; if(nw==='live'&&!confirm('Gerçek para! Emin misin?')) return; const r=await post('/api/trade/mode',{ mode:nw }); toast(r&&r.ok?('Mod '+nw.toUpperCase()):((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); }
    else if(a==='resetPaper'){ if(confirm('Sanal cüzdan sıfırlansın mı?')){ const r=await post('/api/paper/reset'); toast(r&&r.ok?'Sıfırlandı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); } }
    else if(a==='saveToken'){ const el=document.getElementById('set_token'); const tv=el?el.value.trim():''; try{ tv?localStorage.setItem('alphason_token',tv):localStorage.removeItem('alphason_token'); }catch(e2){} S.token=tv; S.unauth=false; toast(tv?'Token kaydedildi':'Token temizlendi','ok'); await refresh(); }
    else if(a==='clearToken'){ try{ localStorage.removeItem('alphason_token'); }catch(e2){} S.token=''; S.unauth=false; toast('Token temizlendi','ok'); await refresh(); }
    else if(a==='saveAllSettings'){
      const setObj={};
      ['tradeMode','margin','leverage','riskPct','pullbackRiskPct','autoMaxOpen','dailyLossPct','maxHeatPct','maxDailyTrades','maxConsecLoss','stallSec','autoAiPerHour','paperEquity','includeStocks','maxOpen','minConf','maxSpreadPct','ltTfs','autoEntryMode','autoExitAi','trendStrategy','trendAiMode'].forEach(k=>{
        const el=document.getElementById('set_'+k); if(!el) return;
        let val=el.value;
        if(val==='true') val=true; else if(val==='false') val=false; else if(el.type==='number') val=Number(val);
        setObj[k]=val;
      });
      if(setObj.ltTfs) setObj.ltTfs=String(setObj.ltTfs).split(',').map(x=>x.trim()).filter(x=>['1h','2h','4h'].includes(x));
      const r=await post('/api/paper/settings',setObj);
      if(!r||!r.ok){ toast((r&&r.error)||'Hata','err'); return; }
      if(setObj.tradeMode) await post('/api/trade/mode',{ mode:setObj.tradeMode });
      toast('Ayarlar kaydedildi'+purgeText(r),'ok');
      await refresh();
    }
    else if(a==='diag'){ const elD=document.getElementById('diagBox'); if(elD){ elD.classList.remove('hide'); elD.textContent='Yükleniyor...'; try{ const j=await api(url); elD.textContent=JSON.stringify(j,null,2); }catch(err){ elD.textContent='Hata: '+err.message; } } }
    else if(a==='runBt'){ const b={ module:document.getElementById('b_mod').value, coins:Number(document.getElementById('b_coins').value)||10 }; const r=await post('/api/backtest',b); if(!r||!r.id){ toast('Başlamadı','err'); return; } S.jobId=r.id; S.job={ status:'çalışıyor', progress:0 }; render(); pollJob(); }
  }catch(err){ console.error(err); toast('Hata: '+(err&&err.message?err.message:''),'err'); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
function pollJob(){
  if(!S.jobId) return;
  api('/api/backtest/'+S.jobId).then(j=>{
    if(j){ S.job=j; if(S.tab==='bt'){ const br=document.getElementById('btres'); if(br){ if(j.status==='çalışıyor') br.innerHTML='<div class="card panel-pad">Çalışıyor… <b class="num">'+num((j.progress||0)*100,0)+'%</b></div>'; else if(j.status==='hata') br.innerHTML='<div class="card panel-pad dn">'+esc(j.error)+'</div>'; else if(j.result){ const r=j.result; br.innerHTML='<div class="card panel-pad"><div class="mut">'+esc(r.label)+' · '+r.trades+' işlem</div><div style="margin-top:8px;display:flex;gap:16px;flex-wrap:wrap">Net R: <b class="'+cls(g(r,'all.sumR',0))+'">'+sgn(g(r,'all.sumR',0),2)+'</b> · Başarı: <b>'+num(g(r,'all.winRate',0),1)+'%</b> · PF: <b>'+num(g(r,'all.pf',0),2)+'</b></div><p style="font-size:11px;color:var(--mut-2);margin-top:8px">'+esc(r.note||'')+'</p></div>'; } } } }
    if(j&&j.status==='çalışıyor') setTimeout(pollJob,2000);
  });
}
async function init(){
  renderNav(); renderTop();
  await refresh();
  setInterval(()=>refresh({ soft:true }),5000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh({ soft:true }); });
}
init();
</script>
</body>
