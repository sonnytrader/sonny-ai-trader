<style>
:root{
  --bg:#080b0f;--bg-soft:#0b0f14;--panel:#10151b;--panel-2:#151b23;--panel-3:#1c242e;
  --line:#222b36;--line-soft:#181f28;--txt:#e9eef5;--mut:#8a94a3;--mut-2:#5a6472;
  --green:#0ecb81;--green-2:#16e394;--green-dim:rgba(14,203,129,.12);
  --red:#f6465d;--red-dim:rgba(246,70,93,.12);
  --gold:#fcd535;--gold-2:#f0b90b;--gold-dim:rgba(252,213,53,.12);
  --blue:#4b9cf5;--blue-dim:rgba(75,156,245,.12);
  --purple:#a855f7;--purple-dim:rgba(168,85,247,.12);
  --shadow:0 24px 60px -28px rgba(0,0,0,.95);--shadow-sm:0 12px 30px -20px rgba(0,0,0,.9);
  --r:16px;--r-sm:11px;--r-xs:8px;
  --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 620px at 8% -12%,rgba(252,213,53,.055),transparent 60%),
    radial-gradient(900px 520px at 98% -4%,rgba(14,203,129,.05),transparent 55%),
    var(--bg);
  color:var(--txt);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid rgba(252,213,53,.6);outline-offset:2px}
::selection{background:rgba(252,213,53,.24)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#26303b;border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#33404d}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:var(--mono)}
.up{color:var(--green)}.dn{color:var(--red)}.mut{color:var(--mut)}.gold{color:var(--gold)}.blue{color:var(--blue)}
.hide{display:none!important}
#app{display:flex;min-height:100vh}
#side{
  width:252px;flex:0 0 252px;position:sticky;top:0;height:100vh;z-index:60;
  display:flex;flex-direction:column;padding:18px 12px 12px;overflow-y:auto;
  background:linear-gradient(180deg,#0c1117 0%,#090d12 100%);
  border-right:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px}
.brand .logo{
  width:38px;height:38px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(135deg,#ffe066,#f0b90b 58%,#c99400);color:#0a0d11;font-size:17px;
  box-shadow:0 10px 24px -10px rgba(252,213,53,.7);
}
.brand b{display:block;font-size:16px;letter-spacing:-.015em;line-height:1.15}
.brand .ver{display:inline-flex;align-items:center;gap:5px;margin-top:4px;font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.brand .ver .dot{width:5px;height:5px}
.nav-group{margin-top:14px}
.nav-group>h6{margin:0 0 6px;padding:0 12px;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--mut-2);font-weight:800}
.nav{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:10px;color:#aeb7c3;font-size:13.5px;text-align:left;transition:background .16s var(--ease),color .16s var(--ease)}
.nav i{width:17px;text-align:center;font-size:12.5px;color:var(--mut-2);transition:color .16s}
.nav:hover{background:var(--panel);color:var(--txt)}
.nav.on{background:linear-gradient(90deg,rgba(252,213,53,.13),rgba(252,213,53,.04));color:var(--gold);font-weight:700}
.nav.on i{color:var(--gold)}
.nav.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 4px 4px 0;background:var(--gold);box-shadow:0 0 12px rgba(252,213,53,.55)}
.nav .cnt{margin-left:auto;min-width:21px;padding:0 6px;border-radius:99px;font-size:10px;font-weight:800;text-align:center;line-height:17px;color:var(--mut);background:var(--panel-2);border:1px solid var(--line)}
.nav.on .cnt{background:var(--gold-dim);border-color:rgba(252,213,53,.28);color:var(--gold)}
.side-foot{margin-top:auto;padding:14px 12px 4px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--mut-2);line-height:1.9}
.side-foot b{color:var(--mut);font-weight:700}
.side-foot .row{display:flex;justify-content:space-between;gap:10px}
.side-foot .row span:last-child{color:#aeb7c3}
#wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:9px;height:60px;padding:0 18px;
  background:rgba(8,11,15,.84);backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
}
#top::-webkit-scrollbar{display:none}
#top>*{flex:0 0 auto}
#main{width:100%;max-width:1600px;margin:0 auto;padding:22px;flex:1}
#foot{padding:18px 22px 26px;font-size:11px;color:var(--mut-2);text-align:center;line-height:1.8}
#foot b{color:var(--mut)}
.mkt{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:800;white-space:nowrap}
.mkt.long{color:var(--green);background:var(--green-dim);border-color:rgba(14,203,129,.28)}
.mkt.short{color:var(--red);background:var(--red-dim);border-color:rgba(246,70,93,.28)}
.mkt.neutral{color:var(--mut)}
.tick{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12px;white-space:nowrap}
.tick b{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--mut)}
.tick .p{font-family:var(--mono);font-size:11.5px;color:#cdd5df}
.chipbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:11px;font-weight:700;color:var(--mut);white-space:nowrap;transition:border-color .16s,color .16s,background .16s}
.chipbtn:hover{color:var(--txt);border-color:#33404d}
.chipbtn.on{color:var(--green);background:var(--green-dim);border-color:rgba(14,203,129,.28)}
.chipbtn.off{color:var(--mut-2)}
.chipbtn.warn{color:var(--gold);background:var(--gold-dim);border-color:rgba(252,213,53,.28)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:9px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut-2);display:inline-block;flex:0 0 auto}
.dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(14,203,129,.16)}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--mut);border:1px solid transparent;transition:.16s}
.icon-btn:hover{background:var(--panel-2);border-color:var(--line);color:var(--txt)}
#menu{display:none}
.card{background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,0) 42%),var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.panel-pad{padding:16px 18px}
.panel-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:800;margin-bottom:12px}
.panel-title .mut{font-weight:600}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(176px,1fr))}
.sigs{grid-template-columns:repeat(auto-fill,minmax(278px,1fr))}
.kpi{position:relative;padding:15px 16px 14px;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;border-radius:0 2px 2px 0;background:var(--line)}
.kpi.up::after,.kpi.g::after{background:var(--green);box-shadow:0 0 14px rgba(14,203,129,.35)}
.kpi.dn::after,.kpi.r::after{background:var(--red);box-shadow:0 0 14px rgba(246,70,93,.3)}
.kpi.y::after{background:var(--gold);box-shadow:0 0 14px rgba(252,213,53,.3)}
.kpi .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:800}
.kpi .v{margin-top:8px;font-size:23px;font-weight:750;letter-spacing:-.02em;line-height:1.15}
.kpi .s{margin-top:4px;font-size:11.5px;color:var(--mut)}
.sec{display:flex;align-items:center;gap:12px;margin:26px 0 12px;min-height:20px}
.sec h3{margin:0;font-size:14px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.sec h3 i{color:var(--mut-2);font-size:11.5px;margin-right:7px}
.sec .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec .more{font-size:11px;color:var(--mut);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:7px;border:1px solid transparent;font-size:10.5px;font-weight:800;line-height:1.7;white-space:nowrap}
.chip.long{color:var(--green);background:var(--green-dim);border-color:rgba(14,203,129,.26)}
.chip.short{color:var(--red);background:var(--red-dim);border-color:rgba(246,70,93,.26)}
.chip.gold{color:var(--gold);background:var(--gold-dim);border-color:rgba(252,213,53,.26)}
.chip.neutral{color:var(--mut);background:rgba(132,142,156,.11);border-color:rgba(132,142,156,.2)}
.chip.blue{color:var(--blue);background:var(--blue-dim);border-color:rgba(75,156,245,.26)}
.chip.purple{color:var(--purple);background:var(--purple-dim);border-color:rgba(168,85,247,.26)}
.chip.live{color:#fff;background:var(--red)}
.chip.xs{font-size:9.5px;padding:1px 6px}
.bar{height:4px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--green);transition:width .4s var(--ease)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-size:12.5px;font-weight:700;white-space:nowrap;transition:.16s var(--ease)}
.btn:hover{background:var(--panel-3);border-color:#33404d}
.btn.gold{background:linear-gradient(180deg,#ffe066,#fcd535);border-color:var(--gold);color:#12140a}
.btn.gold:hover{filter:brightness(1.06)}
.btn.green{background:linear-gradient(180deg,#17d98b,#0ecb81);border-color:var(--green);color:#03231a}
.btn.red{background:linear-gradient(180deg,#ff5a70,#f6465d);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.lg{padding:15px 16px;font-size:13.5px;width:100%}
.btn.xs{padding:3px 8px;font-size:10px;border-radius:7px;gap:5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{width:100%;height:38px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:#0a0e13;color:var(--txt);font-size:13px;outline:none;transition:border-color .16s,box-shadow .16s}
.inp:focus{border-color:rgba(252,213,53,.55);box-shadow:0 0 0 3px rgba(252,213,53,.09)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--mut)}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-top:12px}
.form-grid label{display:flex;flex-direction:column;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--mut)}
.form-grid input,.form-grid select{height:38px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:#0a0e13;color:var(--txt);font-size:13px;outline:none}
.form-grid input:focus,.form-grid select:focus{border-color:rgba(252,213,53,.55)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.tbl th{position:sticky;top:0;z-index:2;padding:10px 14px;text-align:left;background:var(--panel);border-bottom:1px solid var(--line);font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:rgba(255,255,255,.022)}
.tbl tbody tr.click{cursor:pointer}
.tbl td.wrap{white-space:normal}
.tbl .mut{color:var(--mut)}
.scroll{overflow:auto;border-radius:var(--r);max-height:min(72vh,760px)}
.tbl-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 9px;font-size:11px;color:var(--mut)}
.empty{padding:26px 18px;text-align:center;color:var(--mut);font-size:12.5px}
.empty i{display:block;font-size:20px;margin-bottom:9px;color:var(--mut-2)}
.note{padding:12px 15px;margin-bottom:12px;font-size:12px;line-height:1.65;border-radius:var(--r-sm)}
.note i{margin-right:6px}
.note b{color:#eef2f7}
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,.9fr);gap:22px;padding:20px 22px;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow-sm);
  background:radial-gradient(120% 170% at 0% 0%,rgba(252,213,53,.075),transparent 55%),radial-gradient(120% 170% at 100% 0%,rgba(14,203,129,.06),transparent 55%),linear-gradient(180deg,#121820,#0d1117)}
.hero>div:first-child{display:flex;flex-direction:column;justify-content:center;min-width:0}
.hero-label{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.hero-label .mut{font-weight:600;letter-spacing:0;text-transform:none}
.hero-dir{display:flex;align-items:center;gap:12px;margin:9px 0 12px}
.hero-score{font-size:26px;font-weight:750;letter-spacing:-.03em}
.hero-breadth{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:6px}
.hero-why{margin:11px 0 0;font-size:11.5px;line-height:1.6;color:var(--mut)}
.hero-side{display:flex;flex-direction:column;gap:9px;justify-content:center}
.mini{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:1px solid var(--line-soft);background:rgba(255,255,255,.018)}
.mini i{width:30px;height:30px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);font-size:12px;color:var(--gold)}
.mini .t{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut-2)}
.mini .v{font-size:12.5px;font-weight:800}
.mini .s{font-size:10.5px;color:var(--mut-2)}
.mini>div{min-width:0}
.sig{position:relative;display:flex;flex-direction:column;gap:11px;padding:14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 45%),var(--panel);cursor:pointer;overflow:hidden;transition:transform .18s var(--ease),border-color .18s,box-shadow .18s}
.sig:hover{transform:translateY(-2px);border-color:#33404d;box-shadow:var(--shadow-sm)}
.sig::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;border-radius:0 2px 2px 0;background:var(--line)}
.sig.long::before{background:var(--green)}.sig.short::before{background:var(--red)}
.sig-h{display:flex;align-items:center;gap:8px}
.sig-h .sym{font-size:15px;font-weight:800;letter-spacing:-.01em}
.sig-h .sym span{font-size:9.5px;font-weight:700;color:var(--mut-2);margin-left:3px}
.sig-h .age{margin-left:auto;font-size:10.5px;color:var(--mut-2)}
.sig-mod{font-size:10.5px;color:var(--mut);margin-top:-5px}
.sig-px{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:9px 10px;border-radius:10px;border:1px solid var(--line-soft);background:#0a0e13}
.sig-px div{display:flex;flex-direction:column;gap:2px;min-width:0}
.sig-px span{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut-2)}
.sig-px b{font-size:12px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis}
.sig-f{display:flex;align-items:center;gap:10px;margin-top:2px}
.sig-f .conf{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.sig-f .conf .bar{flex:1}
.sig-f .conf em{font-style:normal;font-size:10px;color:var(--mut);white-space:nowrap}
.sig-f .pnl{font-size:12.5px;font-weight:800;white-space:nowrap}
.sig-tags{display:flex;flex-wrap:wrap;gap:5px}
.ctrl{display:grid;grid-template-columns:2fr 1.1fr;gap:12px}
.pos{display:flex;flex-direction:column;gap:10px;padding:14px}
.pos-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pos-h .sym{font-size:14px;font-weight:800}
.pos-h .lev{margin-left:auto;font-size:10.5px;color:var(--mut)}
.pos-px{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-size:11.5px}
.pos-px span{color:var(--mut)}
.pos-px b{float:right;font-family:var(--mono)}
.pos .pnl{font-size:19px;font-weight:750;letter-spacing:-.02em}
.pos .pnl small{font-size:11.5px;font-weight:600;margin-left:5px;opacity:.85}
.mod-card{display:flex;align-items:center;gap:12px;padding:14px;text-align:left;transition:transform .16s var(--ease),border-color .16s}
.mod-card:hover{transform:translateY(-1px);border-color:#33404d}
.mod-ico{width:37px;height:37px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);font-size:14px}
.mod-card.auto .mod-ico{color:var(--green)}
.mod-card.pump .mod-ico{color:var(--gold)}
.mod-card.lt .mod-ico{color:var(--blue)}
.mod-card.mom .mod-ico{color:var(--purple)}
.mod-body{min-width:0;display:flex;flex-direction:column;gap:2px}
.mod-body b{font-size:13px}
.mod-body span{font-size:10.5px;color:var(--mut)}
.mod-cnt{margin-left:auto;font-size:21px;font-weight:750;letter-spacing:-.02em}
.chartwrap{border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#0a0e13}
#modal{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow-y:auto;background:rgba(0,0,0,.8);backdrop-filter:blur(4px)}
.modal-box{width:100%;max-width:980px;border-radius:16px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:16px 18px 20px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:0 20px;margin-top:14px;font-size:12px}
.info-grid .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line-soft)}
.info-grid .row span{color:var(--mut)}
.info-grid .row b{text-align:right;font-weight:700}
#toast{position:fixed;left:50%;bottom:22px;z-index:120;max-width:min(560px,92vw);padding:11px 18px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);box-shadow:var(--shadow);font-size:12.5px;line-height:1.5;opacity:0;pointer-events:none;transform:translate(-50%,8px);transition:.22s var(--ease)}

function resChip(r){ const k=/^(TP1|TP2)$/.test(r)?'long':/^SL$/.test(r)?'short':/^(FADE|MOMENTUM|ZAYIF_IVME|STALL|APPROVAL_EXPIRED|AI_EXIT|AI_.*|REVERSAL)$/.test(r)?'gold':'neutral'; return '<span class="chip '+k+'">'+esc(RES[r]||r||'—')+'</span>'; }
function aiDecisionChip(a){

function verdictChip(a){ if(!a) return ''; const structured=aiDecisionChip(a); if(structured) return structured; if(!a.verdict) return ''; const v=String(a.verdict).toUpperCase(), k=v==='ONY'?'long':v==='RED'?'short':'gold'; const l=a.verdictLabel||(v==='ONY'?'GİRİLİR':v==='RED'?'GİRİLMEZ':'BEKLE'); return '<span class="chip '+k+'"><i class="fa-solid fa-brain"></i> '+esc(l)+(a.trust?' · '+esc(a.trust):'')+(a.score!=null?' '+num(a.score,0):'')+'</span>'; }

  h+='<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(360px,1fr))">'+(d.strategies||[]).map(x=>{

function btResult(){
  const j=S.job; if(!j) return '';
  if(j.status==='çalışıyor') return '<div class="card panel-pad">Çalışıyor… <b class="num">'+num((j.progress||0)*100,0)+'%</b></div>';
  if(j.status==='hata') return '<div class="card panel-pad dn">'+esc(j.error)+'</div>';
  const r=j.result; if(!r) return '';
  return '<div class="card panel-pad"><div class="mut">'+esc(r.label)+' · '+r.trades+' işlem</div><div style="margin-top:8px;display:flex;gap:16px;flex-wrap:wrap">Net R: <b class="'+cls(g(r,'all.sumR',0))+'">'+sgn(g(r,'all.sumR',0),2)+'</b> · Başarı: <b>'+num(g(r,'all.winRate',0),1)+'%</b> · PF: <b>'+num(g(r,'all.pf',0),2)+'</b></div><p style="font-size:11px;color:var(--mut-2);margin-top:8px">'+esc(r.note||'')+'</p></div>';
}
function aiCtx(){ return S.ai&&S.ai.providers?S.ai:(g(S.state,'ai',{})||{}); }
function briefCard(){

  let h='<div class="card panel-pad"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:12.5px"><i class="fa-solid fa-wand-magic-sparkles gold" style="margin-right:6px"></i>AI Piyasa Brifingi</b>'+(b?verdictChip(b):'<span class="chip neutral">henüz yok</span>')+(b&&b.providerName?'<span class="chip neutral">'+esc(b.providerName)+'</span>':'')+'<span class="mut" style="margin-left:auto;font-size:10.5px">'+num(used,0)+'/'+num(lim,0)+' günlük</span></div>';

    h+='<p style="font-size:12.5px;line-height:1.65;margin:10px 0 0;color:#c9ced6">'+esc(b.summary||b.reason||'')+'</p>';

function aiObservability(ai){

  const val=(o,k)=>num(o&&o[k]||0,0);
  let h='<div class="card panel-pad" style="margin-top:14px"><div class="panel-title">Sinyal → AI Gözlemlenebilirliği <span class="mut">yeniden başlatmadan bu yana + kalıcı sayaçlar</span></div>'+
    '<div class="grid kpis" style="margin-top:10px">'+
    statCard('Taranan',val(totals,'scanned'),'sembol taraması','')+
    statCard('Matematik Aday',val(totals,'candidates'),'AI öncesi','')+
    statCard('AI Tamamlanan',val(totals,'completed'),'kuyruk '+val(totals,'queued'),'')+
    statCard('Onay / Wait / Red',val(totals,'approved')+' / '+val(totals,'waiting')+' / '+val(totals,'rejected'),'WAIT red değildir','')+
    statCard('Teknik Hata',val(totals,'technicalFailures'),'kota '+val(totals,'quota')+' · timeout '+val(totals,'timeouts'),totals.technicalFailures?'y':'')+
    statCard('Eksik Veri / Düşen',val(totals,'missingData')+' / '+val(totals,'dropped'),'uydurma veri yok','')+'</div>'+
    '<div class="card scroll" style="margin-top:12px"><table class="tbl"><thead><tr><th>Modül</th><th>Taranan</th><th>Aday</th><th>Kuyruk</th><th>Tamam</th><th>Onay</th><th>Wait</th><th>Red</th><th>Teknik</th><th>Kota</th><th>Timeout</th><th>Eksik</th><th>Düşen</th><th>Son Olay</th></tr></thead><tbody>'+
    ['AUTO','PUMP','LT','MOM'].map(k=>{ const s=scans[k]||{},d=dec[k]||{},l=last[k]; return '<tr><td><b>'+esc(MODN[k])+'</b></td><td>'+val(s,'scanned')+'</td><td>'+val(s,'candidates')+'</td><td>'+val(d,'queued')+'</td><td>'+val(d,'completed')+'</td><td class="up">'+val(d,'approved')+'</td><td class="gold">'+val(d,'waiting')+'</td><td class="dn">'+val(d,'rejected')+'</td><td>'+val(d,'technicalFailures')+'</td><td>'+val(d,'quota')+'</td><td>'+val(d,'timeouts')+'</td><td>'+val(d,'missingData')+'</td><td>'+val(d,'dropped')+'</td><td class="mut wrap" style="max-width:240px;font-size:10.5px">'+(l?esc(l.event+' · '+l.detail)+'<div>'+timeAgo(l.at)+'</div>':'—')+'</td></tr>'; }).join('')+
    '</tbody></table></div><p style="font-size:11px;color:var(--mut);line-height:1.65;margin:10px 0 0">Tarama adayı matematikseldir; AI tamamlanması yürütme anlamına gelmez. Kota, zaman aşımı, ayrıştırma ve eksik veri teknik olaylardır; stratejik REJECT ile karıştırılmaz.</p></div>';
  return h;
}
function pAI(){
  const ai=aiCtx(), usage=ai.usage||{}, lim=ai.limits||{}, prov=ai.providers||[], recent=(S.ai&&S.ai.recent)||[], hist=(S.ai&&S.ai.hist)||[];
  const st=S.state||{}, set=st.settings||{}, auto=set.autoTrade===true;
  const settingsOn=ai.settingsEnabled!==false, ready=ai.enabled===true;

      const used=num(modDay[k],0), cap=num(modLim[k],0), pct=cap?clamp(used/cap*100,0,100):0;

      return '<div class="quota '+(off?'off':'')+'"><div class="quota-h"><b>'+esc(MODN[k])+'</b><span class="num">'+num(used,0)+(cap?' / '+num(cap,0):'')+'</span></div><div class="bar"><i style="width:'+pct+'%;background:'+(off?'var(--mut-2)':'var(--gold)')+'"></i></div><div class="quota-s">'+(off?'OtoTrade kapalı — harcanmaz':k==='AUTO'?'OtoTrade açıkken çalışır':k==='MOM'?'Özel MOM AI · emir yok':'AI açıkken değerlendirme')+'</div></div>';
    }).join('')+'</div><div class="quota-total">Gün '+num(usage.dayCount,0)+' istek · saat '+num(usage.hourCount,0)+' · kuyruk '+num(ai.queue||0,0)+' · '+(usage.lastError?'<span class="dn">'+esc(usage.lastError)+'</span>':'hata yok')+' · <span class="mut">MOM kotası ayrı izlenir</span></div></div>';

  if(dsc.at||dsc.running){
    const drows=Object.keys(dres).map(k=>{ const r=dres[k]||{}; return '<tr><td><b>'+esc(r.name||k)+'</b></td><td class="mut">'+num(r.listed,0)+'</td><td>'+(r.working&&r.working.length?'<span class="chip long">'+esc(r.working.join(', '))+'</span>':'<span class="chip short">yok</span>')+'</td><td class="mut" style="font-size:10.5px">'+num((r.tested||[]).length,0)+' test</td><td class="dn" style="font-size:10.5px;white-space:normal">'+esc(r.error||'—')+'</td></tr>'; }).join('');
    h+=sec('<i class="fa-solid fa-magnifying-glass"></i>Model Keşfi',dsc.running?'taranıyor…':(dsc.at?new Date(dsc.at).toLocaleString('tr-TR'):''))+(drows?'<div class="card scroll"><table class="tbl"><thead><tr><th>Sağlayıcı</th><th>Listelenen</th><th>Çalışan Model</th><th>Test</th><th>Hata</th></tr></thead><tbody>'+drows+'</tbody></table></div>':'<div class="card empty">Keşif sonucu yok — "Model Keşfi" düğmesine basın.</div>');

    const mc=Object.keys(p.modelCooldowns||{}).filter(m=>p.modelCooldowns[m]>Date.now()).length;
    const cool=p.cooldownSec>0?'bekleme '+p.cooldownSec+'s':(p.hasKey?(mc?mc+' soğuyor':'hazır'):'anahtar yok');
    return '<tr><td><b>'+esc(p.name)+'</b></td><td class="mut" style="font-size:10.5px">'+esc((p.models||[]).slice(0,2).join(', '))+'</td><td>'+(p.hasKey?'<span class="chip long">VAR</span>':'<span class="chip neutral">YOK</span>')+'</td><td>'+esc(cool)+'</td><td>'+num(p.ok||0,0)+'/'+num((p.ok||0)+(p.fail||0),0)+'</td><td>'+(p.avgMs?num(p.avgMs,0)+'ms':'—')+'</td><td class="dn" style="max-width:220px;white-space:normal;font-size:10.5px">'+esc(p.lastError||'—')+'</td></tr>';

    h+=sec('<i class="fa-solid fa-brain"></i>Watch AI Değerlendirmeleri',hist.length+' kayıt')+'<div class="card scroll"><table class="tbl"><thead><tr><th>Zaman</th><th>Tip</th><th>Coin</th><th>Sağlayıcı</th><th>Karar</th><th>Faz</th><th>Puan</th><th>Veri</th></tr></thead><tbody>'+hist.slice(0,30).map(h2=>{
      const dk=EV_DEC_TR[h2.decision]||h2.decision, decisionHtml=['APPROVE','WAIT','REJECT','TECHNICAL_ERROR'].includes(h2.decision)?aiDecisionChip(h2):'<span class="chip '+(h2.decision==='CANDIDATE'?'long':h2.decision==='REJECT'?'short':'neutral')+'">'+esc(dk)+'</span>';
      return '<tr><td class="mut" style="font-size:10.5px">'+(h2.at?new Date(h2.at).toLocaleTimeString('tr-TR'):'—')+'</td><td>'+esc(h2.kind)+'</td><td><b>'+esc(String(h2.symbol||'').split('/')[0])+'</b></td><td class="mut">'+esc(h2.provider||'')+'</td><td>'+decisionHtml+'</td><td>'+evPhaseChip(h2.phase)+'</td><td>'+num(h2.score,0)+'</td><td class="mut">'+esc(DQ_TR[h2.dataQuality]||h2.dataQuality||'')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  }
  return h+'<div class="card note mut" style="margin-top:14px;line-height:1.75"><i class="fa-solid fa-shield-halved" style="color:var(--gold)"></i><b>'+VER+' AI akışı:</b> <b>OtoTrade</b> AI\'yı yalnızca OtoTrade açıkken kullanır; kapalıyken kuyruktaki AUTO işleri temizlenir ve kota harcanmaz. <b>Trend Takip</b> sinyalini matematik üretir, AI APPROVE/WAIT/REJECT üretir; WAIT ayrı durumdur. <b>LT Üçgen</b> sinyalini matematik üretir, AI yalnızca yorum ekler. <b>MOM (Momentum Hunter)</b> adayları özel AI şemasına gider; APPROVE yalnızca sanal sinyali etkiler ve emir yetkisi vermez. İzleme listelerinde AI varsayılan <b>KAPALI</b>; istediğiniz coinde "AI\'ya sor" ile tek seferlik değerlendirme alırsınız.</div>';
}

function drawChartLW(el, d){
  if(!el||!d||!d.candles||!d.candles.length) return;
  if(!window.LightweightCharts){ el.innerHTML="<div class='empty'>Grafik kütüphanesi yüklenemedi.</div>"; return; }
  el.innerHTML='';
  const chart=LightweightCharts.createChart(el,{
    layout:{ background:{ color:'#0a0e13' }, textColor:'#8a94a3', fontFamily:'-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif' },
    grid:{ vertLines:{ color:'#151c24' }, horzLines:{ color:'#151c24' } },
    timeScale:{ timeVisible:true, secondsVisible:false, rightOffset:12, borderColor:'#222b36' },
    rightPriceScale:{ borderColor:'#222b36' },
    crosshair:{ mode:0, vertLine:{ color:'#3a4653', labelBackgroundColor:'#1c242e' }, horzLine:{ color:'#3a4653', labelBackgroundColor:'#1c242e' } }
  });
  const cs=chart.addCandlestickSeries({ upColor:'#0ecb81', downColor:'#f6465d', borderVisible:false, wickUpColor:'#0ecb81', wickDownColor:'#f6465d' });
  const cdata=d.candles.map(c=>({ time:Math.floor(c[0]/1000), open:c[1], high:c[2], low:c[3], close:c[4] }));
  cs.setData(cdata);
  const noScale={ autoscaleInfoProvider:()=>null };
  const drawLine=(arr,color,w,style)=>{
    if(!arr||!arr.length) return;
    const s=chart.addLineSeries(Object.assign({ color, lineWidth:w, lineStyle:style||0, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false },noScale));
    const seen=new Set(), pts=[];
    for(const [t,v] of arr){ const k=Math.floor(t/1000); if(!seen.has(k)){ seen.add(k); pts.push({ time:k, value:v }); } }
    s.setData(pts.sort((a,b)=>a.time-b.time));
  };
  const e20=chart.addLineSeries({ color:'#f0b90b', lineWidth:1, priceLineVisible:false, lastValueVisible:false });
  e20.setData(d.candles.map((c,i)=>d.ema20&&d.ema20[i]?{ time:Math.floor(c[0]/1000), value:d.ema20[i] }:null).filter(Boolean));
  const e50=chart.addLineSeries({ color:'#4b9cf5', lineWidth:1, priceLineVisible:false, lastValueVisible:false });
  e50.setData(d.candles.map((c,i)=>d.ema50&&d.ema50[i]?{ time:Math.floor(c[0]/1000), value:d.ema50[i] }:null).filter(Boolean));
  if(d.triangle){
    drawLine(d.triangle.upper||d.triangle.upperFull,'#f6465d',2);
    drawLine(d.triangle.lower||d.triangle.lowerFull,'#0ecb81',2);
    const mk=(d.triangle.pivots||[]).map(p=>({ time:Math.floor(p.t/1000), position:p.side==='H'?'aboveBar':'belowBar', color:p.side==='H'?'#f6465d':'#0ecb81', shape:p.side==='H'?'arrowDown':'arrowUp', size:0.6 })).sort((a,b)=>a.time-b.time);
    cs.setMarkers(mk);
  }
  (d.supportResistance||[]).forEach(l=>cs.createPriceLine({ price:l.v, color:l.kind==='R'?'#f6465d88':'#0ecb8188', lineWidth:1, lineStyle:2, axisLabelVisible:true, title:l.l }));
  (d.levels||[]).forEach(l=>cs.createPriceLine({ price:l.v, color:l.col||'#848e9c', lineWidth:1, lineStyle:2, axisLabelVisible:true, title:l.l }));
  const sg=d.signal||{};
  [['entry','#e9eef5','Giriş'],['sl','#f6465d','Stop'],['tp1','#0ecb81','TP1'],['tp2','#0ecb81','TP2']].forEach(([k,c,t])=>{
    if(sg[k]>0) cs.createPriceLine({ price:sg[k], color:c, lineWidth:1, lineStyle:k==='entry'?0:2, axisLabelVisible:true, title:t });
  });
  const n=cdata.length;
  const triFrom=d.triangle&&Number.isFinite(Number(d.triangle.firstIdx))?Number(d.triangle.firstIdx):n-320;
  const visFrom=d.triangle?Math.max(0,Math.min(n-320,triFrom-20)):Math.max(0,n-150);
  chart.timeScale().setVisibleLogicalRange({ from:visFrom, to:n+30 });
  try{ new ResizeObserver(()=>{ if(chart) chart.applyOptions({ width:el.clientWidth, height:el.clientHeight }); }).observe(el); }catch(e){}
}

async function refresh(opts){

    const st=await api('/api/state');
    if(st&&st.version){ S.state=st; S.lastAt=Date.now(); S.unauth=false; }
    const t=S.tab, jobs=[];
    if(MODN[t]){

      if(t==='PUMP'){ jobs.push(api('/api/paper').then(d=>{ if(d) S.paper=d; })); jobs.push(api('/api/watch/scalp').then(d=>{ if(d) S.watch.scalp=d; })); }
      if(t==='AUTO'){ jobs.push(api('/api/paper').then(d=>{ if(d) S.paper=d; })); jobs.push(api('/api/auto/watch').then(d=>{ if(d) S.autoWatch=d; })); }
      if(t==='LT'){ jobs.push(api('/api/watch/lt').then(d=>{ if(d) S.watch.lt=d; })); }
      if(t==='MOM'){ jobs.push(api('/api/watch/mom').then(d=>{ if(d) S.watch.mom=d; })); }
    }
    if(t==='home'||t==='opps'){
      jobs.push(api('/api/signals').then(d=>{ if(!d) return; const by={}; (d.active||[]).concat(d.bekleyen||[]).forEach(s=>{ const b=by[s.module]=by[s.module]||{ active:[],closed:[] }; b.active.push(s); }); S.sig=by; }));
      jobs.push(api('/api/paper').then(d=>{ if(d) S.paper=d; }));

      jobs.push(api('/api/opportunities').then(d=>{ if(d) S.opps=d; }));
      jobs.push(api('/api/watch/lt').then(d=>{ if(d) S.watch.lt=d; }));
      jobs.push(api('/api/watch/scalp').then(d=>{ if(d) S.watch.scalp=d; }));
      jobs.push(api('/api/watch/mom').then(d=>{ if(d) S.watch.mom=d; }));
      jobs.push(api('/api/auto/watch').then(d=>{ if(d) S.autoWatch=d; }));
      if(t==='home') jobs.push(api('/api/v81/overview').then(d=>{ if(d) S.v81=d; }));
    }
    if(t==='outcomes') jobs.push(api('/api/outcomes').then(d=>{ if(d) S.outcomes=d; }));
    if(t==='ai'){
      jobs.push(api('/api/ai/status').then(d=>{ if(d) S.ai=d; }));
      jobs.push(api('/api/ai/history').then(d=>{ if(d&&d.items){ S.ai=S.ai||{}; S.ai.hist=d.items; } }));
    }
    if(t==='radar') jobs.push(api('/api/radar').then(d=>{ if(d) S.radar=d; }));
    if(t==='stats') jobs.push(api('/api/stats').then(d=>{ if(d) S.stats=d; }));
    if(t==='strat'&&!S.strat) jobs.push(api('/api/strategies').then(d=>{ if(d) S.strat=d; }));
    await Promise.all(jobs);
  }catch(e){ console.error(e); }
  S.busy=false;

}

    else if(a==='closeModal') closeModal();
    else if(a==='rejFilter'){ S.rejFilter=id; render(); }
    else if(a==='closeSig'){ if(confirm('Sinyali kapat?')){ const r=await post('/api/signal/'+encodeURIComponent(id)+'/close'); toast(r&&r.ok?'Kapatıldı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); closeModal(); await refresh(); } }
    else if(a==='execSig'){ if(!confirm('İşlemi aç?')) return; const r=await post('/api/signal/'+encodeURIComponent(id)+'/execute'); toast(r&&r.ok?'Açıldı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); closeModal(); await refresh(); }
    else if(a==='aiWatch'){
      if(!base) return;
      const old=t.innerHTML; t.disabled=true; t.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>';
      const kd=kind||'lt';
      const rr=await post('/api/watch/'+kd+'/'+encodeURIComponent(base)+'/ai',stateId?{stateId}:{});
      if(rr&&rr.ok){ toast('AI değerlendirmesi alındı','ok'); await refresh(); }
      else { toast((rr&&rr.error)||'AI yanıt vermedi','err'); t.disabled=false; t.innerHTML=old; }
    }
    else if(a==='aiReview'){ const old=t.innerHTML; t.disabled=true; t.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>'; const r=await post('/api/signal/'+encodeURIComponent(id)+'/ai'); if(r&&r.ok){ toast('AI raporu alındı','ok'); await openDetail(id); } else { toast((r&&r.error)||'AI yanıt vermedi','err'); t.disabled=false; t.innerHTML=old; } }
    else if(a==='aiTest'){ toast('Test ediliyor…'); const r=await api('/api/ai/test'); let okc=0,tot=0; ((r&&r.providers)||[]).forEach(p=>(p.results||[]).forEach(m=>{ tot++; if(m.ok) okc++; })); toast('Test: '+okc+'/'+tot,okc?'ok':'err'); await refresh(); }
    else if(a==='aiMarket'){ toast('15m piyasa yönü hesaplanıyor…'); const r=await post('/api/ai/market'); toast(r&&r.ok?('Yön: '+g(r,'marketAI.dir','?')+' (matematik)'):((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); }
    else if(a==='aiDiscover'){ toast('Modeller taranıyor… (uzun sürebilir)'); const r=await post('/api/ai/discover'); toast(r&&r.ok?'Keşif tamam':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); }
    else if(a==='aiReset'){ await post('/api/ai/reset'); toast('Soğumalar ve sayaçlar sıfırlandı','ok'); await refresh(); }
    else if(a==='aiBrief'){ const r=await post('/api/ai/brief'); toast(r&&r.ok?'Brifing alındı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); }
    else if(a==='closePaper'){ if(confirm('Pozisyonu kapat?')){ const r=await post('/api/paper/'+encodeURIComponent(id)+'/close'); toast(r&&r.ok?'Kapatıldı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); } }
    else if(a==='toggleAutoTrade'){
      const on=g(S.state,'settings.autoTrade',false)===true;
      const r=await post('/api/auto/toggle',{ enabled:!on });
      let msg=r&&r.note?r.note:(r&&r.ok?('OtoTrade '+(!on?'AÇIK':'KAPALI')):'Hata');
      msg+=purgeText(r);
      if(r&&r.ok&&r.aiReady===false&&!on) msg+=' · AI hazır değil';
      toast(msg,r&&r.ok?'ok':'err');
      await refresh();
    }
    else if(a==='scanAuto'){ toast('Pump/dump taranıyor…'); const r=await post('/api/auto/scan'); if(r&&r.items) S.autoWatch=r; toast('Tarama bitti ('+((r&&r.items&&r.items.length)||0)+' aday)','ok'); await refresh(); }
    else if(a==='refreshLive'){ toast('Bitget bakiye/pozisyon…'); const r=await post('/api/live/sync'); toast(r&&r.ok?'Senkronize':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); }
    else if(a==='closeLive'){ if(confirm('Canlı pozisyonu kapat?')){ const r=await post('/api/live/'+encodeURIComponent(id)+'/close'); toast(r&&r.ok?'Canlı kapatıldı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); } }
    else if(a==='saveAutoSet'){
      const av=i=>{ const el=document.getElementById(i); return el?Number(el.value):undefined; };
      const r=await post('/api/paper/settings',{ autoMaxOpen:av('a_max'), riskPct:av('a_risk'), leverage:av('a_lev'), margin:av('a_margin') });
      toast((r&&r.ok?'Kaydedildi':((r&&r.error)||'Hata'))+purgeText(r),r&&r.ok?'ok':'err');
      await refresh();
    }
    else if(a==='toggleMode'){ const cm=g(S.paper,'settings.tradeMode','paper'), nw=cm==='live'?'paper':'live'; if(nw==='live'&&!confirm('Gerçek para! Emin misin?')) return; const r=await post('/api/trade/mode',{ mode:nw }); toast(r&&r.ok?('Mod '+nw.toUpperCase()+((r.note)?' · '+r.note:'')):((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); }
    else if(a==='resetPaper'){ if(confirm('Sanal cüzdan sıfırlansın mı?')){ const r=await post('/api/paper/reset'); toast(r&&r.ok?'Sıfırlandı':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); } }
    else if(a==='saveSet'){ const v=i=>{ const el=document.getElementById(i); return el?Number(el.value):undefined; }; const r=await post('/api/paper/settings',{ margin:v('s_margin'), leverage:v('s_lev'), riskPct:v('s_risk'), maxOpen:v('s_maxopen'), dailyLossPct:v('s_dl') }); toast(r&&r.ok?'Kaydedildi':((r&&r.error)||'Hata'),r&&r.ok?'ok':'err'); await refresh(); }
    else if(a==='saveToken'){ const el=document.getElementById('set_token'); const t=el?el.value.trim():''; try{ t?localStorage.setItem('alphason_token',t):localStorage.removeItem('alphason_token'); }catch(e){} S.token=t; S.unauth=false; toast(t?'Token kaydedildi':'Token temizlendi','ok'); await refresh(); }
    else if(a==='clearToken'){ try{ localStorage.removeItem('alphason_token'); }catch(e){} S.token=''; S.unauth=false; toast('Token temizlendi','ok'); await refresh(); }
    else if(a==='saveAllSettings'){
      const setObj={};
      ['tradeMode','margin','leverage','riskPct','pullbackRiskPct','autoMaxOpen','dailyLossPct','maxHeatPct','maxDailyTrades','maxConsecLoss','stallSec','autoAiPerHour','paperEquity','includeStocks','maxOpen','minConf','maxSpreadPct','ltTfs'].forEach(k=>{
        const el=document.getElementById('set_'+k); if(!el) return;
        let val=el.value;
        if(val==='true') val=true; else if(val==='false') val=false; else if(el.type==='number') val=Number(val);
        setObj[k]=val;
      });
      if(setObj.ltTfs) setObj.ltTfs=String(setObj.ltTfs).split(',').map(x=>x.trim()).filter(x=>['1h','2h','4h'].includes(x));
      const r=await post('/api/paper/settings',setObj);
      if(!r||!r.ok){ toast((r&&r.error)||'Hata','err'); return; }
      if(setObj.tradeMode) await post('/api/trade/mode',{ mode:setObj.tradeMode });
      toast('Ayarlar kaydedildi'+purgeText(r),'ok');
      await refresh();
    }
    else if(a==='diag'){
      const elD=document.getElementById('diagBox');
      if(elD){ elD.classList.remove('hide'); elD.textContent='Yükleniyor...'; try{ const j=await api(url); elD.textContent=JSON.stringify(j,null,2); }catch(err){ elD.textContent='Hata: '+err.message; } }
    }
    else if(a==='runBt'){
      const b={ module:document.getElementById('b_mod').value, coins:Number(document.getElementById('b_coins').value)||10 };
      const r=await post('/api/backtest',b);
      if(!r||!r.id){ toast('Başlamadı','err'); return; }
      S.jobId=r.id; S.job={ status:'çalışıyor', progress:0 }; render(); pollJob();
    }
  }catch(err){ console.error(err); toast('Hata: '+(err&&err.message?err.message:''),'err'); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
function pollJob(){
  if(!S.jobId) return;
  api('/api/backtest/'+S.jobId).then(j=>{
    if(j){ S.job=j; if(S.tab==='bt') render(); }
    if(j&&j.status==='çalışıyor') setTimeout(pollJob,2000);
  });
}
async function init(){
  renderNav(); renderTop();
  await refresh();
  setInterval(()=>refresh({ soft:true }),5000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh({ soft:true }); });
}
init();

</script>
</body>
</html>
