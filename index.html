.sig::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--line)}.sig.long::before{background:var(--green)}.sig.short::before{background:var(--red)}
.sig-h{display:flex;align-items:center;gap:8px}.sig-h .sym{font-size:15px;font-weight:700}.sig-h .sym span{font-size:10.5px;color:var(--mut);margin-left:2px}.sig-h .age{margin-left:auto;font-size:11px;color:var(--mut-2)}
.sig-mod{font-size:11px;color:var(--mut);margin-top:-6px}

.sig-px div{display:flex;flex-direction:column;gap:2px}.sig-px span{font-size:9.5px;text-transform:uppercase;color:var(--mut-2);font-weight:700}.sig-px b{font-size:12.5px;font-family:var(--mono)}
.sig-f{display:flex;align-items:center;gap:10px}.sig-f .conf{flex:1;display:flex;align-items:center;gap:8px}.sig-f .conf .bar{flex:1}.sig-f .conf em{font-size:10.5px;color:var(--mut);font-style:normal}.sig-f .pnl{font-size:13px;font-weight:700}
.sig-tags{display:flex;flex-wrap:wrap;gap:5px}

#toast.on{opacity:1}#toast.ok{border-color:rgba(14,203,129,.4)}#toast.err{border-color:rgba(246,70,93,.4)}

.chipbtn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--mut);font-size:11px;font-weight:700;cursor:pointer;line-height:1.6;white-space:nowrap}
.chipbtn.on{background:var(--green-dim);border-color:rgba(14,203,129,.35);color:var(--green)}
.chipbtn.off{background:rgba(246,70,93,.10);border-color:rgba(246,70,93,.30);color:var(--red)}
.chipbtn:hover{filter:brightness(1.15)}
.lnk{background:none;border:0;padding:0;color:var(--txt);font:inherit;font-weight:700;cursor:pointer;border-bottom:1px dashed var(--line)}
.lnk:hover{color:var(--gold);border-bottom-color:var(--gold)}
.tvb{color:var(--mut);margin-left:6px;font-size:10px;text-decoration:none}.tvb:hover{color:var(--gold)}
.phase-chip{display:inline-flex;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:700;background:rgba(132,142,156,.15);color:#b7bdc6;border:1px solid rgba(132,142,156,.2)}
.phase-chip.p0{background:var(--gold-dim);color:var(--gold);border-color:rgba(252,213,53,.3)}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function g(o,p,d){try{var v=o,a=p.split(".");for(var i=0;i<a.length;i++){if(v==null)return d;v=v[a[i]];}return v==null?d:v;}catch(e){return d;}}
function num(x,n){x=Number(x);return isFinite(x)?x.toFixed(n==null?2:n):"-";}
function px(x){x=Number(x);if(!isFinite(x)||x===0)return "-";return x>=100?x.toFixed(2):x>=1?x.toFixed(4):x.toPrecision(4);}
function dur(ms){ms=Math.max(0,Number(ms)||0);var m=Math.floor(ms/60000);if(m<1)return Math.floor(ms/1000)+" sn";return m<60?m+" dk":Math.floor(m/60)+" sa "+(m%60)+" dk";}
function cls(x){return Number(x)>=0?"up":"dn";}
function sgn(x,n){x=Number(x);return isFinite(x)?(x>=0?"+":"")+x.toFixed(n==null?2:n):"-";}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function api(p,o){return fetch(p,o).then(function(r){return r.json();}).catch(function(){return null;});}
function post(p,b){return api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});}
function safe(fn,name){try{return fn();}catch(e){console.error(name,e);return '<div class="card empty"><i class="fa-solid fa-triangle-exclamation"></i>'+esc(name)+' yüklenemedi</div>';}}
function toast(m,t){var e=document.getElementById("toast");e.textContent=m;e.className="on "+(t||"");clearTimeout(e._t);e._t=setTimeout(function(){e.className="";},2800);}
function dirChip(d){return d==="LONG"?'<span class="chip long"><i class="fa-solid fa-arrow-up"></i>LONG</span>':d==="SHORT"?'<span class="chip short"><i class="fa-solid fa-arrow-down"></i>SHORT</span>':'<span class="chip neutral">—</span>';}
function mktChip(d){return d==="LONG"?'<span class="mkt long"><i class="fa-solid fa-arrow-trend-up"></i>YÜKSELİŞ</span>':d==="SHORT"?'<span class="mkt short"><i class="fa-solid fa-arrow-trend-down"></i>DÜŞÜŞ</span>':'<span class="mkt neutral"><i class="fa-solid fa-minus"></i>NÖTR</span>';}
function resChip(r){var k=/^(TP1|TP2)$/.test(r)?"long":/^(SL)$/.test(r)?"short":"neutral";return '<span class="chip '+k+'">'+esc(RES[r]||r||"-")+'</span>';}
function verdictChip(a){if(!a||!a.verdict)return "";var v=String(a.verdict).toUpperCase(),k=v==="ONY"?"long":v==="RED"?"short":"gold";var l=a.verdictLabel||(v==="ONY"?"GİRİLİR":v==="RED"?"GİRİLMEZ":"BEKLE");return '<span class="chip '+k+'"><i class="fa-solid fa-brain"></i> '+esc(l)+(a.trust?" · "+esc(a.trust):"")+(a.score!=null?" "+num(a.score,0):"")+'</span>';}
function evPhaseChip(p){var idx={PRE_BREAKOUT:0,TRIGGER_PENDING:1,CONFIRMED:2,LATE:3,INVALID:4,EARLY:4,CONTINUATION:2,PULLBACK:1,EXHAUSTION:3,UNCLEAR:4}[p];if(idx==null)return "";return '<span class="phase-chip p'+idx+'">'+esc(EV_PH_TR[p]||p)+'</span>';}
function listHtml(a){if(!a||!a.length)return '<span class="mut">—</span>';return a.map(function(x){return '<div style="display:flex;gap:7px;margin:4px 0"><span class="gold">•</span><span>'+esc(x)+'</span></div>';}).join("");}
function sec(t,r){return '<div class="sec"><h3>'+t+'</h3><div class="line"></div>'+(r?'<div class="more">'+r+'</div>':"")+'</div>';}
function pageHead(t,sub,r){return '<div style="display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap"><div><h1 style="margin:0;font-size:21px">'+t+'</h1>'+(sub?'<p style="margin:5px 0 0;font-size:12.5px;color:var(--mut)">'+sub+'</p>':"")+'</div>'+(r?'<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">'+r+'</div>':"")+'</div>';}
function statCard(l,v,s,c){return '<div class="card kpi '+(c||"")+'"><div class="l">'+esc(l)+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':"")+'</div>';}
function noteBox(icon,html,extra){return '<div class="card note" style="'+(extra||"")+'"><i class="fa-solid '+icon+'" style="color:var(--gold);margin-right:6px"></i>'+html+'</div>';}

function analysisCard(a,title){
  if(!a)return "";
  var conf=clamp(Number(a.score)||0,0,100),col=conf>=70?"var(--green)":conf>=50?"var(--gold)":"var(--red)";
  return '<div class="card" style="padding:14px 16px;margin-top:12px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:12.5px">'+esc(title)+'</b>'+verdictChip(a)+'<span class="chip neutral">Skor '+conf+'/100</span></div>'+
    '<div style="display:flex;align-items:center;gap:8px;margin-top:10px"><div class="bar" style="height:5px;flex:1"><i style="width:'+conf+'%;background:'+col+'"></i></div></div>'+
    (a.summary?'<p style="font-size:12px;line-height:1.6;margin:8px 0 0;color:#c9ced6">'+esc(a.summary)+'</p>':"")+
    (a.reasons&&a.reasons.length?'<div style="margin-top:10px;font-size:11.5px"><b class="mut">Gerekçeler</b>'+listHtml(a.reasons)+'</div>':"")+
    (a.risks&&a.risks.length?'<div style="margin-top:8px;font-size:11.5px"><b class="mut">Riskler</b>'+listHtml(a.risks)+'</div>':"")+
    '</div>';
}

function renderNav(){
  var bm = g(S.state,"counts.byModule",{});
  document.getElementById("nav").innerHTML = NAV.map(function(grp){
    return '<div class="nav-group"><h6>'+esc(grp.g)+'</h6>'+grp.items.map(function(it){
      var c = bm[it[0]];
      return '<button class="nav '+(S.tab===it[0]?"on":"")+'" data-act="tab" data-id="'+it[0]+'"><i class="fa-solid '+it[2]+'"></i><span>'+esc(it[1])+'</span>'+(c>0?'<span class="cnt">'+c+'</span>':"")+'</button>';
    }).join("")+'</div>';
  }).join("");
  var sf = document.getElementById("sf-state");
  if(sf) sf.innerHTML = S.state ? (S.state.ready?'<span class="up">canlı</span>':'<span class="gold">başlıyor</span>') : "—";
}

function renderTop(){
  var st = S.state; if(!st) return;
  var m = st.market || {};
  function t(n,o){ return o ? '<div class="tick"><b>'+n+'</b><span class="p">'+px(o.price)+'</span><span class="'+cls(o.change)+' num">'+sgn(o.change,2)+'%</span></div>' : ""; }
  var ai = st.ai || {}, auto = g(st,"settings.auto",false), pa = g(st,"counts.pendingApproval",0);
  var aiOn = ai.settingsEnabled === true, aiReady = ai.enabled === true, keys = g(ai,"keys",0);
  var aiLabel, aiClass;
  if(!aiOn){ aiLabel = "AI KAPALI"; aiClass = "off"; }
  else if(!aiReady){ aiLabel = "AI AÇIK · ANAHTAR YOK"; aiClass = "off"; }
  else { aiLabel = "AI AÇIK"; aiClass = "on"; }
  document.getElementById("top").innerHTML =
    '<button id="menu" class="icon-btn" data-act="menu"><i class="fa-solid fa-bars"></i></button>'+
    mktChip(m.dir) + t("BTC",m.btc) + t("ETH",m.eth) +
    (pa>0?'<span class="chip gold hide-sm"><i class="fa-solid fa-hand"></i> '+pa+' ONAY</span>':"")+
    '<span class="chip '+(auto?"gold":"neutral")+' hide-sm"><i class="fa-solid fa-robot"></i>'+(auto?"OTO (max "+g(st,"counts.autoMaxOpen",3)+")":"OTO KAPALI")+'</span>'+
    '<span class="chip neutral hide-sm">PAPER</span>'+
    '<button class="chipbtn '+aiClass+'" data-act="toggleAI" title="AI kararlarını aç/kapat"><i class="fa-solid fa-wand-magic-sparkles"></i> '+esc(aiLabel)+'</button>'+
    '<div class="top-right"><span class="dot '+(st.ready?"on":"")+'"></span><span class="mut hide-sm hide-md" style="font-size:11.5px">'+g(st,"scan.universe",0)+' coin</span><button class="icon-btn" data-act="refresh" title="Yenile"><i class="fa-solid fa-rotate"></i></button></div>';
}

/* ──────── Sinyal kartı / grid / kapalı tablosu ──────── */
function sigCard(s){
  var act = s.status !== "KAPALI", pAI = s.status === "AI_BEKLIYOR", pAp = s.status === "ONAY_BEKLIYOR";
  var conf = clamp(Number(s.conf)||0,0,100), i = s.info || {}, tags = "";
  var pct = act ? g(s,"livePct",null) : g(s,"pnlPct",null);
  if(s.marketAlign === "TERS") tags += '<span class="chip gold">PİYASAYA TERS</span>';
  else if(s.marketAlign === "UYUMLU") tags += '<span class="chip long">PİYASA UYUMLU</span>';
  if(i.setup) tags += '<span class="chip neutral">'+esc(i.setup)+'</span>';
  if(i.tf)    tags += '<span class="chip neutral">'+esc(i.tf)+'</span>';
  if(s.tradeable === false) tags += '<span class="chip neutral">SANAL</span>';
  if(pAI) tags += '<span class="chip gold"><i class="fa-solid fa-hourglass-half"></i> AI</span>';
  else if(pAp) tags += '<span class="chip gold"><i class="fa-solid fa-hand"></i> ONAY</span>';
  else if(act && s.tp1Hit) tags += '<span class="chip long">TP1 ✔</span>';
  if(!act) tags += resChip(s.result);
  var bar = "";
  if(pAp) bar = '<button class="btn green" style="padding:7px;font-size:12px;width:100%" data-act="execSig" data-id="'+esc(s.id)+'">Onayla ve Aç</button>';
  return '<article class="sig '+(s.dir==="LONG"?"long":"short")+'" data-act="open" data-id="'+esc(s.id)+'">'+
    '<div class="sig-h"><div class="sym">'+esc(s.base)+'<span>USDT</span></div>'+dirChip(s.dir)+'<span class="age">'+dur(Date.now()-s.createdAt)+'</span></div>'+
    '<div class="sig-mod"><i class="fa-solid fa-microchip"></i> '+esc(MODN[s.module]||s.module)+'</div>'+
    '<div class="sig-px"><div><span>Giriş</span><b>'+px(s.entry)+'</b></div><div><span>Hedef</span><b class="up">'+px(s.tp1)+'</b></div><div><span>Stop</span><b class="dn">'+px(s.curSl||s.sl)+'</b></div></div>'+
    '<div class="sig-f"><div class="conf"><div class="bar"><i style="width:'+conf+'%;background:'+(conf>=70?"var(--green)":conf>=50?"var(--gold)":"var(--red)")+'"></i></div><em>'+num(conf,0)+'</em></div><span class="pnl '+(pct==null?"mut":cls(pct))+'">'+(pct==null?"—":sgn(pct,2)+"%")+'</span></div>'+
    bar + (tags?'<div class="sig-tags">'+tags+'</div>':"")+
    '</article>';
}
function sigGrid(l,e){ return !l||!l.length?'<div class="card empty"><i class="fa-regular fa-circle-check"></i>'+esc(e||"Kayıt yok")+'</div>':'<div class="grid sigs">'+l.map(sigCard).join("")+'</div>';}
function closedTable(l){ if(!l||!l.length) return '<div class="card empty">Henüz kapanan sinyal yok</div>'; return '<div class="card scroll"><table class="tbl"><thead><tr><th>Coin</th><th>Yön</th><th>Giriş</th><th>Çıkış</th><th>Sonuç</th><th>Net R</th><th>Süre</th></tr></thead><tbody>'+l.slice(0,20).map(function(s){return '<tr class="click" data-act="open" data-id="'+esc(s.id)+'"><td><b>'+esc(s.base)+'</b></td><td>'+dirChip(s.dir)+'</td><td>'+px(s.entry)+'</td><td>'+px(s.exit)+'</td><td>'+resChip(s.result)+'</td><td class="'+(s.netR==null?"mut":cls(s.netR))+'">'+(s.netR==null?"—":sgn(s.netR,2))+'</td><td class="mut">'+dur((s.closedAt||0)-s.createdAt)+'</td></tr>';}).join("")+'</tbody></table></div>'; }

/* ──────── Watch tabloları ──────── */
function tvUrl(sym){ var b = String(sym||'').split('/')[0]; return 'https://www.tradingview.com/chart/?symbol=BITGET:'+encodeURIComponent(b)+'USDT.P'; }
function chartCell(r){
  var sym = r.symbol||'', b = r.base||String(sym).split('/')[0], dir = r.dir||r.dirHint||'';
  return '<button class="lnk" data-act="openChart" data-symbol="'+esc(sym)+'" data-tf="'+esc(r.tf||'15m')+'" data-dir="'+esc(dir)+'" data-entry="'+esc(r.price||'')+'" data-upper="'+esc(r.upper||'')+'" data-lower="'+esc(r.lower||'')+'" title="Grafik aç">'+esc(b)+'</button><a class="tvb" href="'+tvUrl(sym)+'" target="_blank" rel="noopener" title="TradingView"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>';
}

function ltWatchTable(limit){
  var ltw = g(S.watch,"lt.items",[]);
  if(!ltw.length) return '<div class="card empty"><i class="fa-regular fa-circle-check"></i>Üçgen formasyonu yok</div>';
  return '<div class="card scroll"><table class="tbl"><thead><tr><th>Coin</th><th>TF</th><th>Fiyat</th><th>Üst</th><th>Alt</th><th>Üste %</th><th>Alta %</th><th>Yakın</th><th>Durum</th><th>AI</th></tr></thead><tbody>'+
    ltw.slice(0,limit||40).map(function(w){
      var aiCell = '<button class="btn ghost" style="padding:1px 6px;font-size:9.5px" data-act="aiWatch" data-kind="lt" data-base="'+esc(w.base)+'">AI\'ya sor</button>';
      if(w.ai && w.ai.summary){
        aiCell = '<div class="ai-cell"><b>'+esc(w.ai.verdictLabel||w.ai.label||"")+'</b> · '+num(w.ai.score,0)+' · '+esc(w.ai.trust||"")+
          '<div style="margin-top:3px;color:#c9ced6">'+esc(String(w.ai.summary||"").slice(0,180))+'</div>'+
          '<div style="margin-top:3px;font-size:10px;color:var(--mut-2)">'+esc(w.ai.provider||"AI")+(w.ai.model?' · '+esc(w.ai.model):'')+
          ' · <button class="btn ghost" style="padding:1px 5px;font-size:9.5px" data-act="aiWatch" data-kind="lt" data-base="'+esc(w.base)+'">Yenile</button></div></div>';
      }
      return '<tr><td>'+chartCell(w)+'</td><td class="mut">'+esc(w.tf||'')+'</td><td>'+px(w.price)+'</td><td class="dn">'+px(w.upper)+'</td><td class="up">'+px(w.lower)+'</td><td class="'+cls(-(w.distUpper||0))+'">'+sgn(-(w.distUpper||0),2)+'%</td><td class="'+cls(-(w.distLower||0))+'">'+sgn(-(w.distLower||0),2)+'%</td><td><span class="chip '+(w.nearSide==='ÜST'?'long':'short')+'">'+esc(w.nearSide||w.dirHint||'')+'</span> '+num(w.nearPct,2)+'%</td><td><span class="chip neutral">'+esc(w.status||'')+'</span></td><td>'+aiCell+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

function scalpWatchTable(limit){
  var sw = g(S.watch,"scalp.items",[]);
  if(!sw.length) return '<div class="card empty">Aktif kurulum yok</div>';
  var rank = {'ADAY SİNYAL':0,'KIRILIM YAKLAŞIYOR':1,'TETİK':0,'TEYİT BEKLENİYOR':2,'BEKLİYOR':2};
  var srt = sw.slice().sort(function(a,b){return (rank[a.state]||5)-(rank[b.state]||5);});
  return '<div class="card scroll"><table class="tbl"><thead><tr><th>Coin</th><th>TF</th><th>Kurulum</th><th>Durum</th><th>Yön</th><th>Fiyat</th><th>Tetik</th><th>Mesafe</th><th>Hacim</th><th>AI</th></tr></thead><tbody>'+
    srt.slice(0,limit||30).map(function(r){
      var aiCell = '<button class="btn ghost" style="padding:1px 6px;font-size:9.5px" data-act="aiWatch" data-kind="scalp" data-base="'+esc(r.base)+'">AI\'ya sor</button>';
      if(r.ai && r.ai.summary){
        aiCell = '<div class="ai-cell"><b>'+esc(r.ai.verdictLabel||r.ai.label||"")+'</b> · '+num(r.ai.score,0)+
          '<div style="margin-top:3px;color:#c9ced6">'+esc(String(r.ai.summary||"").slice(0,140))+'</div></div>';
      }
      return '<tr><td>'+chartCell(r)+'</td><td class="mut">'+esc(r.tf||'')+'</td><td><span class="chip neutral">'+esc(r.setup||'')+'</span></td><td><span class="chip '+(r.status==='TETİK'?'long':'gold')+'">'+esc(r.status||'')+'</span></td><td>'+dirChip(r.dir)+'</td><td>'+px(r.price)+'</td><td>'+px(r.trigger)+'</td><td>'+num(r.distPct,2)+'%</td><td>'+num(r.volRatio,2)+'x</td><td>'+aiCell+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

/* ──────── Sayfalar ──────── */
function pHome(){
  var st = S.state; if(!st) return '<div class="empty">Yükleniyor…</div>';
  var m = st.market || {}, sm = st.paper || {}, pp = S.paper || {}, bm = g(st,"counts.byModule",{});
  var pa = g(st,"counts.pendingApproval",0), active = g(st,"activeModules",["PUMP","LT"]);
  var h = '<div class="grid kpis">'+
    statCard("Sanal Bakiye",num(sm.equity,2)+' <small class="mut" style="font-size:12px">USDT</small>',"başlangıç "+num(sm.start,2),cls(sm.sumPnl))+
    statCard("Bugün",sgn(sm.dayPnl,2)+' <small class="mut" style="font-size:12px">USDT</small>',"gün başı "+num(sm.dayStart,2),cls(sm.dayPnl))+
    statCard("Açık İşlem",num(sm.open,0),"max "+g(st,"settings.maxOpen",3),"")+
    statCard("Başarı",num(sm.winRate,1)+"%",num(sm.closed,0)+" kapanan","")+
    statCard("Aktif Sinyal",num(g(st,"counts.active",0),0),"taranan "+num(g(st,"scan.universe",0),0),"y")+
  '</div>';
  if(pa > 0) h += '<div class="card note" style="margin-top:14px;border-color:rgba(14,203,129,.35);background:var(--green-dim)"><i class="fa-solid fa-hand up" style="margin-right:6px"></i><b>'+pa+' sinyal onay bekliyor.</b></div>';
  h += '<div class="card" style="margin-top:14px;padding:16px 18px;display:flex;gap:20px;align-items:center;flex-wrap:wrap">'+
    '<div style="min-width:150px"><div class="mut" style="font-size:10.5px;text-transform:uppercase;font-weight:600">Piyasa Yönü</div><div style="margin-top:8px">'+mktChip(m.dir)+'</div></div>'+
    '<div style="flex:1;min-width:220px"><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-bottom:6px"><span>Genişlik</span><span class="num">%'+num((m.breadth||0)*100,0)+' yeşil</span></div><div class="bar" style="height:6px"><i style="width:'+clamp((m.breadth||0)*100,0,100)+'%;background:linear-gradient(90deg,var(--red),var(--gold),var(--green))"></i></div></div>'+
    '<div style="min-width:100px"><div class="mut" style="font-size:10.5px;text-transform:uppercase;font-weight:600">Skor</div><div style="font-size:20px;font-weight:700" class="num">'+num(m.score,2)+'</div></div>'+
    (m.why?'<div class="mut" style="flex:2;min-width:240px;font-size:12.5px">'+esc(m.why)+'</div>':"")+
  '</div>';

  h += sec('<i class="fa-solid fa-layer-group"></i>Aktif Stratejiler',active.length+" modül")+
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'+active.map(function(k){return '<div class="card kpi" style="padding:12px 14px;cursor:pointer" data-act="tab" data-id="'+k+'"><div class="l" style="font-size:10px">'+esc(MODN[k]||k)+'</div><div class="v" style="font-size:19px">'+num(bm[k]||0,0)+'</div></div>';}).join("")+'</div>';

  var all = []; Object.keys(S.sig).forEach(function(k){ all = all.concat(g(S.sig[k],"active",[])); });
  all.sort(function(a,b){return b.createdAt-a.createdAt;});
  h += sec('<i class="fa-solid fa-bolt"></i>Aktif Sinyaller',"son "+Math.min(6,all.length)+" / "+all.length)+sigGrid(all.slice(0,6),"Sinyal yok");

  var ltw = g(S.watch,"lt.items",[]);
  if(ltw.length) h += sec('<i class="fa-solid fa-play"></i>LT Üçgen — Kırılıma Yaklaşanlar',ltw.length+" coin")+ltWatchTable(10);
  var sw = g(S.watch,"scalp.items",[]);
  if(sw.length) h += sec('<i class="fa-solid fa-gauge-high"></i>Günlük Hızlı Scalp — İzleme',sw.length+" coin")+scalpWatchTable(8);

  var op = g(pp,"open",[]);
  if(op.length){
    h += sec('<i class="fa-solid fa-wallet"></i>Açık İşlemler',op.length)+'<div class="card scroll"><table class="tbl"><thead><tr><th>Coin</th><th>Yön</th><th>Giriş</th><th>Güncel</th><th>K/Z</th><th>Süre</th></tr></thead><tbody>'+
      op.slice(0,8).map(function(x){return '<tr><td><b>'+esc(x.base)+'</b>'+(x.tp1Hit?' <span class="chip long">TP1✔</span>':"")+'</td><td>'+dirChip(x.dir)+'</td><td>'+px(x.entry)+'</td><td>'+px(x.livePrice)+'</td><td class="'+cls(x.livePnl)+'">'+sgn(x.livePnl,2)+' ('+sgn(x.livePnlPct,2)+'%)</td><td class="mut">'+dur(x.ageMs)+'</td></tr>';}).join("")+'</tbody></table></div>';
  }
  return h;
}

function pModule(k){
  var d = S.sig[k]; if(!d) return '<div class="empty">Yükleniyor…</div>';
  var h = "";
  if(k==="PUMP"){
    h += noteBox("fa-bolt","<b>Günlük Hızlı Scalp (5m):</b> Üç kurulum — (1) seans açılış aralığı kırılımı (ORB, UTC 00/07/13:30), (2) VWAP/EMA20 trend geri çekilmesi, (3) sakin piyasada VWAP ±2σ dönüşü. Sinyali <b>matematik</b> üretir; AI (açıksa) yalnızca <b>GİRİLİR/GİRİLMEZ</b> der. TP1'de yarım sat, stop BE.");
    h += pPaper();
  }
  if(k==="LT"){
    h += noteBox("fa-play","<b>LT Üçgen (2h):</b> Alçalan tepeler + yükselen dipler. Fiyat üst/alt çizgiye <b>değdiği anda</b> sinyal üretilir. İşlem açmaz; sonuç sanal ölçülür. Coin adına tıkla → üçgen çizgileriyle birlikte grafik.");
    h += sec('<i class="fa-solid fa-eye"></i>LT İzleme',"")+ltWatchTable(40);
  }
  h += sec('<i class="fa-solid fa-bolt"></i>Aktif Sinyaller',g(S.state,"counts.byModule."+k,0)+" adet")+sigGrid(d.active,"Sinyal yok");
  if(k==="PUMP") h += sec('<i class="fa-solid fa-eye"></i>Scalp İzleme',"")+scalpWatchTable(30);
  h += sec('<i class="fa-solid fa-clock-rotate-left"></i>Son Kapananlar',"")+closedTable(d.closed);
  return h;
}

function pPaper(){
  var p = S.paper; if(!p) return '<div class="card empty">Yükleniyor…</div>';
  var st = p.settings || {}, sm = p.summary || {}, on = !!st.auto;
  var h = '<div class="ctrl"><button class="btn lg '+(on?"green":"red")+'" data-act="toggleAuto"><i class="fa-solid fa-power-off"></i> OTO '+(on?"AÇIK":"KAPALI")+'</button><span class="chip neutral" style="display:flex;align-items:center;justify-content:center">PAPER</span></div>';

/* ──────── Canvas çizimi (mum + EMA + üçgen eğimli çizgi + yatay seviye) ──────── */
function drawChart(cv, d){
  if(!cv || !d || !d.candles || !d.candles.length) return;
  var c = d.candles, s = d.signal || {};
  var W = cv.clientWidth || 900, H = 420, dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + "px";
  var x = cv.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.fillStyle = "#0b0e11"; x.fillRect(0, 0, W, H);

  var padL = 8, padR = 78, padT = 22, padB = 22, cw = W - padL - padR, ch = H - padT - padB;
  var tFirst = c[0][0], tLast = c[c.length-1][0];
  var step = c.length > 1 ? (c[1][0] - c[0][0]) : 5*60e3;

  /* Üçgen noktaları için zaman aralığını genişlet */
  var tri = d.triangle || null;
  var minT = tFirst, maxT = tLast + step;
  if(tri && tri.upper) tri.upper.forEach(function(p){ if(p[0]<minT)minT=p[0]; if(p[0]>maxT)maxT=p[0]; });
  if(tri && tri.lower) tri.lower.forEach(function(p){ if(p[0]<minT)minT=p[0]; if(p[0]>maxT)maxT=p[0]; });
  var tSpan = Math.max(1, maxT - minT);

  function X(t){ return padL + (t - minT) / tSpan * cw; }

  /* Y aralığı */
  var hi = -Infinity, lo = Infinity;
  c.forEach(function(k){ if(k[2]>hi)hi=k[2]; if(k[3]<lo)lo=k[3]; });
  if(tri && tri.upper) tri.upper.forEach(function(p){ if(p[1]>hi)hi=p[1]; if(p[1]<lo)lo=p[1]; });
  if(tri && tri.lower) tri.lower.forEach(function(p){ if(p[1]>hi)hi=p[1]; if(p[1]<lo)lo=p[1]; });
  (d.levels||[]).forEach(function(lv){ if(lv.v>hi)hi=lv.v; if(lv.v<lo)lo=lv.v; });
  if(s.entry>0){ if(s.entry>hi)hi=s.entry; if(s.entry<lo)lo=s.entry; }
  if(!isFinite(hi)||!isFinite(lo)||hi===lo){ hi=lo+1; lo=lo-1; }
  var pad = (hi - lo) * 0.05; hi += pad; lo -= pad;
  var range = hi - lo;
  function Y(v){ return padT + (hi - v) / range * ch; }

  /* Mumlar */
  var bw = Math.max(1, Math.min(11, (step / tSpan) * cw * 0.7));
  c.forEach(function(k){
    var col = k[4] >= k[1] ? "#0ecb81" : "#f6465d";
    x.strokeStyle = col; x.fillStyle = col;
    x.beginPath(); x.moveTo(X(k[0]), Y(k[2])); x.lineTo(X(k[0]), Y(k[3])); x.stroke();
    var top = Y(Math.max(k[1], k[4])), bot = Y(Math.min(k[1], k[4]));
    x.fillRect(X(k[0]) - bw/2, top, bw, Math.max(1, bot - top));
  });

  /* EMA çizgileri */
  function eline(arr, col){
    if(!arr || !arr.length) return;
    x.strokeStyle = col; x.lineWidth = 1.2; x.beginPath();
    var started = false;
    for(var i=0;i<arr.length && i<c.length;i++){
      var v = Number(arr[i]);
      if(!isFinite(v) || v<=0){ started=false; continue; }
      var xx = X(c[i][0]), yy = Y(v);
      if(!started){ x.moveTo(xx, yy); started=true; } else x.lineTo(xx, yy);
    }
    x.stroke(); x.lineWidth = 1;
  }
  eline(d.ema20, "#f0b90b");
  eline(d.ema50, "#4b9cf5");

  /* Üçgen eğimli çizgiler */
  function pline(pts, col, dashed){
    if(!pts || !pts.length) return;
    x.strokeStyle = col; x.lineWidth = 1.6;
    if(dashed) x.setLineDash([6,4]);
    x.beginPath();
    pts.forEach(function(p, i){ var xx=X(p[0]), yy=Y(p[1]); if(i===0)x.moveTo(xx,yy); else x.lineTo(xx,yy); });
    x.stroke();
    if(dashed) x.setLineDash([]);
    x.lineWidth = 1;
  }
  if(tri){
    pline(tri.upper, "#f6465d", true);
    pline(tri.lower, "#0ecb81", true);
    /* Pivot noktaları */
    if(tri.pivots){
      tri.pivots.forEach(function(p){
        x.fillStyle = p.side === "H" ? "#f6465d" : "#0ecb81";
        x.beginPath(); x.arc(X(p.t), Y(p.p), 3, 0, Math.PI*2); x.fill();
      });
    }
    /* Apex */
    if(tri.apexAt && tri.apexPrice){
      x.fillStyle = "var(--gold)"; x.fillStyle = "#fcd535";
      x.beginPath(); x.arc(X(tri.apexAt), Y(tri.apexPrice), 4, 0, Math.PI*2); x.fill();
      x.fillStyle = "#fcd535"; x.font = "600 9px sans-serif";
      x.fillText("apex", X(tri.apexAt)-10, Y(tri.apexPrice)-6);
    }
  }

  /* Yatay seviyeler */
  function level(v, col, l){
    if(!(Number(v)>0)) return;
    var yy = Y(v);
    if(yy < padT - 4 || yy > padT + ch + 4) return;
    x.strokeStyle = col; x.setLineDash([5,4]);
    x.beginPath(); x.moveTo(padL, yy); x.lineTo(padL + cw, yy); x.stroke();
    x.setLineDash([]);
    x.fillStyle = col; x.font = "700 10px sans-serif"; x.textAlign = "left";
    x.fillText(l + " " + px(v), padL + cw + 4, yy + 3);
  }
  level(s.sl,  "#f6465d", "SL");
  level(s.tp1, "#0ecb81", "TP1");
  level(s.tp2, "#0ecb81", "TP2");
  level(s.entry, "#eaecef", "G");
  (d.levels||[]).forEach(function(lv){ level(lv.v, lv.col||"#848e9c", lv.l||""); });

  /* Başlık */
  x.fillStyle = "#eaecef"; x.font = "700 11px sans-serif"; x.textAlign = "left";
  x.fillText((s.base||"") + "USDT · " + String(d.tf||"").toUpperCase(), padL + 2, 12);
  if(tri){
    x.fillStyle = "#fcd535"; x.font = "600 10px sans-serif";
    x.textAlign = "right";
    x.fillText("üçgen skor " + (tri.score||"—") + " · olgunluk " + num(tri.maturity,2) + " · sıkışma " + num(tri.compression,2), padL + cw, 12);
  }
}

/* ──────── Render ──────── */
function render(){
  renderNav(); renderTop();
  var ae = document.activeElement, typing = ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);
  var main = document.getElementById("main"), t = S.tab;
  if(typing) return;
  var head = "", h;
  if(t === "home"){ head = pageHead("Genel Bakış","v83 · LT Üçgen + Günlük Hızlı Scalp · AI sadece karar verir", S.lastAt?'<span class="chip neutral"><i class="fa-regular fa-clock"></i> '+new Date(S.lastAt).toLocaleTimeString("tr-TR")+'</span>':""); h = safe(pHome,"Ana Sayfa"); }
  else if(t === "radar"){ head = pageHead("Piyasa Radarı","RSI 1h/4h · genişlik · rejim"); h = safe(pRadar,"Radar"); }
  else if(t === "stats"){ head = pageHead("İstatistik","İşlem / atlama / sanal ayrı"); h = safe(pStats,"İstatistik"); }
  else if(t === "ai"){ head = pageHead("AI Analiz","AI aç/kapat + izleme AI'sı + sağlayıcı durumu"); h = safe(pAI,"AI"); }
  else{ head = pageHead(MODN[t]||t,""); h = safe(function(){ return pModule(t); },"Modül"); }
  main.innerHTML = head + h;
}

/* ──────── Veri çekimi ──────── */
async function refresh(){
  if(S.busy) return;
  S.busy = true;
  try{
    var st = await api("/api/state");
    if(st && st.version){ S.state = st; S.lastAt = Date.now(); }
    var t = S.tab, jobs = [];
    if(MODN[t]){
      jobs.push(api("/api/signals?module="+t).then(function(d){ if(d) S.sig[t] = d; }));
      if(t === "PUMP"){
        jobs.push(api("/api/paper").then(function(d){ if(d) S.paper = d; }));
        jobs.push(api("/api/watch/scalp").then(function(d){ if(d) S.watch.scalp = d; }));
      }
      if(t === "LT"){
        jobs.push(api("/api/watch/lt").then(function(d){ if(d) S.watch.lt = d; }));
      }
    }
    if(t === "home"){
      jobs.push(api("/api/signals").then(function(d){ if(!d)return; var by={}; (d.active||[]).forEach(function(s){ (by[s.module]=by[s.module]||{active:[],closed:[]}).active.push(s); }); S.sig = by; }));
      jobs.push(api("/api/paper").then(function(d){ if(d) S.paper = d; }));
      jobs.push(api("/api/watch/lt").then(function(d){ if(d) S.watch.lt = d; }));
      jobs.push(api("/api/watch/scalp").then(function(d){ if(d) S.watch.scalp = d; }));
    }
    if(t === "ai"){
      jobs.push(api("/api/ai/status").then(function(d){ if(d){ S.ai = d; } }));
      jobs.push(api("/api/ai/history").then(function(d){ if(d && d.items){ S.ai = S.ai || {}; S.ai.hist = d.items; } }));
    }
    if(t === "radar") jobs.push(api("/api/radar").then(function(d){ if(d) S.radar = d; }));
    if(t === "stats") jobs.push(api("/api/stats").then(function(d){ if(d) S.stats = d; }));
    await Promise.all(jobs);
  }catch(e){ console.error(e); }
  S.busy = false;
  try{ render(); }catch(e){ console.error(e); }
}

/* ──────── Tıklama ──────── */
document.addEventListener("click", async function(e){
  if(e.target.id === "modal"){ closeModal(); return; }
  if(e.target.id === "backdrop"){ document.getElementById("side").classList.remove("open"); e.target.remove(); return; }
  var t = e.target.closest("[data-act]"); if(!t) return;
  var a = t.getAttribute("data-act"), id = t.getAttribute("data-id"),
      sym = t.getAttribute("data-symbol"), base = t.getAttribute("data-base"),
      tf = t.getAttribute("data-tf"), dir = t.getAttribute("data-dir"),
      entry = t.getAttribute("data-entry"), upper = t.getAttribute("data-upper"),
      lower = t.getAttribute("data-lower"), kind = t.getAttribute("data-kind");
  try{
    if(a === "menu"){ var side = document.getElementById("side"), bd = document.getElementById("backdrop"), op = side.classList.toggle("open"); if(op && !bd){ bd = document.createElement("div"); bd.id = "backdrop"; document.body.appendChild(bd); } else if(!op && bd) bd.remove(); }
    else if(a === "refresh"){ toast("Yenileniyor…"); await refresh(); }
    else if(a === "tab"){ S.tab = id; closeModal(); var b2 = document.getElementById("backdrop"); if(b2) b2.remove(); document.getElementById("side").classList.remove("open"); document.getElementById("main").innerHTML = '<div class="empty">Yükleniyor…</div>'; renderNav(); await refresh(); }
    else if(a === "open") await openDetail(id);
    else if(a === "openChart") await openChart(sym, tf, dir, entry, { upper: upper, lower: lower });
    else if(a === "toggleAI"){
      var cur = g(S.state,"ai.settingsEnabled",false);
      var r = await post("/api/ai/toggle", { enabled: !cur });
      if(r && r.ok === true){ toast("AI "+(!cur?"AÇIK":"KAPALI"), "ok"); }
      else if(r && r.note){ toast(r.note, "err"); }
      else { toast("Hata","err"); }
      await refresh();
    }
    else if(a === "toggleWatchAuto"){
      var cur2 = g(S.ai,"watchAuto", g(S.state,"ai.watchAuto", false));
      var r2 = await post("/api/ai/toggle", { enabled: g(S.state,"ai.settingsEnabled",false), watchAuto: !cur2 });
      toast(r2&&r2.ok ? ("İzleme AI'sı "+(!cur2?"AÇIK":"KAPALI")) : "Hata", r2&&r2.ok?"ok":"err");
      await refresh();
    }
    else if(a === "closeModal") closeModal();
    else if(a === "closeSig"){
      if(!confirm("Kapat?")) return;
      var r3 = await post("/api/signal/"+encodeURIComponent(id)+"/close");
      toast(r3&&r3.ok?"Kapatıldı":"Hata", r3&&r3.ok?"ok":"err");
      closeModal(); await refresh();
    }
    else if(a === "execSig"){
      if(!confirm("İşlemi aç?")) return;
      var r4 = await post("/api/signal/"+encodeURIComponent(id)+"/execute");
      toast(r4&&r4.ok?"Açıldı":(r4&&r4.error)||"Hata", r4&&r4.ok?"ok":"err");
      closeModal(); await refresh();
    }
    else if(a === "aiWatch"){
      if(!base) return;
      var btn = t, old = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      var r5 = await post("/api/watch/"+(kind==="scalp"?"scalp":"lt")+"/"+encodeURIComponent(base)+"/ai");
      if(r5 && r5.ok === true){ toast("AI değerlendirmesi alındı","ok"); await refresh(); }
      else { toast((r5&&r5.error)||"AI yanıt vermedi","err"); btn.disabled = false; btn.innerHTML = old; }
    }
    else if(a === "aiTest"){
      toast("Test…");
      var rt = await api("/api/ai/test");
      var okc = 0, tot = 0;
      ((rt&&rt.providers)||[]).forEach(function(p){ (p.results||[]).forEach(function(m){ tot++; if(m.ok) okc++; }); });
      toast("Test: "+okc+"/"+tot, okc?"ok":"err");
    }
    else if(a === "aiReset"){
      await post("/api/ai/reset");
      toast("Sıfırlandı","ok"); await refresh();
    }
    else if(a === "closePaper"){
      if(!confirm("Kapat?")) return;
      var r6 = await post("/api/paper/"+encodeURIComponent(id)+"/close");
      toast(r6&&r6.ok?"Kapatıldı":"Hata", r6&&r6.ok?"ok":"err"); await refresh();
    }
    else if(a === "toggleAuto"){
      var on = g(S.paper,"settings.auto",false);
      var r7 = await post("/api/paper/toggle", { auto: !on });
      toast("Oto "+(!on?"AÇIK":"KAPALI"), r7&&r7.ok?"ok":"err"); await refresh();
    }
    else if(a === "resetPaper"){
      if(!confirm("Sanal bakiye sıfırlansın mı?")) return;
      await post("/api/paper/reset");
      toast("Sıfırlandı","ok"); await refresh();
    }
    else if(a === "saveSet"){
      var v = function(i){ var el = document.getElementById(i); return el ? Number(el.value) : undefined; };
      var r8 = await post("/api/paper/settings", { margin: v("s_margin"), leverage: v("s_lev"), riskPct: v("s_risk"), maxOpen: v("s_maxopen"), dailyLossPct: v("s_dl") });
      toast(r8&&r8.ok?"Kaydedildi":"Hata", r8&&r8.ok?"ok":"err"); await refresh();
    }
  }catch(err){ console.error(err); toast("Hata","err"); }
});
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });

renderNav(); renderTop(); refresh(); setInterval(refresh, 5000);
</script>
