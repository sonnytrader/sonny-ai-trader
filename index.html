function verdictChip(a){if(!a||!a.verdict)return "";var v=String(a.verdict).toUpperCase(),k=v==="ONY"?"long":v==="RED"?"short":"gold";var l=a.verdictLabel||(v==="ONY"?"GİRİLİR":v==="RED"?"GİRİLMEZ":"BEKLE");return '<span class="chip '+k+'"><i class="fa-solid fa-brain"></i> '+esc(l)+(a.trust?" · "+esc(a.trust):"")+(a.score!=null?" "+num(a.score,0):"")+'</span>';}
function listHtml(a){if(!a||!a.length)return '<span class="mut">—</span>';return a.map(function(x){return '<div style="display:flex;gap:7px;margin:4px 0"><span class="gold">•</span><span>'+esc(x)+'</span></div>';}).join("");}

function pageHead(t,sub,r){return '<div style="display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap"><div><h1 style="margin:0;font-size:21px">'+t+'</h1>'+(sub?'<p style="margin:5px 0 0;font-size:12.5px;color:var(--mut)">'+sub+'</p>':"")+'</div>'+(r?'<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">'+r+'</div>':"")+'</div>';}

/* v81.0 — AI analiz kartı (yeni alanlar dahil) */
function analysisCard(a,title,note){
  if(!a)return '<div class="card empty" style="padding:12px">'+esc(note||"Analiz yok")+'</div>';
  var conf=clamp(Number(a.score)||0,0,100),col=conf>=70?"var(--green)":conf>=50?"var(--gold)":"var(--red)",meta=[];
  if(a.providerName)meta.push(esc(a.providerName)+(a.model?" · "+esc(a.model):""));
  if(a.latencyMs)meta.push(num(a.latencyMs,0)+" ms");
  if(a.at)meta.push(new Date(a.at).toLocaleString("tr-TR"));
  var p=function(t,st){return t?'<p style="font-size:12px;line-height:1.6;margin:8px 0 0;'+(st||"")+'">'+t+'</p>':"";};
  var phaseChip=a.phase?'<span class="chip neutral">'+esc(a.phase)+'</span>':"";
  var dqChip=a.dataQuality?'<span class="chip neutral">Veri: '+esc(a.dataQuality)+'</span>':"";
  var lateChip=a.lateEntry?'<span class="chip gold">GEÇ KALINMIŞ</span>':"";
  return '<div class="card" style="padding:14px 16px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:12.5px">'+esc(title)+'</b>'+verdictChip(a)+phaseChip+dqChip+lateChip+(a.riskLevel?'<span class="chip neutral">Risk: '+esc(a.riskLevel)+'</span>':"")+(a.source==="ai"?'<span class="chip gold">AI</span>':'<span class="chip neutral">KURAL</span>')+'</div>'+
   (meta.length?'<div style="font-size:10.5px;color:var(--mut-2);margin-top:5px">'+meta.join(" · ")+'</div>':"")+
   '<div style="display:flex;align-items:center;gap:8px;margin-top:10px"><div class="bar" style="height:5px;flex:1"><i style="width:'+conf+'%;background:'+col+'"></i></div><b class="num" style="font-size:11px">'+conf+'/100</b></div>'+
   p(a.simpleSummary&&'<b>'+esc(a.simpleSummary)+'</b>')+p(a.summary&&esc(a.summary),"color:#c9ced6")+(a.reason&&a.reason!==a.summary?p('<b>Neden:</b> '+esc(a.reason),"color:#c9ced6"):"")+
   p(a.marketView&&'<b>Piyasa:</b> '+esc(a.marketView),"color:var(--mut)")+
   (a.evidence&&a.evidence.length?'<div style="margin-top:10px;font-size:11.5px"><b class="mut">Kanıt</b>'+listHtml(a.evidence)+'</div>':"")+
   (a.reasons&&a.reasons.length?'<div style="margin-top:10px;font-size:11.5px"><b class="mut">Gerekçeler</b>'+listHtml(a.reasons)+'</div>':"")+
   (a.missingConditions&&a.missingConditions.length?'<div style="margin-top:8px;font-size:11.5px"><b class="mut">Eksik Koşullar</b>'+listHtml(a.missingConditions)+'</div>':"")+
   (a.risks&&a.risks.length?'<div style="margin-top:8px;font-size:11.5px"><b class="mut">Riskler</b>'+listHtml(a.risks)+'</div>':"")+
   (a.bullishScenario||a.bearishScenario?'<div style="margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px">'+
     (a.bullishScenario?'<div style="flex:1;min-width:180px"><b class="up">↑ Senaryo</b><div style="color:#c9ced6;margin-top:3px">'+esc(a.bullishScenario)+'</div></div>':"")+
     (a.bearishScenario?'<div style="flex:1;min-width:180px"><b class="dn">↓ Senaryo</b><div style="color:#c9ced6;margin-top:3px">'+esc(a.bearishScenario)+'</div></div>':"")+
   '</div>':"")+
   (a.triggerCondition?'<div style="margin-top:10px;font-size:11.5px"><b class="gold">⏱ Tetik:</b> <span style="color:#c9ced6">'+esc(a.triggerCondition)+'</span></div>':"")+
   (a.invalidationCondition?'<div style="margin-top:6px;font-size:11.5px"><b class="dn">✕ Geçersizlik:</b> <span style="color:#c9ced6">'+esc(a.invalidationCondition)+'</span></div>':"")+
   p(a.suggested&&'<b class="up">Plan:</b> '+esc(a.suggested))+p(a.invalidation&&'<b class="dn">Geçersizlik:</b> '+esc(a.invalidation))+p(a.timeHorizon&&'Vade: '+esc(a.timeHorizon),"color:var(--mut-2)")+'</div>';
}
function indicatorTag(k,v){
  if(typeof v!=="number")return "";k=String(k).toLowerCase();var l="",c="";
  if(k==="adx"){if(v>=30){l="GÜÇLÜ TREND";c="ok";}else if(v>=20){l="NÖTR";c="warn";}else{l="ZAYIF TREND";c="bad";}}
  else if(k==="volratio"){if(v>=1.5){l="GÜÇLÜ HACİM";c="ok";}else if(v>=1){l="NÖTR";c="warn";}else{l="ZAYIF HACİM";c="bad";}}
  else if(k==="rsi"){if(v>70||v<30){l=v>70?"AŞIRI ALIM":"AŞIRI SATIM";c="bad";}else{l="NORMAL";c="ok";}}
  else if(k==="spreadpct"){if(v<=0.1){l="DAR SPREAD";c="ok";}else if(v<=0.3){l="NÖTR";c="warn";}else{l="GENİŞ SPREAD";c="bad";}}
  else if(k==="riskpct"){if(v<=0.5){l="DAR STOP";c="ok";}else if(v<=1.5){l="NÖTR";c="warn";}else{l="GENİŞ STOP";c="bad";}}
  else if(k==="counterwick"){if(v<=0.15){l="TEMİZ";c="ok";}else if(v<=0.3){l="NÖTR";c="warn";}else{l="TERS FİTİL";c="bad";}}
  else if(k==="ext"){if(v<=1.5){l="YAKIN";c="ok";}else if(v<=2.3){l="NÖTR";c="warn";}else{l="UZAMIŞ";c="bad";}}
  return l?'<span class="tag '+c+'">'+l+'</span>':"";
}

/* ── Sinyal kartı ── */
function sigCard(s){
  var act=s.status==="AKTIF",pAI=s.status==="AI_BEKLIYOR",pAp=s.status==="ONAY_BEKLIYOR";
  var pct=act?g(s,"livePct",null):g(s,"pnlPct",null),conf=clamp(Number(s.conf)||0,0,100),i=s.info||{},tags="";
  if(s.marketAlign==="TERS")tags+='<span class="chip gold">PİYASAYA TERS</span>';else if(s.marketAlign==="UYUMLU")tags+='<span class="chip long">PİYASA UYUMLU</span>';
  if(s.module==="PUMP"&&i.tf)tags+='<span class="chip neutral">'+esc(i.tf)+' KIRILIM</span>';
  if(g(s,"confl",[]).length)tags+='<span class="chip neutral">TEYİT x'+(s.confl.length+1)+'</span>';
  if(i.retest)tags+='<span class="chip long">LT RETEST</span>';
  if(i.sweepSide)tags+='<span class="chip '+(i.sweepSide==="PDL"?"long":"short")+'">'+i.sweepSide+' SÜPÜRME</span>';
  if(i.source==="ai")tags+='<span class="chip gold"><i class="fa-solid fa-wand-magic-sparkles"></i> AI SİNYALİ</span>';
  else if(s.ai&&!s.ai.error)tags+=verdictChip(s.ai);
  if(s.ai&&s.ai.phase)tags+='<span class="chip neutral">'+esc(s.ai.phase)+'</span>';
  if(pAI)tags+='<span class="chip gold"><i class="fa-solid fa-hourglass-half"></i> AI DÜŞÜNÜYOR</span>';
  else if(pAp)tags+='<span class="chip gold"><i class="fa-solid fa-hand"></i> ONAY BEKLİYOR</span>';
  else if(s.aiGate&&s.aiGate.state==="APPROVED")tags+='<span class="chip long"><i class="fa-solid fa-shield-halved"></i> AI ONAYLI</span>';
  else if(s.aiGate&&s.aiGate.state==="OFFLINE")tags+='<span class="chip neutral">AI ÇEVRİMDIŞI</span>';
  if(act&&s.tp1Hit)tags+='<span class="chip long">TP1 ✔ yarı satıldı</span>';
  if(!act&&!pAI&&!pAp)tags+=resChip(s.result);
  var bar="";
  if(pAp)bar='<div style="display:flex;gap:6px;align-items:center"><button class="btn green" style="flex:1;padding:7px;font-size:12px" data-act="execSig" data-id="'+esc(s.id)+'"><i class="fa-solid fa-check"></i> Onayla ve Aç</button><span class="mut" style="font-size:10px"><i class="fa-regular fa-clock"></i> '+dur(Math.max(0,(s.approvalExpiresAt||0)-Date.now()))+'</span></div>';
  return '<article class="sig '+(s.dir==="LONG"?"long":"short")+'" data-act="open" data-id="'+esc(s.id)+'"><div class="sig-h"><div class="sym">'+esc(s.base)+'<span>USDT</span></div>'+dirChip(s.dir)+'<span class="age">'+(act?dur(Date.now()-s.createdAt):dur((s.closedAt||Date.now())-s.createdAt))+'</span></div>'+
   '<div class="sig-mod"><i class="fa-solid fa-microchip"></i> '+esc(g(s,"modLabel",MODN[s.module]||s.module))+'</div>'+
   '<div class="sig-px"><div><span>Giriş</span><b>'+px(s.entry)+'</b></div><div><span>Hedef</span><b class="up">'+px(s.tp1)+'</b></div><div><span>Stop</span><b class="dn">'+px(s.curSl||s.sl)+'</b></div></div>'+
   '<div class="sig-f"><div class="conf"><div class="bar"><i style="width:'+conf+'%;background:'+(conf>=70?"var(--green)":conf>=50?"var(--gold)":"var(--red)")+'"></i></div><em>'+num(conf,0)+'</em></div><span class="pnl '+(pct==null?"mut":cls(pct))+'">'+(pct==null?"—":sgn(pct,2)+"%")+'</span></div>'+bar+(tags?'<div class="sig-tags">'+tags+'</div>':"")+'</article>';
}

/* ── v81.0: LT watch tablosu (zenginleştirilmiş AI sütunu) ── */

  var ltw=g(S.watch,"lt.items",[]);

    ltw.slice(0,limit||40).map(function(w){
      var up=w.distUpper!=null?w.distUpper:((w.upper/w.price-1)*100);
      var lo=w.distLower!=null?w.distLower:((1-w.lower/w.price)*100);
      var aiCell='<span class="mut" style="font-size:11px">AI bekleniyor…</span>';
      if(w.ai){
        var vChip=w.ai.verdict==='ONY'?'<span class="chip long">GİRİLİR</span>':'<span class="chip short">GİRİLMEZ</span>';
        var stale=w.ai.at&&Date.now()-w.ai.at>30*60000?'<span class="chip neutral">ESKİ</span>':'';
        var phaseChip=w.ai.phase?'<span class="chip neutral">'+esc(w.ai.phase)+'</span>':'';
        var dqChip=w.ai.dataQuality?'<span class="chip neutral">'+esc(w.ai.dataQuality)+'</span>':'';
        aiCell='<div class="ai-cell">'+vChip+stale+phaseChip+dqChip+' <b>'+num(w.ai.score,0)+'</b>'+
          '<div style="margin-top:4px;color:#c9ced6">'+esc((w.ai.summary||w.ai.reason||"").slice(0,180))+'</div>'+
          (w.ai.bullishScenario?'<span class="ai-scn up">↑ '+esc(w.ai.bullishScenario.slice(0,110))+'</span>':"")+
          (w.ai.bearishScenario?'<span class="ai-scn dn">↓ '+esc(w.ai.bearishScenario.slice(0,110))+'</span>':"")+
          (w.ai.triggerCondition?'<span class="ai-scn gold">⏱ '+esc(w.ai.triggerCondition.slice(0,110))+'</span>':"")+
          (w.ai.invalidationCondition?'<span class="ai-scn mut">✕ '+esc(w.ai.invalidationCondition.slice(0,100))+'</span>':"")+
          '<div style="margin-top:4px;font-size:10px;color:var(--mut-2)">'+esc(w.ai.providerName||'AI')+(w.ai.model?' · '+esc(w.ai.model):'')+(w.ai.at?' · '+new Date(w.ai.at).toLocaleTimeString('tr-TR'):'')+'</div>'+
          '</div>';
      } else if(w.aiBusy){ aiCell='<span class="mut" style="font-size:11px"><i class="fa-solid fa-spinner fa-spin"></i> AI düşünüyor…</span>'; }

    }).join('')+'</tbody></table></div>';

      var cm=g(S.paper,"settings.tradeMode","paper"),nw=cm==="live"?"paper":"live";
      if(nw==="live"&&!confirm("DİKKAT! Gerçek parayla işlem yapacaksınız. Emin misiniz?"))return;
      var r4=await post("/api/trade/mode",{mode:nw});toast(r4&&r4.ok?"Mod: "+(nw==="live"?"LIVE":"PAPER"):(r4&&r4.error)||"Mod değiştirilemedi",r4&&r4.ok?"ok":"err");await refresh();
    }
    else if(a==="resetPaper"){if(confirm("Sanal hesap 1000 USDT'ye sıfırlansın mı? Tüm sanal geçmiş silinir.")){var r5=await post("/api/paper/reset");if(r5&&r5.ok)toast("Sanal hesap sıfırlandı","ok");await refresh();}}
    else if(a==="saveSet"){
      var v=function(i){var el=document.getElementById(i);return el?Number(el.value):undefined;};
      var r6=await post("/api/paper/settings",{margin:v("s_margin"),leverage:v("s_lev"),riskPct:v("s_risk"),maxOpen:v("s_maxopen"),dailyLossPct:v("s_dl")});
      if(r6&&r6.ok){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();toast("Ayarlar kaydedildi","ok");await refresh();}else toast("Ayarlar kaydedilemedi","err");
    }
    else if(a==="runBt"){
      var b={module:document.getElementById("b_mod").value,tf:document.getElementById("b_tf").value,coins:Number(document.getElementById("b_coins").value)||10,engine:document.getElementById("b_eng").value};
      var rs=await post("/api/backtest",b);if(!rs||!rs.id){toast((rs&&rs.error)||"Backtest başlatılamadı","err");return;}
      S.jobId=rs.id;S.job={status:"çalışıyor",progress:0};render();pollJob();
    }
  }catch(err){console.error(err);toast("İşlem hatası","err");}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});
function pollJob(){if(!S.jobId)return;api("/api/backtest/"+S.jobId).then(function(j){if(j){S.job=j;if(S.tab==="bt")render();}if(j&&j.status==="çalışıyor")setTimeout(pollJob,2000);});}
var rz;window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){try{if(S.detail)drawChart(document.getElementById("dcv"),S.detail);drawBt();}catch(e){}},140);});

renderNav();renderTop();refresh();setInterval(refresh,5000);
</script>
</body>
</html>
