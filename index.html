<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlphaSon v63.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body{background:#0b1220;color:#e5e7eb;font-family:system-ui,sans-serif}
.card{background:#111a2e;border:1px solid #1e2b47;border-radius:.75rem}
.up{color:#34d399}.dn{color:#f87171}.mut{color:#8b9bb8}
.tab{display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;border-radius:.6rem;cursor:pointer;white-space:nowrap;color:#9fb0cc}
.tab:hover{background:#16233d}.tab.on{background:#1d4ed8;color:#fff}
.bd{padding:.1rem .5rem;border-radius:.4rem;font-size:.7rem;font-weight:700}
.inp{background:#0b1220;border:1px solid #28406b;border-radius:.4rem;padding:.3rem .5rem;width:100%;color:#fff}
th,td{padding:.4rem .6rem;text-align:left;white-space:nowrap}th{color:#8b9bb8;font-weight:600}tr+tr td{border-top:1px solid #1e2b47}
canvas{width:100%;display:block}
</style></head>
<body>
<div class="flex flex-col md:flex-row min-h-screen">
  <nav class="md:w-56 md:min-h-screen p-2 md:p-3 flex md:flex-col gap-1 overflow-x-auto" style="background:#0d1626;border-right:1px solid #1e2b47">
    <div class="hidden md:block px-2 py-3 text-xl font-bold"><i class="fa-solid fa-bolt text-yellow-400"></i> AlphaSon <span class="text-xs mut">v63.0</span></div>
    <div id="tabs" class="flex md:flex-col gap-1"></div>
  </nav>
  <div class="flex-1 min-w-0">
    <header id="top" class="sticky top-0 z-10 p-3 flex flex-wrap items-center gap-3" style="background:#0b1220ee;border-bottom:1px solid #1e2b47">Yükleniyor...</header>
    <main id="main" class="p-3 md:p-5">Yükleniyor...</main>
  </div>
</div>
<div id="detail" class="hidden"></div>

<script>
"use strict";
var MODN={PUMP:"AlgoPump",TREND:"Trend",LT:"LT Üçgen",ZONE:"Zone Master",SCALPER:"Scalper",RANGE:"Range Pro"};
var TABS=[["home","Ana Sayfa","fa-house"],["radar","Piyasa Radarı","fa-satellite-dish"],["PUMP","AlgoPump","fa-bolt"],["TREND","Trend","fa-chart-line"],["LT","LT Üçgenler","fa-caret-right"],["ZONE","Zone Master","fa-layer-group"],["SCALPER","Scalper","fa-gauge-high"],["RANGE","Range Pro","fa-compress"],["strat","Stratejiler","fa-book"],["bt","Backtest","fa-flask"],["stats","İstatistik","fa-table"]];
var RES={TP1:"TP1 ✔",TP2:"TP2 ✔",SL:"STOP",BE:"BAŞA BAŞ",SURE:"SÜRE DOLDU",MANUEL:"MANUEL",TREND_BITTI:"TREND BİTTİ"};
var S={tab:"home",state:null,sig:{},paper:null,watch:{},radar:null,stats:null,strat:null,job:null,jobId:null,detail:null};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function g(o,p,d){try{var v=o;var a=p.split(".");for(var i=0;i<a.length;i++){if(v==null)return d;v=v[a[i]];}return v==null?d:v;}catch(e){return d;}}
function num(x,n){x=Number(x);return isFinite(x)?x.toFixed(n==null?2:n):"-";}
function px(x){x=Number(x);if(!isFinite(x))return "-";return x>=1?x.toFixed(4):x.toPrecision(4);}
function dur(ms){ms=Math.max(0,Number(ms)||0);var m=Math.floor(ms/60000);return m<60?m+" dk":Math.floor(m/60)+" sa "+(m%60)+" dk";}
function cls(x){return Number(x)>=0?"up":"dn";}
function sgn(x,n){x=Number(x);return isFinite(x)?(x>=0?"+":"")+x.toFixed(n==null?2:n):"-";}
function api(p,o){return fetch(p,o).then(function(r){return r.json();}).catch(function(){return null;});}
function post(p,b){return api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});}
function safe(fn,name){try{return fn();}catch(e){console.error(name,e);return "<div class=\"card p-3 dn\">"+esc(name||"Bölüm")+" yüklenemedi</div>";}}

/* ---------- parçalar ---------- */
function dirBadge(d){return d==="LONG"?"<span class=\"bd\" style=\"background:#064e3b;color:#34d399\">LONG</span>":"<span class=\"bd\" style=\"background:#7f1d1d;color:#f87171\">SHORT</span>";}
function mktBadge(d){var m={LONG:["#064e3b","#34d399","LONG"],SHORT:["#7f1d1d","#f87171","SHORT"],NOTR:["#374151","#d1d5db","NÖTR"]}[d]||["#374151","#d1d5db","NÖTR"];return "<span class=\"bd\" style=\"background:"+m[0]+";color:"+m[1]+";font-size:.85rem\">"+m[2]+"</span>";}
function sigCard(s){return safe(function(){
  var act=s.status==="AKTIF";
  var st=act?(s.tp1Hit?"<span class=\"up\">AKTİF · TP1 ✔</span>":"AKTİF"):esc(RES[s.result]||s.result||"KAPALI");
  var pct=act?g(s,"livePct",null):g(s,"pnlPct",null);
  var tags="";
  if(s.counter)tags+="<span class=\"bd\" style=\"background:#78350f;color:#fbbf24\">COUNTER</span> ";
  if(g(s,"confl",[]).length)tags+="<span class=\"bd\" style=\"background:#1e3a8a;color:#93c5fd\">KONFLUANS x"+(s.confl.length+1)+"</span>";
  return "<div class=\"card p-3 cursor-pointer hover:border-blue-500\" data-action=\"open\" data-id=\""+esc(s.id)+"\">"+
  "<div class=\"flex items-center justify-between\"><div class=\"font-bold\">"+esc(s.base)+" "+dirBadge(s.dir)+"</div><div class=\"text-xs mut\">"+esc(g(s,"modLabel",""))+"</div></div>"+
  "<div class=\"grid grid-cols-2 gap-x-3 text-sm mt-2\"><div class=\"mut\">Giriş</div><div>"+px(s.entry)+"</div><div class=\"mut\">TP1</div><div class=\"up\">"+px(s.tp1)+"</div>"+
  (s.tp2?"<div class=\"mut\">TP2</div><div class=\"up\">"+px(s.tp2)+"</div>":"")+
  "<div class=\"mut\">SL</div><div class=\"dn\">"+px(s.sl)+"</div><div class=\"mut\">Güven</div><div>"+num(s.conf,0)+"</div>"+
  "<div class=\"mut\">Durum</div><div>"+st+"</div><div class=\"mut\">Süre</div><div>"+dur((act?Date.now():(s.closedAt||Date.now()))-s.createdAt)+"</div>"+
  "<div class=\"mut\">Kâr/Zarar</div><div class=\""+cls(pct)+"\">"+(pct==null?"-":sgn(pct,2)+"%")+"</div></div>"+
  (tags?"<div class=\"mt-2 flex gap-1 flex-wrap\">"+tags+"</div>":"")+"</div>";},"Kart");}
function grid(list,empty){if(!list||!list.length)return "<div class=\"mut p-3\">"+esc(empty||"Kayıt yok")+"</div>";return "<div class=\"grid gap-3 sm:grid-cols-2 xl:grid-cols-3\">"+list.map(sigCard).join("")+"</div>";}
function stat(l,v,c){return "<div class=\"card p-3\"><div class=\"text-xs mut\">"+esc(l)+"</div><div class=\"text-xl font-bold "+(c||"")+"\">"+v+"</div></div>";}
function h2(t){return "<h2 class=\"text-lg font-bold mt-5 mb-2\">"+esc(t)+"</h2>";}
function closedTable(list){
  if(!list||!list.length)return "<div class=\"mut p-3\">Henüz kapanan sinyal yok</div>";
  return "<div class=\"card overflow-x-auto\"><table class=\"w-full text-sm\"><tr><th>Coin</th><th>Yön</th><th>Giriş</th><th>Çıkış</th><th>Sonuç</th><th>Net R</th><th>Süre</th></tr>"+
  list.slice(0,15).map(function(s){return "<tr class=\"cursor-pointer\" data-action=\"open\" data-id=\""+esc(s.id)+"\"><td>"+esc(s.base)+"</td><td>"+dirBadge(s.dir)+"</td><td>"+px(s.entry)+"</td><td>"+px(s.exit)+"</td><td>"+esc(RES[s.result]||s.result)+"</td><td class=\""+cls(s.netR)+"\">"+sgn(s.netR,2)+"</td><td>"+dur((s.closedAt||0)-s.createdAt)+"</td></tr>";}).join("")+"</table></div>";}

/* ---------- sayfalar ---------- */
function pHome(){
  var st=S.state;if(!st)return "Yükleniyor...";
  var m=st.market||{},p=st.paper||{},bm=g(st,"counts.byModule",{});
  var h="<div class=\"grid grid-cols-2 lg:grid-cols-4 gap-3\">"+
   stat("Piyasa Yönü",mktBadge(m.dir))+stat("Piyasa Skoru",num(m.score,2)+" <span class=\"text-xs mut\">genişlik %"+num((m.breadth||0)*100,0)+"</span>")+
   stat("Aktif Sinyal",g(st,"counts.active",0)+" / 14")+stat("Paper Bakiye",num(p.balance,2)+" USDT",cls((p.balance||0)-(p.start||0)))+"</div>";
  h+=h2("Modüllere Göre Aktif Sinyaller")+"<div class=\"grid grid-cols-2 lg:grid-cols-6 gap-3\">"+Object.keys(MODN).map(function(k){return stat(MODN[k],bm[k]||0);}).join("")+"</div>";
  h+=h2("Oto-Trade")+"<div class=\"card p-3\">Durum: "+(g(st,"settings.auto",false)?"<b class=\"up\">AÇIK</b>":"<b class=\"dn\">KAPALI</b>")+" · Açık paper: "+g(p,"open",0)+" · Başarı: %"+num(p.winRate,1)+" · Toplam PnL: <span class=\""+cls(p.sumPnl)+"\">"+sgn(p.sumPnl,2)+" USDT</span></div>";
  var all=[];Object.keys(S.sig).forEach(function(k){all=all.concat(g(S.sig[k],"active",[]));});
  all.sort(function(a,b){return b.createdAt-a.createdAt;});
  h+=h2("Son Aktif Sinyaller")+grid(all.slice(0,9),"Aktif sinyal yok");
  return h;}
function pModule(k){
  var d=S.sig[k];if(!d)return "Yükleniyor...";
  var h="";
  if(k==="PUMP")h+=safe(pPaper,"Paper paneli");
  h+=h2("Aktif Sinyaller")+grid(d.active,"Şu an aktif sinyal yok");
  if(k==="LT"){h+=h2("Kırılmaya Yaklaşanlar")+watchTable("lt");}
  if(k==="ZONE"){h+=h2("İzleme Listesi")+watchTable("zone");}
  if(k==="RANGE"){h+=h2("İzleme Listesi")+watchTable("range");}
  h+=h2("Son Kapananlar")+closedTable(d.closed);
  return h;}
function watchTable(kind){
  var w=S.watch[kind];if(!w)return "<div class=\"mut p-3\">Yükleniyor...</div>";
  var it=w.items||[];if(!it.length)return "<div class=\"mut p-3\">İzlenen coin yok</div>";
  var head={lt:"<th>Coin</th><th>Fiyat</th><th>Üst</th><th>Alt</th><th>Olgunluk</th><th>Sıkışma</th><th>Yakın</th>",zone:"<th>Coin</th><th>Tür</th><th>Bölge</th><th>Skor</th><th>Mesafe</th><th>Fiyat</th>",range:"<th>Coin</th><th>Fiyat</th><th>Range Üst</th><th>Range Alt</th><th>Sıkışma</th><th>Yakın</th>"}[kind];
  var rows=it.slice(0,30).map(function(x){return safe(function(){
    if(kind==="lt")return "<tr><td>"+esc(x.base)+"</td><td>"+px(x.price)+"</td><td>"+px(x.upper)+"</td><td>"+px(x.lower)+"</td><td>%"+num(x.maturity*100,0)+"</td><td>"+num(x.compression,2)+"</td><td>"+esc(x.nearSide)+"</td></tr>";
    if(kind==="zone")return "<tr><td>"+esc(x.base)+"</td><td class=\""+(x.side==="DESTEK"?"up":"dn")+"\">"+esc(x.side)+"</td><td>"+px(x.lo)+" – "+px(x.hi)+"</td><td>"+num(x.score,1)+"</td><td>%"+num(x.dist,2)+"</td><td>"+px(x.price)+"</td></tr>";
    return "<tr><td>"+esc(x.base)+"</td><td>"+px(x.price)+"</td><td>"+px(x.rangeHi)+"</td><td>"+px(x.rangeLo)+"</td><td>"+num(x.squeezeScore,0)+"</td><td>"+esc(x.nearSide)+"</td></tr>";},"Satır");}).join("");
  return "<div class=\"card overflow-x-auto\"><table class=\"w-full text-sm\"><tr>"+head+"</tr>"+rows+"</table></div>";}
function pPaper(){
  var p=S.paper;if(!p)return "<div class=\"mut\">Paper verisi yükleniyor...</div>";
  var st=p.settings||{},sm=p.summary||{},on=!!st.auto;
  var h="<button data-action=\"toggleAuto\" class=\"w-full py-5 rounded-xl text-2xl font-extrabold text-white\" style=\"background:"+(on?"#059669":"#b91c1c")+"\"><i class=\"fa-solid fa-power-off\"></i> OTO TRADE "+(on?"AÇIK":"KAPALI")+"</button>";
  h+="<div class=\"card p-3 mt-3\"><div class=\"font-bold mb-2\">Paper Ayarları</div><div class=\"grid grid-cols-2 md:grid-cols-5 gap-3 items-end\">"+
   "<label class=\"text-xs mut\">Margin (USDT)<input id=\"s_margin\" class=\"inp\" type=\"number\" value=\""+esc(st.margin)+"\"></label>"+
   "<label class=\"text-xs mut\">Kaldıraç (x)<input id=\"s_lev\" class=\"inp\" type=\"number\" value=\""+esc(st.leverage)+"\"></label>"+
   "<label class=\"text-xs mut\">Min Güven<input id=\"s_conf\" class=\"inp\" type=\"number\" value=\""+esc(st.minConf)+"\"></label>"+
   "<label class=\"text-xs mut\">Max Süre (dk)<input id=\"s_min\" class=\"inp\" type=\"number\" value=\""+esc(st.maxMinutes)+"\"></label>"+
   "<button data-action=\"saveSet\" class=\"bg-blue-600 hover:bg-blue-500 rounded-lg py-2 font-bold\">Kaydet</button></div>"+
   "<div class=\"text-xs mut mt-2\">Max "+g(p,"limits.maxOpen",4)+" açık paper · sektör limiti "+g(p,"limits.sectorLimit",2)+" · günlük zarar limiti %"+num(g(p,"limits.dailyLoss",0.05)*100,0)+"</div></div>";
  h+="<div class=\"grid grid-cols-2 lg:grid-cols-5 gap-3 mt-3\">"+stat("Toplam",sm.total||0)+stat("Açık",sm.open||0)+stat("Başarı","%"+num(sm.winRate,1))+stat("Bakiye",num(sm.balance,2),cls((sm.balance||0)-(sm.start||0)))+stat("Ort. PnL",sgn(sm.avgPnl,2),cls(sm.avgPnl))+"</div>";
  h+=h2("Açık Paper İşlemler");
  var op=p.open||[];
  h+=op.length?"<div class=\"grid gap-3 sm:grid-cols-2 xl:grid-cols-3\">"+op.map(function(x){return safe(function(){return "<div class=\"card p-3\"><div class=\"flex justify-between\"><b>"+esc(x.base)+" "+dirBadge(x.dir)+"</b><span class=\"text-xs mut\">"+x.leverage+"x · "+num(x.margin,0)+" USDT</span></div>"+
   "<div class=\"grid grid-cols-2 text-sm mt-2\"><span class=\"mut\">Giriş</span><span>"+px(x.entry)+"</span><span class=\"mut\">Güncel</span><span>"+px(x.livePrice)+"</span><span class=\"mut\">TP1</span><span class=\"up\">"+px(x.tp1)+"</span><span class=\"mut\">SL</span><span class=\"dn\">"+px(x.sl)+"</span><span class=\"mut\">Süre</span><span>"+dur(x.ageMs)+"</span></div>"+
   "<div class=\"text-xl font-bold mt-2 "+cls(x.livePnl)+"\">"+sgn(x.livePnl,2)+" USDT <span class=\"text-sm\">("+sgn(x.livePnlPct,1)+"%)</span></div>"+
   "<button data-action=\"closePaper\" data-id=\""+esc(x.id)+"\" class=\"mt-2 w-full bg-red-800 hover:bg-red-700 rounded py-1 text-sm\">Manuel Kapat</button></div>";},"Paper kartı");}).join("")+"</div>":"<div class=\"mut p-3\">Açık paper yok</div>";
  h+=h2("Son Kapanan Paper İşlemler");
  var cl=p.closed||[];
  h+=cl.length?"<div class=\"card overflow-x-auto\"><table class=\"w-full text-sm\"><tr><th>Coin</th><th>Yön</th><th>Giriş</th><th>Çıkış</th><th>Sonuç</th><th>PnL</th><th>Süre</th></tr>"+cl.slice(0,15).map(function(x){return "<tr><td>"+esc(x.base)+"</td><td>"+dirBadge(x.dir)+"</td><td>"+px(x.entry)+"</td><td>"+px(x.exit)+"</td><td>"+esc(RES[x.result]||x.result)+"</td><td class=\""+cls(x.pnl)+"\">"+sgn(x.pnl,2)+" ("+sgn(x.pnlPct,1)+"%)</td><td>"+dur(x.durationMs)+"</td></tr>";}).join("")+"</table></div>":"<div class=\"mut p-3\">Kapanan paper yok</div>";
  h+="<div class=\"mt-3\"><button data-action=\"resetPaper\" class=\"text-xs mut underline\">Paper hesabını sıfırla</button></div>";
  return h;}
function pRadar(){
  var r=S.radar&&S.radar.radar;if(!r||!r.updatedAt)return "Yükleniyor...";
  var h="<div class=\"grid gap-3 md:grid-cols-3\">";
  h+="<div class=\"card p-4\"><div class=\"mut text-sm\">Korku / Hırs Endeksi</div>"+(r.fng?"<div class=\"text-4xl font-extrabold my-2\">"+esc(r.fng.value)+"</div><div class=\"font-bold\">"+esc(r.fng.label)+"</div><p class=\"text-sm mut mt-2\">"+esc(r.fng.text)+"</p>":"<p class=\"mut\">Veri alınamadı</p>")+"</div>";
  var s=r.rsi||{};
  h+="<div class=\"card p-4\"><div class=\"mut text-sm\">RSI (1 saat / 4 saat)</div><div class=\"my-2\">BTC: <b>"+num(s.btc1h,0)+"</b> / <b>"+num(s.btc4h,0)+"</b><br>ETH: <b>"+num(s.eth1h,0)+"</b> / <b>"+num(s.eth4h,0)+"</b><br>Piyasa ort.: <b>"+num(s.avg1h,0)+"</b> / <b>"+num(s.avg4h,0)+"</b></div><p class=\"text-sm mut\">"+esc(s.text||"")+"</p></div>";
  var l=r.ls||{};
  h+="<div class=\"card p-4\"><div class=\"mut text-sm\">Long / Short Oranı</div><div class=\"my-2\"><b class=\"up\">LONG %"+num(l.long,1)+"</b> · <b class=\"dn\">SHORT %"+num(l.short,1)+"</b></div><div class=\"h-2 rounded overflow-hidden flex\"><div style=\"width:"+num(l.long,0)+"%;background:#10b981\"></div><div style=\"flex:1;background:#ef4444\"></div></div><p class=\"text-sm mut mt-2\">"+esc(l.text||"")+"</p><p class=\"text-xs mut\">Kaynak: "+esc(l.source||"-")+"</p></div></div>";
  var m=(S.radar&&S.radar.market)||{};
  h+="<div class=\"card p-4 mt-3\"><b>Piyasa Yönü: </b>"+mktBadge(m.dir)+"<p class=\"text-sm mut mt-2\">BTC+ETH trend puanı %"+num((m.trf||0)*100,0)+" ile taranan coinlerin yeşil oranı (1s: %"+num((m.b1h||0)*100,0)+", 4s: %"+num((m.b4h||0)*100,0)+") yarı yarıya birleştirilir. %58 üstü LONG, %42 altı SHORT, arası NÖTR sayılır.</p></div>";
  return h;}
function pStrat(){
  var d=S.strat;if(!d)return "Yükleniyor...";
  return "<div class=\"grid gap-3 md:grid-cols-2\">"+(d.strategies||[]).map(function(x){return "<div class=\"card p-4\"><div class=\"font-bold\">"+esc(x.name)+" <span class=\"text-xs mut\">· "+esc(x.tf)+"</span></div><p class=\"text-sm mt-2\">"+esc(x.desc)+"</p><p class=\"text-xs mut mt-2\">"+esc(x.params)+"</p></div>";}).join("")+"</div><div class=\"card p-3 mt-3 text-sm\">Global max açık sinyal: <b>"+g(d,"limits.globalMax","-")+"</b>. Aynı coinde zıt yönlü sinyal bloklanır, aynı yönlü farklı modüller konfluans puanı kazandırır.</div>";}
function pStats(){
  var d=S.stats;if(!d)return "Yükleniyor...";
  return "<div class=\"card overflow-x-auto\"><table class=\"w-full text-sm\"><tr><th>Modül</th><th>Toplam</th><th>Açık</th><th>Kazanç</th><th>Kayıp</th><th>Başarı %</th><th>Brüt R</th><th>Net R</th></tr>"+(d.modules||[]).map(function(r){return "<tr "+(r.module==="TOPLAM"?"class=\"font-bold\"":"")+"><td>"+esc(r.label)+"</td><td>"+r.total+"</td><td>"+r.open+"</td><td class=\"up\">"+r.wins+"</td><td class=\"dn\">"+r.losses+"</td><td>"+num(r.winRate,1)+"</td><td class=\""+cls(r.grossR)+"\">"+sgn(r.grossR,2)+"</td><td class=\""+cls(r.netR)+"\">"+sgn(r.netR,2)+"</td></tr>";}).join("")+"</table></div><p class=\"text-xs mut mt-2\">Net R = brüt R − (komisyon + slippage / risk), maliyet gidiş-dönüş %"+esc(d.costPct)+".</p>";}
function pBt(){
  return "<div class=\"card p-4\"><div class=\"grid grid-cols-2 md:grid-cols-4 gap-3 items-end\">"+
  "<label class=\"text-xs mut\">Modül<select id=\"b_mod\" class=\"inp\">"+Object.keys(MODN).map(function(k){return "<option value=\""+k+"\">"+esc(MODN[k])+"</option>";}).join("")+"</select></label>"+
  "<label class=\"text-xs mut\">Zaman dilimi<select id=\"b_tf\" class=\"inp\"><option value=\"\">Modül varsayılanı</option><option>1m</option><option>5m</option><option>15m</option><option>1h</option><option>4h</option></select></label>"+
  "<label class=\"text-xs mut\">Coin sayısı (1-40)<input id=\"b_coins\" class=\"inp\" type=\"number\" value=\"10\"></label>"+
  "<button data-action=\"runBt\" class=\"bg-blue-600 hover:bg-blue-500 rounded-lg py-2 font-bold\">Backtest Çalıştır</button></div>"+
  "<p class=\"text-xs mut mt-2\">Veri %60 eğitim / %40 doğrulama olarak bölünür. AlgoPump her zaman 1m ile çalışır.</p></div><div id=\"btres\" class=\"mt-3\"></div>";}
function btResult(){
  var j=S.job;if(!j)return "";
  if(j.status==="çalışıyor")return "<div class=\"card p-4\">Çalışıyor... %"+num((j.progress||0)*100,0)+"</div>";
  if(j.status==="hata")return "<div class=\"card p-4 dn\">Hata: "+esc(j.error)+"</div>";
  var r=j.result;if(!r)return "";
  function box(t,x){return "<div class=\"card p-3\"><div class=\"font-bold mb-1\">"+t+"</div><div class=\"text-sm\">İşlem: "+x.n+"<br>Win rate: %"+num(x.winRate,1)+"<br>PF: "+num(x.pf,2)+"<br>Max DD: "+num(x.maxDD,2)+"R<br>Toplam R: <span class=\""+cls(x.sumR)+"\">"+sgn(x.sumR,2)+"</span><br>Ort. R: "+sgn(x.avgR,3)+"</div></div>";}
  return "<div class=\"mb-2 text-sm mut\">"+esc(r.label)+" · "+esc(r.tf)+" · "+r.coins+" coin · "+r.trades+" işlem</div><div class=\"grid gap-3 md:grid-cols-3\">"+box("Tümü",r.all||{})+box("Eğitim (%60)",r.train||{})+box("Doğrulama (%40)",r.valid||{})+"</div><div class=\"card p-3 mt-3\"><div class=\"text-sm mb-1\">Net R eğrisi <span class=\"mut\">(sarı çizgi: eğitim/doğrulama ayrımı)</span></div><canvas id=\"bt_cv\" height=\"220\"></canvas></div><p class=\"text-xs mut mt-2\">"+esc(r.note)+"</p>";}

/* ---------- çizim ---------- */
function drawBt(){try{
  var cv=document.getElementById("bt_cv"),r=g(S.job,"result",null);if(!cv||!r||!r.curve||!r.curve.length)return;
  var dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=220;cv.width=W*dpr;cv.height=H*dpr;var x=cv.getContext("2d");x.scale(dpr,dpr);
  var c=r.curve,mn=Math.min(0,Math.min.apply(null,c)),mx=Math.max(0,Math.max.apply(null,c)),rg=(mx-mn)||1;
  function X(i){return 10+i/Math.max(1,c.length-1)*(W-20);}function Y(v){return H-15-(v-mn)/rg*(H-30);}
  x.strokeStyle="#334155";x.beginPath();x.moveTo(10,Y(0));x.lineTo(W-10,Y(0));x.stroke();
  x.strokeStyle="#60a5fa";x.lineWidth=2;x.beginPath();c.forEach(function(v,i){i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v));});x.stroke();
  if(r.splitIdx){x.strokeStyle="#fbbf24";x.setLineDash([4,4]);x.beginPath();x.moveTo(X(r.splitIdx),5);x.lineTo(X(r.splitIdx),H-5);x.stroke();x.setLineDash([]);}
  x.fillStyle="#8b9bb8";x.font="11px sans-serif";x.fillText(num(mx,1)+"R",12,12);x.fillText(num(mn,1)+"R",12,H-3);
}catch(e){console.error(e);}}
function drawChart(cv,d){try{
  var c=d.candles||[],s=d.signal||{};if(!c.length){return;}
  var dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=340,R=62;cv.width=W*dpr;cv.height=H*dpr;var x=cv.getContext("2d");x.scale(dpr,dpr);
  var inf=s.info||{},lv=[s.entry,s.tp1,s.tp2,s.sl,inf.zoneLo,inf.zoneHi,inf.rangeHi,inf.rangeLo].filter(function(v){return Number(v)>0;});
  var hi=Math.max.apply(null,c.map(function(k){return k[2];}).concat(lv)),lo=Math.min.apply(null,c.map(function(k){return k[3];}).concat(lv));
  if(inf.lines){(g(inf,"lines.upper",[]).concat(g(inf,"lines.lower",[]))).forEach(function(q){lv.push(q.p);});hi=Math.max(hi,Math.max.apply(null,lv));lo=Math.min(lo,Math.min.apply(null,lv));}
  var pd=(hi-lo)*0.05||1;hi+=pd;lo-=pd;
  function Y(v){return 8+(hi-v)/(hi-lo)*(H-16);}var cw=(W-R)/(c.length+(inf.lines?12:0));function X(i){return i*cw+cw/2;}
  if(inf.zoneLo&&inf.zoneHi){x.fillStyle="rgba(96,165,250,.15)";x.fillRect(0,Y(inf.zoneHi),W-R,Y(inf.zoneLo)-Y(inf.zoneHi));}
  c.forEach(function(k,i){var up=k[4]>=k[1];x.strokeStyle=x.fillStyle=up?"#34d399":"#f87171";x.beginPath();x.moveTo(X(i),Y(k[2]));x.lineTo(X(i),Y(k[3]));x.stroke();var t=Y(Math.max(k[1],k[4])),b=Y(Math.min(k[1],k[4]));x.fillRect(X(i)-cw*0.35,t,cw*0.7,Math.max(1,b-t));});
  function line(arr,col){x.strokeStyle=col;x.lineWidth=1.3;x.beginPath();var st=false;arr.forEach(function(v,i){if(!(v>0))return;st?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v));st=true;});x.stroke();x.lineWidth=1;}
  line(d.ema20||[],"#fbbf24");line(d.ema50||[],"#a78bfa");
  var step=c.length>1?c[1][0]-c[0][0]:1;
  function seg(p,col){if(!p||p.length<2)return;x.strokeStyle=col;x.setLineDash([6,3]);x.beginPath();p.forEach(function(q,i){var ix=(q.t-c[0][0])/step;i?x.lineTo(X(ix),Y(q.p)):x.moveTo(X(ix),Y(q.p));});x.stroke();x.setLineDash([]);}
  seg(g(inf,"lines.upper",null),"#f472b6");seg(g(inf,"lines.lower",null),"#38bdf8");
  function hl(v,col,lb){if(!(Number(v)>0))return;x.strokeStyle=col;x.setLineDash([5,4]);x.beginPath();x.moveTo(0,Y(v));x.lineTo(W-R,Y(v));x.stroke();x.setLineDash([]);x.fillStyle=col;x.font="11px sans-serif";x.fillText(lb+" "+px(v),W-R+3,Y(v)+4);}
  hl(inf.rangeHi,"#94a3b8","R-Üst");hl(inf.rangeLo,"#94a3b8","R-Alt");
  hl(s.entry,"#e5e7eb","Giriş");hl(s.tp1,"#34d399","TP1");hl(s.tp2,"#10b981","TP2");hl(s.sl,"#f87171","SL");
}catch(e){console.error(e);}}

/* ---------- render ---------- */
function renderTabs(){var el=document.getElementById("tabs");if(!el)return;el.innerHTML=TABS.map(function(t){return "<div class=\"tab "+(S.tab===t[0]?"on":"")+"\" data-action=\"tab\" data-id=\""+t[0]+"\"><i class=\"fa-solid "+t[2]+" w-4\"></i><span>"+esc(t[1])+"</span></div>";}).join("");}
function renderTop(){try{
  var st=S.state;if(!st)return;var m=st.market||{};
  function c(n,o){return o?"<div class=\"card px-3 py-1 text-sm\"><b>"+n+"</b> "+px(o.price)+" <span class=\""+cls(o.change)+"\">"+sgn(o.change,2)+"%</span></div>":"";}
  document.getElementById("top").innerHTML="<div class=\"flex items-center gap-2\"><span class=\"mut text-sm\">Piyasa Yönü</span>"+mktBadge(m.dir)+"</div>"+c("BTC",m.btc)+c("ETH",m.eth)+"<div class=\"ml-auto text-xs mut\">"+(st.ready?"Canlı":"Başlatılıyor...")+" · API hata: "+g(st,"scan.apiErr",0)+"</div>";
}catch(e){console.error(e);}}
function render(){
  renderTop();
  var ae=document.activeElement,typing=ae&&(ae.tagName==="INPUT"||ae.tagName==="SELECT");
  var main=document.getElementById("main"),t=S.tab;
  if(t==="bt"){
    if(!document.getElementById("btres")){main.innerHTML=safe(pBt,"Backtest");}
    var br=document.getElementById("btres");if(br){br.innerHTML=safe(btResult,"Sonuç");drawBt();}
    return;}
  if(typing)return;
  var h;
  if(t==="home")h=safe(pHome,"Ana Sayfa");else if(t==="radar")h=safe(pRadar,"Radar");else if(t==="strat")h=safe(pStrat,"Stratejiler");else if(t==="stats")h=safe(pStats,"İstatistik");else h=safe(function(){return pModule(t);},"Sekme");
  main.innerHTML=h;}
async function refresh(){
  try{
    var st=await api("/api/state");if(st&&st.version)S.state=st;
    var t=S.tab,jobs=[];
    if(MODN[t]){jobs.push(api("/api/signals?module="+t).then(function(d){if(d)S.sig[t]=d;}));
      if(t==="PUMP")jobs.push(api("/api/paper").then(function(d){if(d)S.paper=d;}));
      var wk={LT:"lt",ZONE:"zone",RANGE:"range"}[t];if(wk)jobs.push(api("/api/watch/"+wk).then(function(d){if(d)S.watch[wk]=d;}));}
    else if(t==="home"){jobs.push(api("/api/signals?closed=0").then(function(d){if(d){var by={};(d.active||[]).forEach(function(s){(by[s.module]=by[s.module]||{active:[]}).active.push(s);});S.sig={};Object.keys(by).forEach(function(k){S.sig[k]=by[k];});}}));}
    else if(t==="radar")jobs.push(api("/api/radar").then(function(d){if(d)S.radar=d;}));
    else if(t==="stats")jobs.push(api("/api/stats").then(function(d){if(d)S.stats=d;}));
    else if(t==="strat"&&!S.strat)jobs.push(api("/api/strategies").then(function(d){if(d)S.strat=d;}));
    await Promise.all(jobs);
  }catch(e){console.error(e);}
  try{render();}catch(e){console.error(e);}
}
async function openDetail(id){
  var el=document.getElementById("detail");el.className="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto p-3";el.style.background="rgba(0,0,0,.75)";
  el.innerHTML="<div class=\"card p-4 w-full max-w-4xl mt-6\">Yükleniyor...</div>";el.setAttribute("data-action","closeDetail");el.setAttribute("data-bd","1");
  var d=await api("/api/chart/"+encodeURIComponent(id));
  if(!d||!d.signal){el.innerHTML="<div class=\"card p-4 w-full max-w-md mt-6\">Detay yüklenemedi <button data-action=\"closeDetail\" class=\"ml-3 underline\">Kapat</button></div>";return;}
  S.detail=d;var s=d.signal,inf=s.info||{};
  var rows=[["Coin",esc(s.base)+" · "+esc(s.sector)],["Modül",esc(s.modLabel)],["Yön",dirBadge(s.dir)],["Giriş",px(s.entry)],["TP1",px(s.tp1)],["TP2",s.tp2?px(s.tp2):"yok (vur-kaç)"],["SL",px(s.sl)],["Güven",num(s.conf,0)],["Durum",s.status==="AKTIF"?"AKTİF":esc(RES[s.result]||s.result)],["Net R",s.netR!=null?sgn(s.netR,2):"-"],["Açılış",new Date(s.createdAt).toLocaleString("tr-TR")]];
  Object.keys(inf).forEach(function(k){var v=inf[k];if(v!==null&&typeof v!=="object")rows.push([esc(k),esc(typeof v==="number"?num(v,4).replace(/\.?0+$/,""):v)]);});
  el.innerHTML="<div class=\"card p-4 w-full max-w-4xl mt-6\"><div class=\"flex justify-between items-center mb-3\"><div class=\"text-lg font-bold\">"+esc(s.base)+" "+dirBadge(s.dir)+" <span class=\"text-xs mut\">"+esc(d.tf)+" grafik</span></div><div class=\"flex gap-2\"><a class=\"bg-slate-700 hover:bg-slate-600 rounded px-3 py-1 text-sm\" target=\"_blank\" rel=\"noopener\" href=\""+esc(d.tradingview)+"\"><i class=\"fa-solid fa-up-right-from-square\"></i> TradingView</a><button data-action=\"closeDetail\" class=\"bg-slate-700 rounded px-3 py-1 text-sm\">Kapat</button></div></div>"+
  "<canvas id=\"dcv\" height=\"340\"></canvas><div class=\"text-xs mut mt-1\"><span style=\"color:#fbbf24\">EMA20</span> · <span style=\"color:#a78bfa\">EMA50</span></div>"+
  "<div class=\"grid grid-cols-2 md:grid-cols-3 gap-x-4 gap-y-1 text-sm mt-3\">"+rows.map(function(r){return "<div><span class=\"mut\">"+r[0]+":</span> "+r[1]+"</div>";}).join("")+"</div>"+
  (s.status==="AKTIF"?"<button data-action=\"closeSig\" data-id=\""+esc(s.id)+"\" class=\"mt-3 bg-red-800 hover:bg-red-700 rounded px-4 py-2 font-bold\">Sinyali Manuel Kapat</button>":"")+"</div>";
  drawChart(document.getElementById("dcv"),d);
}
function closeDetail(){var el=document.getElementById("detail");el.className="hidden";el.innerHTML="";el.removeAttribute("data-action");S.detail=null;}

/* ---------- olaylar (event delegation) ---------- */
document.addEventListener("click",async function(e){
  var t=e.target.closest("[data-action]");if(!t)return;
  if(t.getAttribute("data-bd")&&e.target!==t)return;
  var a=t.getAttribute("data-action"),id=t.getAttribute("data-id");
  try{
    if(a==="tab"){S.tab=id;closeDetail();document.getElementById("main").innerHTML="Yükleniyor...";renderTabs();await refresh();}
    else if(a==="open")await openDetail(id);
    else if(a==="closeDetail")closeDetail();
    else if(a==="closeSig"){if(confirm("Sinyal manuel kapatılsın mı?")){await post("/api/signal/"+encodeURIComponent(id)+"/close");closeDetail();await refresh();}}
    else if(a==="closePaper"){if(confirm("Paper işlem manuel kapatılsın mı?")){await post("/api/paper/"+encodeURIComponent(id)+"/close");await refresh();}}
    else if(a==="toggleAuto"){await post("/api/paper/toggle");await refresh();}
    else if(a==="resetPaper"){if(confirm("Paper hesabı 1000 USDT\u0027ye sıfırlansın mı? Tüm paper geçmişi silinir.")){await post("/api/paper/reset");await refresh();}}
    else if(a==="saveSet"){
      var v=function(i){var el=document.getElementById(i);return el?Number(el.value):undefined;};
      var r=await post("/api/paper/settings",{margin:v("s_margin"),leverage:v("s_lev"),minConf:v("s_conf"),maxMinutes:v("s_min")});
      if(r&&r.ok){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();await refresh();}else alert("Ayarlar kaydedilemedi");}
    else if(a==="runBt"){
      var b={module:document.getElementById("b_mod").value,tf:document.getElementById("b_tf").value,coins:Number(document.getElementById("b_coins").value)||10};
      var rs=await post("/api/backtest",b);
      if(!rs||!rs.id){alert((rs&&rs.error)||"Backtest başlatılamadı");return;}
      S.jobId=rs.id;S.job={status:"çalışıyor",progress:0};render();pollJob();}
  }catch(err){console.error(err);}
});
function pollJob(){
  if(!S.jobId)return;
  api("/api/backtest/"+S.jobId).then(function(j){
    if(j){S.job=j;if(S.tab==="bt")render();}
    if(j&&j.status==="çalışıyor")setTimeout(pollJob,2000);
  });}
window.addEventListener("resize",function(){try{if(S.detail)drawChart(document.getElementById("dcv"),S.detail);drawBt();}catch(e){}});
renderTabs();refresh();setInterval(refresh,5000);
</script>
