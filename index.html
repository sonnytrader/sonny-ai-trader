<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AlphaSon v76.0</title>
<meta name="theme-color" content="#0b0e11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fcd535'/%3E%3Cpath d='M18 5 9 18h6l-1 9 9-13h-6z' fill='%230b0e11'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#0b0e11; --bg-soft:#12161c; --panel:#181a20; --panel-2:#1e2329; --panel-3:#252b33;
  --line:#2b3139; --line-soft:#1f242b;
  --txt:#eaecef; --mut:#848e9c; --mut-2:#5e6673;
  --green:#0ecb81; --green-dim:rgba(14,203,129,.12);
  --red:#f6465d; --red-dim:rgba(246,70,93,.12);
  --gold:#fcd535; --gold-2:#f0b90b; --gold-dim:rgba(252,213,53,.12);
  --blue:#1e88e5;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2b3139;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#3a424d}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--green)}.dn{color:var(--red)}.mut{color:var(--mut)}.gold{color:var(--gold)}
.hide{display:none!important}

/* ── layout ── */
#app{display:flex;min-height:100vh}
#side{width:236px;flex:0 0 236px;background:var(--bg-soft);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 10px;overflow-y:auto;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold-2));display:grid;place-items:center;color:#0b0e11;font-size:16px;box-shadow:0 4px 16px rgba(240,185,11,.28);flex:0 0 auto}
.brand b{font-size:15.5px;letter-spacing:.2px;line-height:1.1}
.brand .ver{display:block;font-size:10px;color:var(--mut);font-weight:600;letter-spacing:.08em;margin-top:2px}
.nav-group{margin-top:12px}
.nav-group>h6{margin:0 0 6px;padding:0 12px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut-2);font-weight:700}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#b7bdc6;font-size:13.5px;position:relative;transition:background .15s,color .15s;width:100%;text-align:left}
.nav i{width:16px;text-align:center;font-size:13px;color:var(--mut);transition:color .15s}
.nav:hover{background:var(--panel);color:var(--txt)}
.nav:hover i{color:#c9ced6}
.nav.on{background:var(--panel);color:var(--gold);font-weight:600}
.nav.on i{color:var(--gold)}
.nav.on::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav .cnt{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:0 6px;color:var(--mut);min-width:20px;text-align:center}
.nav.on .cnt{background:var(--gold-dim);color:var(--gold);border-color:rgba(252,213,53,.25)}
.side-foot{margin-top:auto;padding:14px 12px 4px;font-size:11px;color:var(--mut-2);line-height:1.6;border-top:1px solid var(--line-soft)}
.side-foot b{color:var(--mut)}

#wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:40;height:58px;display:flex;align-items:center;gap:10px;padding:0 18px;background:rgba(11,14,17,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#main{width:100%;max-width:1560px;margin:0 auto;padding:20px;flex:1}
#foot{padding:14px 20px 22px;font-size:11px;color:var(--mut-2);text-align:center}

/* ── topbar ── */
.mkt{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.mkt.long{color:var(--green);border-color:rgba(14,203,129,.3);background:var(--green-dim)}
.mkt.short{color:var(--red);border-color:rgba(246,70,93,.3);background:var(--red-dim)}
.mkt.neutral{color:var(--mut)}
.tick{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.tick b{font-weight:700;color:#c9ced6;font-size:11px;letter-spacing:.04em}
.tick .p{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto;white-space:nowrap}
#top>*{flex:0 0 auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut-2);display:inline-block}
.dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(14,203,129,.15);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(14,203,129,.15)}50%{box-shadow:0 0 0 6px rgba(14,203,129,0)}}
.sep{width:1px;height:20px;background:var(--line)}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--mut);border:1px solid transparent;transition:.15s}
.icon-btn:hover{background:var(--panel-2);color:var(--txt);border-color:var(--line)}
#menu{display:none}

/* ── primitives ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.sigs{grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
.kpi{padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;margin-top:7px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:3px}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--line)}
.kpi.g::after{background:var(--green)}.kpi.r::after{background:var(--red)}.kpi.y::after{background:var(--gold)}
.sec{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.sec h3{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.sec h3 i{color:var(--mut);font-size:12px;margin-right:6px}
.sec .line{flex:1;height:1px;background:var(--line)}
.sec .more{font-size:11.5px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;border:1px solid transparent;white-space:nowrap;line-height:1.6}
.chip.long{background:var(--green-dim);color:var(--green);border-color:rgba(14,203,129,.25)}
.chip.short{background:var(--red-dim);color:var(--red);border-color:rgba(246,70,93,.25)}
.chip.neutral{background:rgba(132,142,156,.12);color:var(--mut);border-color:rgba(132,142,156,.22)}
.chip.gold{background:var(--gold-dim);color:var(--gold);border-color:rgba(252,213,53,.25)}
.chip.live{background:var(--red);color:#fff;border-color:var(--red);animation:pulse2 2s infinite}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.62}}
.bar{height:4px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--panel-3);border-color:#3a424d}
.btn.gold{background:var(--gold);color:#0b0e11;border-color:var(--gold)}
.btn.gold:hover{background:#ffe066;border-color:#ffe066}
.btn.green{background:var(--green);color:#04231a;border-color:var(--green)}
.btn.green:hover{background:#22d992}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.red:hover{background:#ff5b70}
.btn.ghost{background:transparent}
.btn.lg{padding:17px 16px;font-size:14.5px;width:100%;letter-spacing:.01em}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 10px;font-size:13px;outline:none;transition:.15s;font-variant-numeric:tabular-nums}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(252,213,53,.08)}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.03em}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl tbody tr.click{cursor:pointer}
.scroll{overflow-x:auto;border-radius:12px}
.empty{padding:22px;text-align:center;color:var(--mut);font-size:13px}
.empty i{display:block;font-size:22px;margin-bottom:8px;color:var(--mut-2)}

/* ── signal card ── */
.sig{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:11px}
.sig:hover{border-color:#3a424d;transform:translateY(-2px);box-shadow:var(--shadow)}
.sig::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--line)}
.sig.long::before{background:var(--green)}
.sig.short::before{background:var(--red)}
.sig-h{display:flex;align-items:center;gap:8px}
.sig-h .sym{font-size:15px;font-weight:700;letter-spacing:-.01em}
.sig-h .sym span{font-size:10.5px;color:var(--mut);font-weight:600;margin-left:2px}
.sig-h .age{margin-left:auto;font-size:11px;color:var(--mut-2);font-variant-numeric:tabular-nums}
.sig-mod{font-size:11px;color:var(--mut);margin-top:-6px;display:flex;align-items:center;gap:6px}
.sig-px{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:var(--bg);border:1px solid var(--line-soft);border-radius:8px;padding:9px 10px}
.sig-px div{display:flex;flex-direction:column;gap:2px}
.sig-px span{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut-2);font-weight:700}
.sig-px b{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.sig-f{display:flex;align-items:center;gap:10px}
.sig-f .conf{flex:1;display:flex;align-items:center;gap:8px}
.sig-f .conf .bar{flex:1}
.sig-f .conf em{font-size:10.5px;color:var(--mut);font-style:normal;font-variant-numeric:tabular-nums}
.sig-f .pnl{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.sig-tags{display:flex;flex-wrap:wrap;gap:5px}
.sig-tags:empty{display:none}

/* ── paper ── */
.ctrl{display:grid;grid-template-columns:2fr 1.1fr;gap:12px}
.pos{padding:14px;display:flex;flex-direction:column;gap:10px}
.pos-h{display:flex;align-items:center;gap:8px}
.pos-h .sym{font-weight:700;font-size:14px}
.pos-h .lev{margin-left:auto;font-size:11px;color:var(--mut)}
.pos-px{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:12px}
.pos-px span{color:var(--mut)}
.pos-px b{float:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-weight:600}
.pos .pnl{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos .pnl small{font-size:12px;font-weight:600;opacity:.85;margin-left:5px}

/* ── radar ── */
.gauge{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;position:relative;margin:8px 0}
.gauge::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel)}
.gauge .gv{position:relative;text-align:center}
.gauge .gv b{font-size:28px;font-weight:700;display:block;line-height:1;font-variant-numeric:tabular-nums}
.gauge .gv span{font-size:10px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.lsbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--red-dim);margin:10px 0 6px}
.lsbar .l{background:var(--green)}
.lsbar .s{background:var(--red)}

/* ── chart ── */
.chartwrap{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.chartwrap canvas{display:block;width:100%}
#bt_cv{display:block;width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:5px;border-radius:2px}

/* ── modal ── */
#modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.78);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto}
#modal.hide{display:none}
.modal-box{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal-b{padding:16px 18px 20px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 18px;margin-top:14px;font-size:12.5px}
.info-grid .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line-soft)}
.info-grid .row span{color:var(--mut)}
.info-grid .row b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.tag{padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-left:5px;border:1px solid transparent}
.tag.ok{color:var(--green);background:var(--green-dim);border-color:rgba(14,203,129,.25)}
.tag.warn{color:var(--gold);background:var(--gold-dim);border-color:rgba(252,213,53,.25)}
.tag.bad{color:var(--red);background:var(--red-dim);border-color:rgba(246,70,93,.25)}

/* ── toast ── */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);z-index:120;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:11px 18px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.22s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:rgba(14,203,129,.4)}
#toast.err{border-color:rgba(246,70,93,.4)}

@media(max-width:1240px){.hide-md{display:none!important}}
@media(max-width:1080px){.ctrl{grid-template-columns:1fr}}
@media(max-width:980px){
  #side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .24s ease;box-shadow:var(--shadow)}
  #side.open{transform:none}
  #menu{display:grid}
  #main{padding:14px}
  #top{padding:0 12px;gap:7px}
  .top-right .hide-sm{display:none}
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55}
}@media(max-width:560px){
  .tick + .tick{display:none}
  .sig-px{grid-template-columns:1fr 1fr}
  .sig-px div:last-child{grid-column:span 2}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-bolt"></i></div>
      <div><b>AlphaSon</b><span class="ver">v76.0 · AI HEDGE FUND</span></div>
    </div>
    <div id="nav"></div>
    <div class="side-foot">
      <b>Motor:</b> 15 sn sentetik mum<br>
      <b>Maliyet:</b> %0.20 tur<br>
      <b>Aktif:</b> LT · Pump · Daily · Trend<br>
      <b>Durum:</b> <span id="sf-state">—</span>
    </div>
  </aside>
  <div id="wrap">
    <header id="top"></header>
    <main id="main"><div class="empty">Yükleniyor…</div></main>
    <footer id="foot">AlphaSon v76.0 · Veriler Bitget’ten · AI yorumu yatırım tavsiyesi değildir</footer>
  </div>
</div>
<div id="modal" class="hide"></div>
<div id="toast"></div>

<script>
"use strict";
/* ══════════════ SABİTLER ══════════════ */
var MODN={PUMP:"AlgoPump",TREND:"Trend (PSAR)",LT:"LT Üçgen",ZONE:"Zone Master",SCALPER:"Scalper",RANGE:"Range (Mean Rev.)",DAILY:"Günlük Sweep"};
var NAV=[
  {g:"Genel",items:[["home","Ana Sayfa","fa-house"],["radar","Piyasa Radarı","fa-satellite-dish"],["stats","İstatistik","fa-chart-simple"]]},
  {g:"Aktif Stratejiler",items:[["PUMP","AlgoPump","fa-bolt"],["LT","LT Üçgen","fa-play"],["DAILY","Günlük Sweep","fa-water"],["TREND","Trend (PSAR)","fa-chart-line"]]},
  {g:"AI",items:[["ai","AI Analiz","fa-wand-magic-sparkles"],["discovery","AI Keşif","fa-satellite"]]},
  {g:"Araçlar",items:[["strat","Strateji Rehberi","fa-book"],["bt","Backtest","fa-flask"]]},
  {g:"Pasif · tarama kapalı",items:[["ZONE","Zone Master","fa-layer-group"],["SCALPER","Scalper","fa-gauge-high"],["RANGE","Range","fa-arrows-left-right"]]}
];
var RES={TP1:"HEDEF 1",TP2:"HEDEF 2",SL:"STOP",BE:"BAŞA BAŞ",SURE:"SÜRE DOLDU",MANUEL:"MANUEL",TPMAX:"MAKS KÂR",FADE:"KÂR GERİ VERİLDİ",MOMENTUM:"İVME BİTTİ",BAIL:"GERİ DÖNÜŞ",NOMOVE:"HAREKET YOK",DOLMADI:"DOLMADI",QUICK:"VUR-KAÇ KÂRI",QUICK_TIME:"VUR-KAÇ SÜRESİ"};
var KEYN={atrPct:"ATR %",volRatio:"Hacim Oranı",z:"Z-Skor",spreadPct:"Spread %",adx:"ADX",rsi:"RSI",williamsR:"Williams %R",riskPct:"Risk %",movePct:"Hareket %",fillSlipPct:"Kayma %",atrX:"ATR Katı",bodyFrac:"Gövde Oranı",priorRunPct:"Önceki Koşu %",edgePct:"Kenar %",costPct:"Maliyet %",tpPct:"Hedef %",slPct:"Stop %",rr:"R:R",coilPct:"Sıkışma %",coilBars:"Coil Bar",velRatio:"Hız Oranı",peakPct:"Zirve %",holdSec:"Süre (sn)",origin:"Kırılan Kenar",zoneLo:"Bölge Alt",zoneHi:"Bölge Üst",rangeHi:"Aralık Üst",rangeLo:"Aralık Alt",tf:"Zaman Dilimi",maturity:"Olgunluk",compression:"Sıkışma",quickTpPct:"Vur-kaç TP %",quickTimeSec:"Vur-kaç Süre (sn)",quickNetRR:"Vur-kaç Net R:R",retest:"LT Retest",line:"Kırılım Çizgisi",distPct:"Çizgiye Mesafe %",height:"Üçgen Yüksekliği",mid:"Üçgen Orta",breakoutAgeMin:"Kırılımdan (dk)",netRR:"Net R:R",oi1:"OI 1dk %",oi5:"OI 5dk %",d1Confirm:"1D Teyit",latePct:"Geç Kalma %",disp:"Kırılım %",vBurst:"Hacim Patlaması",preRng:"Coil Aralığı %",body:"Gövde",slStruct:"Yapısal Stop %",slFloor:"Stop Tabanı %",expectedLeg:"Beklenen Bacak %",atr:"ATR",pdh:"PDH",pdl:"PDL",dayMid:"Gün Ortası",sweepSide:"Süpürme",wickAtr:"Fitil ATR",wickRatio:"Fitil Oranı",bodyRatio:"Gövde Oranı",closePos:"Kapanış Konumu",dayRangePct:"Gün Aralığı %",session:"Seans",sweptBefore:"Önceki Süpürme",maxBars:"Maks Bar",line0:"Çizgi Başlangıç",lineSlope:"Çizgi Eğimi",extPct:"Uzaklaşma %",entryPct:"Giriş %",tp1R:"TP1 R",tp2R:"TP2 R",stopAtr:"Stop ATR",minWickAtr:"Min Fitil ATR",minVolX:"Min Hacim",minBodyRatio:"Min Gövde",maxSpreadPct:"Maks Spread %"};

/* ══════════════ YARDIMCILAR ══════════════ */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function g(o,p,d){try{var v=o,a=p.split(".");for(var i=0;i<a.length;i++){if(v==null)return d;v=v[a[i]];}return v==null?d:v;}catch(e){return d;}}
function num(x,n){x=Number(x);return isFinite(x)?x.toFixed(n==null?2:n):"-";}
function px(x){x=Number(x);if(!isFinite(x)||x===0)return "-";return x>=100?x.toFixed(2):x>=1?x.toFixed(4):x.toPrecision(4);}
function dur(ms){ms=Math.max(0,Number(ms)||0);var m=Math.floor(ms/60000);if(m<1)return Math.floor(ms/1000)+" sn";return m<60?m+" dk":Math.floor(m/60)+" sa "+(m%60)+" dk";}
function cls(x){return Number(x)>=0?"up":"dn";}
function sgn(x,n){x=Number(x);return isFinite(x)?(x>=0?"+":"")+x.toFixed(n==null?2:n):"-";}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function api(p,o){return fetch(p,o).then(function(r){return r.json();}).catch(function(){return null;});}
function post(p,b){return api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});}
function safe(fn,name){try{return fn();}catch(e){console.error(name,e);return "<div class=\"card empty\"><i class=\"fa-solid fa-triangle-exclamation\"></i>"+esc(name||"Bölüm")+" yüklenemedi</div>";}}
function toast(msg,type){var t=document.getElementById("toast");t.textContent=msg;t.className="on "+(type||"");clearTimeout(t._tm);t._tm=setTimeout(function(){t.className="";},2600);}
function dirChip(d){if(d==="LONG")return "<span class=\"chip long\"><i class=\"fa-solid fa-arrow-up\"></i>LONG</span>";if(d==="SHORT")return "<span class=\"chip short\"><i class=\"fa-solid fa-arrow-down\"></i>SHORT</span>";return "<span class=\"chip neutral\">NÖTR</span>";}
function mktChip(d){if(d==="LONG")return "<span class=\"mkt long\"><i class=\"fa-solid fa-arrow-trend-up\"></i>YÜKSELİŞ</span>";if(d==="SHORT")return "<span class=\"mkt short\"><i class=\"fa-solid fa-arrow-trend-down\"></i>DÜŞÜŞ</span>";return "<span class=\"mkt neutral\"><i class=\"fa-solid fa-minus\"></i>NÖTR</span>";}
function resChip(r){var l=RES[r]||r||"-";var k=(r==="TP1"||r==="TP2"||r==="TPMAX"||r==="QUICK")?"long":(r==="SL"||r==="BAIL"||r==="NOMOVE")?"short":(r==="FADE"||r==="MOMENTUM"||r==="QUICK_TIME")?"gold":"neutral";return "<span class=\"chip "+k+"\">"+esc(l)+"</span>";}
function verdictChip(a){if(!a||!a.verdict)return "";var v=String(a.verdict).toUpperCase(),k=v==="ONY"||v==="GIR"?"long":v==="RED"||v==="IPTAL"?"short":"gold",l=v==="ONY"?"ONY":v==="RED"?"RED":v==="GIR"?"GİR":v==="IPTAL"?"İPTAL":"TEMKİNLİ";return "<span class=\"chip "+k+"\"><i class=\"fa-solid fa-brain\"></i> "+l+(a.score!=null?" "+num(a.score,0):"")+"</span>";}
function listHtml(a){if(!a||!a.length)return "<span class=\"mut\">—</span>";return a.map(function(x){return "<div style=\"display:flex;gap:7px;margin:4px 0;line-height:1.5\"><span style=\"color:var(--gold)\">•</span><span>"+esc(x)+"</span></div>";}).join("");}
function analysisCard(a,title,note){
  if(!a)return "<div class=\"card empty\" style=\"padding:12px\">"+esc(note||"Analiz yok")+"</div>";
  var conf=clamp(Number(a.score)||0,0,100);
  var col=conf>=70?"var(--green)":conf>=50?"var(--gold)":"var(--red)";
  var meta=[];
  if(a.providerName)meta.push(esc(a.providerName)+(a.model?" · "+esc(a.model):""));
  if(a.latencyMs)meta.push(num(a.latencyMs,0)+" ms");
  if(a.at)meta.push(new Date(a.at).toLocaleString("tr-TR"));
  return "<div class=\"card\" style=\"padding:14px 16px\">"+
    "<div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\"><b style=\"font-size:12.5px\">"+esc(title)+"</b>"+verdictChip(a)+
      (a.riskLevel?"<span class=\"chip neutral\">Risk: "+esc(a.riskLevel)+"</span>":"")+
      (a.source==="ai"?"<span class=\"chip gold\">AI</span>":"<span class=\"chip neutral\">KURAL</span>")+"</div>"+
    (meta.length?"<div style=\"font-size:10.5px;color:var(--mut-2);margin-top:5px\">"+meta.join(" · ")+"</div>":"")+
    "<div style=\"display:flex;align-items:center;gap:8px;margin-top:10px\"><div class=\"bar\" style=\"height:5px;flex:1\"><i style=\"width:"+conf+"%;background:"+col+"\"></i></div><b class=\"num\" style=\"font-size:11px\">"+conf+"/100</b></div>"+
    (a.summary?"<p style=\"font-size:12.5px;line-height:1.6;margin:10px 0 0;color:#c9ced6\">"+esc(a.summary)+"</p>":"")+
    (a.marketView?"<p style=\"font-size:11.5px;line-height:1.55;margin:7px 0 0;color:var(--mut)\"><b>Piyasa:</b> "+esc(a.marketView)+"</p>":"")+

    (a.risks&&a.risks.length?"<div style=\"margin-top:8px;font-size:11.5px\"><b style=\"color:var(--mut)\">Riskler</b>"+listHtml(a.risks)+"</div>":"")+

    (a.timeHorizon?"<p style=\"font-size:11px;color:var(--mut-2);margin:6px 0 0\">Vade: "+esc(a.timeHorizon)+"</p>":"")+
  "</div>";
}
function sec(t,right){return "<div class=\"sec\"><h3>"+t+"</h3><div class=\"line\"></div>"+(right?"<div class=\"more\">"+right+"</div>":"")+"</div>";}
function pageHead(title,sub,right){

/* ══════════════ GÖSTERGE ETİKETLERİ ══════════════ */
function indicatorTag(k,v){
  if(typeof v!=="number")return "";
  k=String(k).toLowerCase();var l="",c="";
  if(k==="adx"){if(v>=30){l="GÜÇLÜ TREND";c="ok";}else if(v>=20){l="NÖTR";c="warn";}else{l="ZAYIF TREND";c="bad";}}
  else if(k==="williamsr"){if(v<-80){l="AŞIRI SATIM";c="bad";}else if(v>-20){l="AŞIRI ALIM";c="bad";}else{l="NORMAL";c="ok";}}
  else if(k==="volratio"){if(v>=1.5){l="GÜÇLÜ HACİM";c="ok";}else if(v>=1){l="NÖTR";c="warn";}else{l="ZAYIF HACİM";c="bad";}}
  else if(k==="riskpct"){if(v<=0.5){l="DAR STOP";c="ok";}else if(v<=1.5){l="NÖTR";c="warn";}else{l="GENİŞ STOP";c="bad";}}
  else if(k==="atrx"||k==="movepct"||k==="atrpct"){if(v>=3){l="GÜÇLÜ İTME";c="ok";}else if(v>=1.5){l="NÖTR";c="warn";}else{l="ZAYIF İTME";c="bad";}}
  else if(k==="rsi"){if(v>70){l="AŞIRI ALIM";c="bad";}else if(v<30){l="AŞIRI SATIM";c="bad";}else{l="NORMAL";c="ok";}}
  else if(k==="spreadpct"){if(v<=0.1){l="DAR SPREAD";c="ok";}else if(v<=0.3){l="NÖTR";c="warn";}else{l="GENİŞ SPREAD";c="bad";}}
  else if(k==="fillslippct"){if(v<=0.05){l="AZ KAYMA";c="ok";}else if(v<=0.2){l="NÖTR";c="warn";}else{l="ÇOK KAYMA";c="bad";}}
  else if(k==="z"){if(v>=2){l="GÜÇLÜ";c="ok";}else if(v>=1){l="NÖTR";c="warn";}else{l="ZAYIF";c="bad";}}
  return l?"<span class=\"tag "+c+"\">"+l+"</span>":"";
}

function sigCard(s){
  var act=s.status==="AKTIF";
  var pct=act?g(s,"livePct",null):g(s,"pnlPct",null);
  var conf=clamp(Number(s.conf)||0,0,100);
  var tags="";
  if(s.marketAlign==="TERS")tags+="<span class=\"chip gold\">PİYASAYA TERS</span>";
  else if(s.marketAlign==="UYUMLU")tags+="<span class=\"chip long\">PİYASA UYUMLU</span>";
  if(g(s,"confl",[]).length)tags+="<span class=\"chip neutral\">TEYİT x"+(s.confl.length+1)+"</span>";
  if(s.info&&s.info.retest)tags+="<span class=\"chip long\">LT RETEST</span>";
  if(s.info&&s.info.quickTpPct!=null)tags+="<span class=\"chip gold\">VUR-KAÇ %"+num(s.info.quickTpPct,2)+"</span>";
  if(s.info&&s.info.sweepSide)tags+="<span class=\"chip "+(s.info.sweepSide==='PDL'?"long":"short")+"\">"+(s.info.sweepSide==='PDL'?"PDL SÜPÜRME":"PDH SÜPÜRME")+"</span>";
  if(s.analysis)tags+=verdictChip(s.analysis);
  if(s.ai&&!s.ai.error)tags+="<span class=\"chip gold\"><i class=\"fa-solid fa-wand-magic-sparkles\"></i> AI</span>";
  if(s.module==="TREND" && s.aiGate){
    var gateChip = s.aiGate==="ONY" ? "<span class='chip long'><i class='fa-solid fa-check'></i> AI ONAYLI</span>" :
                   s.aiGate==="AI_RED" ? "<span class='chip short'><i class='fa-solid fa-xmark'></i> AI RED</span>" :
                   s.aiGate==="BEKLIYOR" ? "<span class='chip gold'><i class='fa-solid fa-spinner fa-spin'></i> AI BEKLİYOR</span>" :
                   s.aiGate==="KAPALI" ? "<span class='chip neutral'>AI KAPALI</span>" : "";
    if(gateChip) tags += gateChip;
  }
  if(s.module==="PUMP" && s.info && s.info.aiEntry){
    tags += "<span class='chip gold'><i class='fa-solid fa-crosshairs'></i> AI SNIPER</span>";
  }
  if(act&&s.tp1Hit)tags+="<span class=\"chip long\">TP1 ✔</span>";
  if(!act)tags+=resChip(s.result);
  return "<article class=\"sig "+(s.dir==="LONG"?"long":"short")+"\" data-act=\"open\" data-id=\""+esc(s.id)+"\">"+
    "<div class=\"sig-h\"><div class=\"sym\">"+esc(s.base)+"<span>USDT</span></div>"+dirChip(s.dir)+
      "<span class=\"age\">"+(act?dur(Date.now()-s.createdAt):dur((s.closedAt||0)-s.createdAt))+"</span></div>"+
    "<div class=\"sig-mod\"><i class=\"fa-solid fa-microchip\"></i>"+esc(g(s,"modLabel",MODN[s.module]||s.module))+"</div>"+
    "<div class=\"sig-px\"><div><span>Giriş</span><b>"+px(s.entry)+"</b></div>"+
      "<div><span>Hedef</span><b class=\"up\">"+px(s.tp1)+"</b></div>"+
      "<div><span>Stop</span><b class=\"dn\">"+px(s.sl)+"</b></div></div>"+
    "<div class=\"sig-f\"><div class=\"conf\"><div class=\"bar\"><i style=\"width:"+conf+"%;background:"+(conf>=70?"var(--green)":conf>=50?"var(--gold)":"var(--red)")+"\"></i></div><em>"+num(conf,0)+"</em></div>"+
      "<span class=\"pnl "+(pct==null?"mut":cls(pct))+"\">"+(pct==null?"—":sgn(pct,2)+"%")+"</span></div>"+
    (tags?"<div class=\"sig-tags\">"+tags+"</div>":"")+"</article>";
}

/* ══════════════ GRAFİK ══════════════ */
function fmtTime(t,tf){
  var d=new Date(t);
  if(tf&&/(m|h)$/.test(tf)){var hh=String(d.getHours()).padStart(2,"0"),mm=String(d.getMinutes()).padStart(2,"0");return hh+":"+mm;}
  return d.getDate()+"/"+(d.getMonth()+1);
}
function drawChart(cv,d,hover){
  if(!cv||!d||!d.candles||!d.candles.length)return;
  var c=d.candles,s=d.signal||{},inf=s.info||{};
  var dpr=window.devicePixelRatio||1,W=cv.clientWidth||900,H=400;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+"px";
  var x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  x.fillStyle="#0b0e11";x.fillRect(0,0,W,H);
  var padR=68,padL=8,padT=24,padB=22,volH=46,gap=8;
  var cw=W-padL-padR,ch=H-padT-padB-volH-gap,volTop=padT+ch+gap;

  var lv=[s.entry,s.tp1,s.tp2,s.sl,inf.zoneLo,inf.zoneHi,inf.rangeHi,inf.rangeLo,inf.pdh,inf.pdl,inf.dayMid].filter(function(v){return Number(v)>0;});
  if(inf.lines){(g(inf,"lines.upper",[])||[]).concat(g(inf,"lines.lower",[])||[]).forEach(function(q){if(q&&Number(q.p)>0)lv.push(q.p);});}
  var hi=-Infinity,lo=Infinity;
  c.forEach(function(k){if(k[2]>hi)hi=k[2];if(k[3]<lo)lo=k[3];});
  lv.forEach(function(v){if(v>hi)hi=v;if(v<lo)lo=v;});
  var pad=(hi-lo)*0.06||hi*0.01||1;hi+=pad;lo-=pad;
  var rg=hi-lo||1;
  function Y(v){return padT+(hi-v)/rg*ch;}
  var step=c.length>1?c[1][0]-c[0][0]:1;
  var bw=Math.max(1,Math.min(13,(cw/c.length)*0.66));
  function X(i){return padL+(i+0.5)*(cw/c.length);}

  /* grid */
  x.strokeStyle="#1c2128";x.lineWidth=1;x.font="10.5px -apple-system,Segoe UI,sans-serif";x.textBaseline="middle";
  for(var i=0;i<=4;i++){
    var yv=lo+rg*i/4,yy=Y(yv);
    x.beginPath();x.moveTo(padL,yy);x.lineTo(padL+cw,yy);x.stroke();
    x.fillStyle="#5e6673";x.textAlign="left";x.fillText(yv>=100?yv.toFixed(2):yv>=1?yv.toFixed(4):yv.toPrecision(4),padL+cw+8,yy);
  }
  var tickN=Math.min(6,Math.max(3,Math.floor(cw/110)));
  for(var j=0;j<=tickN;j++){
    var idx=Math.round(j*(c.length-1)/tickN),xx=X(idx);
    x.strokeStyle="#161b21";x.beginPath();x.moveTo(xx,padT);x.lineTo(xx,padT+ch);x.stroke();
    x.fillStyle="#5e6673";x.textAlign="center";x.fillText(fmtTime(c[idx][0],d.tf),xx,H-9);
  }

  /* zone */
  if(inf.zoneLo&&inf.zoneHi&&inf.zoneHi>inf.zoneLo){
    x.fillStyle="rgba(252,213,53,.07)";x.fillRect(padL,Y(inf.zoneHi),cw,Y(inf.zoneLo)-Y(inf.zoneHi));
    x.strokeStyle="rgba(252,213,53,.28)";x.setLineDash([4,4]);x.beginPath();x.moveTo(padL,Y(inf.zoneHi));x.lineTo(padL+cw,Y(inf.zoneHi));x.moveTo(padL,Y(inf.zoneLo));x.lineTo(padL+cw,Y(inf.zoneLo));x.stroke();x.setLineDash([]);
  }
  /* trend lines */
  function seg(arr,col){if(!arr||arr.length<2)return;x.strokeStyle=col;x.lineWidth=1.2;x.setLineDash([6,4]);x.beginPath();var st=false;arr.forEach(function(q){var ix=(q.t-c[0][0])/step;if(ix<0||ix>c.length)return;st?x.lineTo(X(ix),Y(q.p)):x.moveTo(X(ix),Y(q.p));st=true;});x.stroke();x.setLineDash([]);}
  seg(g(inf,"lines.upper",null),"rgba(246,70,93,.55)");
  seg(g(inf,"lines.lower",null),"rgba(14,203,129,.55)");

  /* volume */
  var mv=0;c.forEach(function(k){if(k[5]>mv)mv=k[5];});
  c.forEach(function(k,i){
    var up=k[4]>=k[1],vh=mv?(k[5]/mv)*(volH-6):0;
    x.fillStyle=up?"rgba(14,203,129,.34)":"rgba(246,70,93,.34)";
    x.fillRect(X(i)-bw/2,volTop+volH-vh,bw,Math.max(1,vh));
  });

  /* candles */
  c.forEach(function(k,i){
    var up=k[4]>=k[1],col=up?"#0ecb81":"#f6465d";
    x.strokeStyle=col;x.fillStyle=col;x.lineWidth=1;
    x.beginPath();x.moveTo(X(i),Y(k[2]));x.lineTo(X(i),Y(k[3]));x.stroke();
    var top=Y(Math.max(k[1],k[4])),bot=Y(Math.min(k[1],k[4]));
    x.fillRect(X(i)-bw/2,top,bw,Math.max(1,bot-top));
  });

  /* ema */
  function emaLine(arr,col,w){if(!arr||!arr.length)return;x.strokeStyle=col;x.lineWidth=w||1.2;x.beginPath();var st=false;arr.forEach(function(v,i){if(!(v>0))return;st?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v));st=true;});x.stroke();}
  emaLine(d.ema20,"rgba(252,213,53,.85)",1.2);
  emaLine(d.ema50,"rgba(120,140,255,.85)",1.2);

  /* seviyeler */
  function level(v,col,label){
    if(!(Number(v)>0))return;
    var yy=Y(v);
    if(yy<padT-4||yy>padT+ch+4)return;
    x.strokeStyle=col;x.lineWidth=1;x.setLineDash([5,4]);x.beginPath();x.moveTo(padL,yy);x.lineTo(padL+cw,yy);x.stroke();x.setLineDash([]);
    x.font="700 9.5px -apple-system,Segoe UI,sans-serif";x.textAlign="left";x.textBaseline="middle";
    var t=label+" "+px(v),tw=x.measureText(t).width+10;
    x.fillStyle=col;x.fillRect(padL+cw+2,yy-8,tw,16);
    x.fillStyle="#0b0e11";x.fillText(t,padL+cw+7,yy);
  }
  level(inf.rangeHi,"#5e6673","DİR");
  level(inf.rangeLo,"#5e6673","DES");
  level(inf.pdh,"#f6465d","PDH");
  level(inf.pdl,"#0ecb81","PDL");
  level(inf.dayMid,"#8b93a1","GÜN ORTA");
  level(s.sl,"#f6465d","SL");
  level(s.tp2,"#0ecb81","TP2");
  level(s.tp1,"#0ecb81","TP1");
  level(s.entry,"#eaecef","GİRİŞ");

  /* son fiyat */
  var last=c[c.length-1],lc=last[4]>=last[1]?"#0ecb81":"#f6465d",ly=Y(last[4]);
  x.strokeStyle=lc;x.setLineDash([2,3]);x.beginPath();x.moveTo(padL,ly);x.lineTo(padL+cw,ly);x.stroke();x.setLineDash([]);
  x.fillStyle=lc;x.fillRect(padL+cw+2,ly-8,padR-6,16);
  x.fillStyle="#0b0e11";x.font="700 10px -apple-system,Segoe UI,sans-serif";x.textAlign="left";x.fillText(px(last[4]),padL+cw+7,ly);

  /* legend */
  x.textAlign="left";x.textBaseline="top";x.font="700 11.5px -apple-system,Segoe UI,sans-serif";x.fillStyle="#eaecef";
  x.fillText(s.base?s.base+"USDT · "+d.tf.toUpperCase():"Grafik",padL+2,6);

  /* crosshair */
  if(hover!=null&&hover>=0&&hover<c.length){
    var k=c[hover],hx=X(hover);
    x.strokeStyle="rgba(132,142,156,.5)";x.setLineDash([3,3]);x.beginPath();x.moveTo(hx,padT);x.lineTo(hx,volTop+volH);x.moveTo(padL,Y(k[4]));x.lineTo(padL+cw,Y(k[4]));x.stroke();x.setLineDash([]);
    var up=k[4]>=k[1],t1="A "+px(k[1])+"   Y "+px(k[2])+"   D "+px(k[3])+"   K "+px(k[4])+"   H "+num(k[5],0);
    x.font="11px -apple-system,Segoe UI,sans-serif";var tw2=x.measureText(t1).width+16;
    var bx=clamp(hx-tw2/2,padL,padL+cw-tw2);
    x.fillStyle="rgba(30,35,41,.96)";x.strokeStyle="#2b3139";x.lineWidth=1;
    x.fillRect(bx,padT+4,tw2,22);x.strokeRect(bx+.5,padT+4.5,tw2-1,21);
    x.fillStyle=up?"#0ecb81":"#f6465d";x.textAlign="left";x.textBaseline="middle";x.fillText(t1,bx+8,padT+15);
  }
}
function drawBt(){
  var cv=document.getElementById("bt_cv"),r=g(S.job,"result",null);
  if(!cv||!r||!r.curve||!r.curve.length)return;
  var dpr=window.devicePixelRatio||1,W=cv.clientWidth||800,H=230;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+"px";
  var x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  var c=r.curve,mn=Math.min(0,Math.min.apply(null,c)),mx=Math.max(0,Math.max.apply(null,c)),rg=(mx-mn)||1;
  function X(i){return 12+i/Math.max(1,c.length-1)*(W-24);}
  function Y(v){return H-18-(v-mn)/rg*(H-34);}
  x.strokeStyle="#1c2128";x.lineWidth=1;
  for(var i=0;i<=4;i++){var yy=10+i*(H-28)/4;x.beginPath();x.moveTo(12,yy);x.lineTo(W-12,yy);x.stroke();}
  x.strokeStyle="#3a424d";x.beginPath();x.moveTo(12,Y(0));x.lineTo(W-12,Y(0));x.stroke();
  var grd=x.createLinearGradient(0,Y(mx),0,Y(mn));grd.addColorStop(0,"rgba(14,203,129,.22)");grd.addColorStop(1,"rgba(14,203,129,0)");
  x.beginPath();x.moveTo(X(0),Y(0));c.forEach(function(v,i){x.lineTo(X(i),Y(v));});x.lineTo(X(c.length-1),Y(0));x.closePath();x.fillStyle=grd;x.fill();
  x.strokeStyle="#0ecb81";x.lineWidth=1.8;x.beginPath();c.forEach(function(v,i){i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v));});x.stroke();
  if(r.splitIdx){x.strokeStyle="rgba(252,213,53,.8)";x.setLineDash([4,4]);x.beginPath();x.moveTo(X(r.splitIdx),8);x.lineTo(X(r.splitIdx),H-8);x.stroke();x.setLineDash([]);}
  x.fillStyle="#5e6673";x.font="10.5px -apple-system,Segoe UI,sans-serif";x.textAlign="left";x.textBaseline="middle";
  x.fillText(sgn(mx,1)+"R",14,12);x.fillText(sgn(mn,1)+"R",14,H-6);
}

/* ══════════════ VERİ ══════════════ */
async function refresh(){
  if(S.busy)return;S.busy=true;
  try{
    var st=await api("/api/state");if(st&&st.version){S.state=st;S.lastAt=Date.now();}
    var t=S.tab,jobs=[];
    if(MODN[t]){
      jobs.push(api("/api/signals?module="+t).then(function(d){if(d)S.sig[t]=d;}));
      if(t==="PUMP"||t==="TREND")jobs.push(api("/api/paper").then(function(d){if(d)S.paper=d;}));
      var wk={LT:"lt",ZONE:"zone",RANGE:"range",DAILY:"daily"}[t];
      if(wk)jobs.push(api("/api/watch/"+wk).then(function(d){if(d)S.watch[wk]=d;}));
    }else if(t==="home"){
      jobs.push(api("/api/signals?closed=0").then(function(d){
        if(!d)return;var by={};(d.active||[]).forEach(function(s){(by[s.module]=by[s.module]||{active:[],closed:[]}).active.push(s);});
        S.sig=by;
      }));
      jobs.push(api("/api/paper").then(function(d){if(d)S.paper=d;}));
      jobs.push(api("/api/watch/daily").then(function(d){if(d)S.watch.daily=d;}));
    }else if(t==="ai"){
      jobs.push(api("/api/ai/status").then(function(d){if(d)S.ai=d;}));
    }else if(t==="discovery"){
      jobs.push(api("/api/ai/discovery").then(function(d){if(d && d.picks)S.discoveryCache=d; else if(d) S.discoveryCache = d;}));
    }else if(t==="radar")jobs.push(api("/api/radar").then(function(d){if(d)S.radar=d;}));
    else if(t==="stats")jobs.push(api("/api/stats").then(function(d){if(d)S.stats=d;}));
    else if(t==="strat"&&!S.strat)jobs.push(api("/api/strategies").then(function(d){if(d)S.strat=d;}));
    await Promise.all(jobs);
  }catch(e){console.error(e);}
  S.busy=false;
  try{render();}catch(e){console.error(e);}
}

document.addEventListener("click",async function(e){

  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.getAttribute("data-act"),id=t.getAttribute("data-id"),sym=t.getAttribute("data-symbol");

    if(a==="menu"){
      var side=document.getElementById("side"),bd=document.getElementById("backdrop"),opened=side.classList.toggle("open");
      if(opened&&!bd){bd=document.createElement("div");bd.id="backdrop";document.body.appendChild(bd);}
      else if(!opened&&bd){bd.remove();}
    }
    else if(a==="refresh"){toast("Yenileniyor…");await refresh();}
    else if(a==="tab"){S.tab=id;closeModal();var bd2=document.getElementById("backdrop");if(bd2)bd2.remove();document.getElementById("side").classList.remove("open");document.getElementById("main").innerHTML="<div class=\"empty\">Yükleniyor…</div>";renderNav();await refresh();}

    else if(a==="aiReview"){
      var oldHtml=t.innerHTML;t.disabled=true;t.innerHTML="<i class=\"fa-solid fa-spinner fa-spin\"></i> AI düşünüyor…";
      var ra=await post("/api/signal/"+encodeURIComponent(id)+"/ai");

      else toast((rb&&rb.error)||"Brifing alınamadı","err");

      if(rr&&rr.ok){toast("AI "+(g(rr,"ai.settingsEnabled",false)?"açık":"kapalı"),"ok");await refresh();}
      else toast("AI durumu değiştirilemedi","err");

      var rd=await post("/api/ai/discovery/scan");

      else{toast((rd&&rd.error)||"Keşif başarısız","err");t.disabled=false;t.innerHTML="<i class='fa-solid fa-satellite-dish'></i> Yeniden Tara";}
    }

      var cur=g(S.state,"settings.pumpAISniper",true);
      var r=await post("/api/ai/switch",{key:"pumpAISniper", enabled:!cur});
      if(r&&r.ok){toast("AI Sniper "+(r.settings.pumpAISniper?"AÇIK":"KAPALI"),"ok");await refresh();}
      else toast("Değiştirilemedi","err");
    }
    else if(a==="toggleTrendAI"){
      var curT=g(S.state,"settings.trendAI",true);
      var rT=await post("/api/ai/switch",{key:"trendAI", enabled:!curT});
      if(rT&&rT.ok){toast("Trend AI "+(rT.settings.trendAI?"AÇIK":"KAPALI"),"ok");await refresh();}
      else toast("Değiştirilemedi","err");
    }

      if(r6&&r6.ok){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();toast("Ayarlar kaydedildi","ok");await refresh();}else{toast("Ayarlar kaydedilemedi","err");}
    }

      S.jobId=rs.id;S.job={status:"çalışıyor",progress:0};render();pollJob();
    }
  }catch(err){console.error(err);toast("İşlem hatası","err");}
});

}
