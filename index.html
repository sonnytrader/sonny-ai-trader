<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphaSon v85</title>
<style>
:root{--bg:#0b0e14;--card:#131824;--card2:#1a2132;--line:#252d40;--tx:#e6e9f0;--mut:#8791a7;--up:#0ecb81;--dn:#f6465d;--acc:#f0b90b;--blue:#4c8dff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:#0d111b;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.logo{font-weight:800;color:var(--acc);margin-right:6px}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.acc{color:var(--acc)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);background:#0d111b}
nav button{background:none;border:1px solid transparent;color:var(--mut);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:13px}
nav button.on{background:var(--card2);border-color:var(--line);color:var(--tx)}
main{padding:12px;max-width:1400px;margin:0 auto}
h2{font-size:15px;margin:18px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media(max-width:640px){.grid,.stats{grid-template-columns:1fr}main{padding:8px}header{padding:6px 8px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.card .big{font-size:20px;font-weight:700}
.sc{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:700}
.b-up{background:#0ecb8122;color:var(--up)}.b-dn{background:#f6465d22;color:var(--dn)}.b-mut{background:var(--card2);color:var(--mut)}.b-acc{background:#f0b90b22;color:var(--acc)}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px}
.lv div{background:var(--card2);border-radius:6px;padding:4px 6px}.lv small{display:block;color:var(--mut);font-size:10px}
.pl{display:flex;align-items:baseline;gap:8px;font-size:18px;font-weight:700}.pl small{font-size:12px;color:var(--mut);font-weight:400}
.note{font-size:12px;color:var(--mut)}
button.b{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px}
button.b:hover{border-color:var(--acc)}button.b.pri{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}button.b.red{color:var(--dn)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;background:var(--card2);position:sticky;top:0}td.r,th.r{text-align:right}
td.pl2{font-weight:700;text-align:right}td.rr{color:var(--mut);text-align:right}
tr:last-child td{border-bottom:0}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.form input,.form select{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px}
pre{background:var(--card2);border-radius:8px;padding:8px;overflow:auto;font-size:12px;max-height:260px;margin:6px 0 0}
#modal{position:fixed;inset:0;background:#000c;z-index:50;display:none;padding:10px}
#modal .in{background:var(--card);border:1px solid var(--line);border-radius:12px;height:100%;display:flex;flex-direction:column;max-width:1500px;margin:0 auto}
#modal .hd{padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#chart{flex:1;min-height:300px}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--acc);padding:8px 14px;border-radius:10px;display:none;z-index:99;max-width:92vw}
</style>
</head>
<body>
<header>
  <span class="logo">⚡ AlphaSon</span><span class="pill mut" id="ver">v85</span>
  <span class="pill" id="btc">BTC –</span><span class="pill" id="eth">ETH –</span>
  <span class="pill" id="mkt">Piyasa –</span><span class="pill" id="mode">PAPER</span>
  <span class="pill" id="aip">AI –</span><span class="pill" id="aut">OtoTrade –</span>
  <span class="pill mut" id="upd"></span>
</header>
<nav id="nav"></nav>
<main id="view">Yükleniyor…</main>
<div id="modal"><div class="in"><div class="hd"><b id="mt"></b><span id="mi" class="note"></span><span style="flex:1"></span><button class="b" onclick="closeChart()">Kapat ✕</button></div><div id="chart"></div></div></div>
<div id="toast"></div>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABS=[['home','Özet'],['auto','OtoTrade'],['scalp','Günlük Hızlı Scalp'],['lt','LT Üçgen'],['stats','İstatistik'],['ai','AI'],['set','Ayarlar / Canlı']];
let S=null,tab=localStorage.getItem('tab')||'home',busy=false;
async function api(p,o){const r=await fetch(p,o?Object.assign({headers:{'Content-Type':'application/json'}},o):undefined);let j=null;try{j=await r.json()}catch(e){}if(!r.ok)throw new Error((j&&(j.error||j.note))||('HTTP '+r.status));return j}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b||{})});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4500)}
const n2=(v,d=2)=>v==null||!isFinite(v)?'–':Number(v).toFixed(d);
const px=v=>{v=Number(v);if(!isFinite(v)||v<=0)return '–';return v>=1000?v.toFixed(2):v>=1?v.toFixed(4):v>=0.01?v.toFixed(6):v.toFixed(8)};
const sg=v=>(v>0?'+':'')+n2(v);
const cl=v=>v>0?'up':v<0?'dn':'mut';
const dirB=d=>`<span class="badge ${d==='LONG'?'b-up':'b-dn'}">${d==='LONG'?'LONG ▲':'SHORT ▼'}</span>`;
const tm=t=>t?new Date(t).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'–';
const dur=ms=>{ms=Math.max(0,ms||0)/1000;return ms<90?Math.round(ms)+' sn':ms<5400?Math.round(ms/60)+' dk':(ms/3600).toFixed(1)+' sa'};
const RESL={TP1:'Hedef 1',TP2:'Hedef 2 ✔',SL:'Stop',BE:'Başa baş',TIME:'Süre doldu',MANUEL:'Manuel',MOMENTUM:'İvme bitti',FADE:'Kâr geri verildi',ZAYIF_IVME:'İvme zayıfladı',STALL:'Hareketsiz',AI_EXIT:'AI çıkış',EXCHANGE:'Borsada kapandı',AI_RED:'AI GİRME',SKIP:'Atlandı',AI_ERROR:'AI yok',AI_STALE:'Fiyat kaçtı',AI_TIMEOUT:'AI zaman aşımı'};
const plHtml=(u,r,pct)=>`<div class="pl"><span class="${cl(u)}">${sg(u)} USDT</span><small>${r!=null?sg(r)+'R':''}${pct!=null?' · %'+n2(pct):''}</small></div>`;

/* ── kapanan işlemler tablosu: K/Z (USDT) ana sütun, R ikincil sütun ── */
function closedTable(rows,empty){
  if(!rows.length)return `<div class="card note">${empty||'Henüz kapanan işlem yok.'}</div>`;
  return `<div class="tw"><table><thead><tr><th>Kapanış</th><th>Coin</th><th>Yön</th><th>Kurulum</th><th class="r">Giriş</th><th class="r">Çıkış</th><th>Sonuç</th><th class="r">K/Z (USDT)</th><th class="r">R</th></tr></thead><tbody>`+
  rows.map(x=>`<tr><td>${tm(x.t)}</td><td><b>${esc(x.base)}</b></td><td>${dirB(x.dir)}</td><td class="mut">${esc(x.tag||'')}</td><td class="r">${px(x.entry)}</td><td class="r">${px(x.exit)}</td><td>${esc(RESL[x.result]||x.result||'')}</td><td class="pl2 ${cl(x.usdt)}">${x.usdt==null?'–':sg(x.usdt)}${x.virtual?' <span class="mut" title="sanal: risk % ayarına göre">~</span>':''}</td><td class="rr">${x.r==null?'–':sg(x.r)+'R'}</td></tr>`).join('')+`</tbody></table></div>`;
}
const fromPos=p=>({t:p.closedAt,base:p.base,dir:p.dir,tag:p.setup||p.module,entry:p.entry,exit:p.exit,result:p.result,usdt:p.pnl,r:p.netR,virtual:false});
const fromSig=s=>({t:s.closedAt,base:s.base,dir:s.dir,tag:(s.info&&(s.info.setup||s.info.shape))||s.module,entry:s.entry,exit:s.exit,result:s.result,usdt:s.pl?s.pl.usdt:s.pnlUsdt,r:s.netR,virtual:s.tradeable===false});

/* ── kartlar ── */
function sigCard(s){
  const i=s.info||{},p=s.pl,ai=s.ai||{};
  const tag=i.setup||i.shape||s.module;
  const g=s.aiGate&&s.aiGate.note?esc(s.aiGate.note):'';
  return `<div class="card sc"><div class="row"><span><b>${esc(s.base)}</b> ${dirB(s.dir)} <span class="badge b-mut">${esc(tag)}</span></span><span class="badge b-acc">${esc(s.status)}</span></div>
  ${p?plHtml(p.usdt,p.netR,p.pricePct):''}
  <div class="lv"><div><small>Giriş</small>${px(s.entry)}</div><div><small>Stop${s.tp1Hit?' (girişte)':''}</small>${px(s.curSl||s.sl)}</div><div><small>TP1${s.tp1Hit?' ✔':''}</small>${px(s.tp1)}</div><div><small>TP2</small>${px(s.tp2)}</div></div>
  <div class="note">Güven ${s.conf} · net R:R ${n2(i.netRR)} · ${dur(s.ageMs)} önce${p&&p.virtual?' · <i>sanal K/Z (risk %'+(S&&S.settings?S.settings.riskPct:'')+')</i>':''}${p&&p.maxR?' · zirve '+n2(p.maxR)+'R':''}</div>
  ${ai.reason?`<div class="note">🤖 ${esc(ai.decisionV85||'')} — ${esc(ai.reason)}</div>`:(g?`<div class="note">${g}</div>`:'')}
  <div class="row"><button class="b" onclick="openChart('${s.id}')">📈 Grafik</button><button class="b red" onclick="closeSig('${s.id}')">Kapat</button></div></div>`;
}
function posCard(p){
  const d=p.dir==='LONG'?1:-1,rr=Math.abs(p.entry-p.sl)||1,rn=((p.livePrice||p.entry)-p.entry)*d/rr;
  return `<div class="card sc"><div class="row"><span><b>${esc(p.base)}</b> ${dirB(p.dir)} <span class="badge ${p.isLive?'b-dn':'b-mut'}">${p.isLive?'CANLI':'PAPER'}</span></span><span class="note">${dur(p.ageMs)}</span></div>
  ${plHtml(p.livePnl,(p.livePnl/Math.max(0.0001,p.riskAmt)),p.livePnlPct)}
  <div class="lv"><div><small>Giriş</small>${px(p.entry)}</div><div><small>Stop${p.tp1Hit?' (girişte)':''}</small>${px(p.curSl)}</div><div><small>TP1${p.tp1Hit?' ✔ yarı alındı':''}</small>${px(p.tp1)}</div><div><small>TP2</small>${px(p.tp2)}</div></div>
  <div class="note">Anlık ${px(p.livePrice)} · ${n2(rn)}R · zirve ${n2(p.maxR||0)}R${p.aiExit?' · AI: '+esc(p.aiExit):''}</div>
  <div class="row"><button class="b" onclick="openChart('${p.sigId}')">📈 Grafik</button><button class="b red" onclick="closePos('${p.id}',${p.isLive})">Kapat</button></div></div>`;
}
const emptyCard=t=>`<div class="card note">${t}</div>`;

/* ── üst bar ── */
function renderTop(){
  if(!S)return;
  $('#ver').textContent=S.version;
  const b=S.market&&S.market.btc,e=S.market&&S.market.eth;
  $('#btc').innerHTML='BTC '+(b?px(b.price):'–');$('#eth').innerHTML='ETH '+(e?px(e.price):'–');
  const m=S.market||{};const mc=m.dir==='LONG'?'up':m.dir==='SHORT'?'dn':'mut';
  $('#mkt').innerHTML=`Piyasa <b class="${mc}">${m.dir==='LONG'?'YÜKSELİŞ':m.dir==='SHORT'?'DÜŞÜŞ':'NÖTR'}</b>`;$('#mkt').title=m.why||'';
  const live=S.settings.tradeMode==='live';$('#mode').innerHTML=live?'<b class="dn">CANLI</b>':'PAPER';
  $('#aip').innerHTML=S.ai.enabled?'🤖 AI <b class="up">AÇIK</b>':'🤖 AI <b class="mut">KAPALI</b>';
  $('#aut').innerHTML=S.settings.autoTrade?'OtoTrade <b class="up">AÇIK</b>':'OtoTrade <b class="mut">KAPALI</b>';
  $('#upd').textContent=new Date().toLocaleTimeString('tr-TR');
}
function renderNav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(k){tab=k;localStorage.setItem('tab',k);renderNav();refresh(true)}

/* ── sekmeler ── */
async function vHome(){
  const [pp,sg2,lg]=await Promise.all([api('/api/paper'),api('/api/signals'),api('/api/logs')]);
  const sm=S.settings.tradeMode==='live'?pp.live.summary:pp.summary;
  const open=(S.settings.tradeMode==='live'?pp.live.open:[]).concat(pp.open);
  const closed=pp.closed.concat(pp.live.closed).map(fromPos).concat(sg2.closed.filter(s=>s.tradeable===false&&s.netR!=null).map(fromSig)).sort((a,b)=>b.t-a.t).slice(0,15);
  return `<div class="stats">
  <div class="card"><div class="note">Bakiye</div><div class="big">${n2(sm.equity)} USDT</div></div>
  <div class="card"><div class="note">Bugün K/Z</div><div class="big ${cl(sm.dayPnl)}">${sg(sm.dayPnl)}</div></div>
  <div class="card"><div class="note">Kazanma oranı</div><div class="big">%${n2(sm.winRate,1)}</div><div class="note">${sm.wins}K / ${sm.losses}Z</div></div>
  <div class="card"><div class="note">Açık işlem</div><div class="big">${open.length}</div><div class="note">Aktif sinyal ${S.counts.active}</div></div></div>
  ${S.live&&S.live.lastError&&S.settings.tradeMode==='live'?`<div class="card" style="border-color:var(--dn);margin-top:10px"><b class="dn">Bitget uyarısı</b><div class="note">${esc(S.live.lastError)}</div></div>`:''}
  <h2>Açık işlemler</h2><div class="grid">${open.length?open.map(posCard).join(''):emptyCard('Açık işlem yok.')}</div>
  <h2>Son kapanan işlemler / sinyaller</h2>${closedTable(closed)}
  <h2>Günlük</h2><pre>${esc((lg.logs||[]).slice(-14).map(l=>new Date(l.t).toLocaleTimeString('tr-TR')+'  '+l.msg).join('\n'))}</pre>`;
}
async function vAuto(){
  const [w,sg2,pp]=await Promise.all([api('/api/watch/auto'),api('/api/signals?module=AUTO'),api('/api/paper')]);
  const open=pp.open.filter(p=>p.module==='AUTO').concat(pp.live.open.filter(p=>p.module==='AUTO'));
  const closed=pp.closed.concat(pp.live.closed).filter(p=>p.module==='AUTO').map(fromPos);
  const pend=sg2.active.filter(s=>s.status==='AI_BEKLIYOR');
  return `<div class="card"><div class="row"><div><b>OtoTrade (Pump/Dump, 1m)</b><div class="note">AI tek yetkili: GİR derse açılır, GİRME derse açılmaz. TP1'de yarı kâr + stop girişe, TP2'de tamamı. Hareketsizlik / ters dönüşte beklemeden AI'ya sorulur.</div></div>
  <div><button class="b ${S.settings.autoTrade?'pri':''}" onclick="tgAuto()">${S.settings.autoTrade?'Kapat':'Aç'}</button></div></div>
  <div class="note">Açık ${S.counts.autoOpen}/${S.counts.autoMaxOpen} · AI saatlik bütçe ${S.settings.autoAiPerHour} · son tarama ${tm(S.scan.autoAt)}</div></div>
  <h2>Açık pozisyonlar</h2><div class="grid">${open.length?open.map(posCard).join(''):emptyCard('Açık OtoTrade pozisyonu yok.')}</div>
  ${pend.length?`<h2>AI kararı bekleyen</h2><div class="grid">${pend.map(sigCard).join('')}</div>`:''}
  <h2>Aday listesi (matematik) <span class="note">${(w.items||[]).length} aday</span></h2>${(w.items||[]).length?`<div class="tw"><table><thead><tr><th>Coin</th><th>Yön</th><th>Durum</th><th class="r">Fiyat</th><th class="r">1m%</th><th class="r">3m%</th><th class="r">Hacim</th><th class="r">Hareket(ATR)</th><th class="r">Skor</th></tr></thead><tbody>${w.items.map(r=>`<tr><td><b>${esc(r.base)}</b></td><td>${dirB(r.dir)}</td><td class="mut">${esc(r.state)}</td><td class="r">${px(r.price)}</td><td class="r ${cl(r.chg1)}">${sg(r.chg1)}</td><td class="r ${cl(r.chg3)}">${sg(r.chg3)}</td><td class="r">${n2(r.volRatio,1)}x</td><td class="r">${n2(r.atrProgress,1)}</td><td class="r">${r.score}</td></tr>`).join('')}</tbody></table></div>`:emptyCard('Şu an aday yok.')}
  <h2>Kapanan işlemler</h2>${closedTable(closed)}`;
}
async function vScalp(){
  const [w,sg2]=await Promise.all([api('/api/watch/scalp'),api('/api/signals?module=PUMP')]);
  return `<div class="card"><b>Günlük Hızlı Scalp — 15 dakika, yalnızca sinyal</b><div class="note">İşlem açmaz. AI kurulum bazlı kontrol listesiyle karar verir; GİR derse sinyal yayınlanır ve kâr/zarar kartta canlı izlenir. Ters piyasa yönünde sinyal üretilmez. K/Z, risk % ayarına göre sanaldır.</div></div>
  <h2>Aktif sinyaller</h2><div class="grid">${sg2.active.length?sg2.active.map(sigCard).join(''):emptyCard('Aktif scalp sinyali yok.')}</div>
  <h2>İzleme listesi <span class="note">${(w.items||[]).length}</span></h2>${(w.items||[]).length?`<div class="tw"><table><thead><tr><th>Coin</th><th>Kurulum</th><th>Yön</th><th>Durum</th><th class="r">Fiyat</th><th class="r">Tetik</th><th class="r">Mesafe%</th><th class="r">Hacim</th><th class="r">RSI</th></tr></thead><tbody>${w.items.map(r=>`<tr><td><b>${esc(r.base)}</b></td><td>${esc(r.setup)}</td><td>${dirB(r.dir)}</td><td class="mut">${esc(r.state)}</td><td class="r">${px(r.price)}</td><td class="r">${px(r.trigger)}</td><td class="r">${n2(r.distPct)}</td><td class="r">${n2(r.volRatio,1)}x</td><td class="r">${r.rsi==null?'–':r.rsi}</td></tr>`).join('')}</tbody></table></div>`:emptyCard('İzlemede kurulum yok.')}
  <h2>Kapanan sinyaller</h2>${closedTable(sg2.closed.filter(s=>s.netR!=null).map(fromSig))}`;
}
async function vLt(){
  const [w,sg2]=await Promise.all([api('/api/watch/lt'),api('/api/signals?module=LT')]);
  return `<div class="card"><b>LT Üçgen — 2 saat, yalnızca sinyal</b><div class="note">Büyük tepe/diplerden geçen, aradaki mumlarca delinmemiş trend çizgileri (ZigZag 3×ATR). Alçalan / yükselen / simetrik. Grafikte çizgiler sola uzatılmış çizilir (TradingView'daki gibi).</div></div>
  <h2>Aktif sinyaller</h2><div class="grid">${sg2.active.length?sg2.active.map(sigCard).join(''):emptyCard('Aktif LT sinyali yok.')}</div>
  <h2>İzleme listesi <span class="note">${(w.items||[]).length}</span></h2>${(w.items||[]).length?`<div class="tw"><table><thead><tr><th>Coin</th><th>Şekil</th><th>Durum</th><th class="r">Fiyat</th><th class="r">Üst çizgi</th><th class="r">Alt çizgi</th><th class="r">Üst%</th><th class="r">Alt%</th><th class="r">Olgunluk</th><th></th></tr></thead><tbody>${w.items.map(r=>`<tr><td><b>${esc(r.base)}</b></td><td>${esc(r.shape||'')}</td><td class="${r.status==='KIRILIM YAKIN'?'acc':'mut'}">${esc(r.status)}</td><td class="r">${px(r.price)}</td><td class="r">${px(r.upper)}</td><td class="r">${px(r.lower)}</td><td class="r">${n2(r.distUpperPct)}</td><td class="r">${n2(r.distLowerPct)}</td><td class="r">${n2(r.maturity)}</td><td><button class="b" onclick="openSym('${esc(r.symbol)}','2h',${r.upper},${r.lower})">📈</button></td></tr>`).join('')}</tbody></table></div>`:emptyCard('Üçgen bulunamadı (ilk tarama 1-2 dk sürebilir).')}
  <h2>Kapanan sinyaller</h2>${closedTable(sg2.closed.filter(s=>s.netR!=null).map(fromSig))}`;
}
async function vStats(){
  const [st,ac,rs,dc]=await Promise.all([api('/api/stats'),api('/api/ai/accuracy'),api('/api/ai/reasons'),api('/api/decisions')]);
  const acRows=Object.entries(ac.byDecision||{});
  return `<h2>Modül istatistikleri</h2><div class="tw"><table><thead><tr><th>Modül</th><th class="r">Toplam</th><th class="r">İşlem/sinyal</th><th class="r">Atlanan</th><th class="r">Kazanma%</th><th class="r">Net R</th><th class="r">Ort. R</th></tr></thead><tbody>${st.modules.map(m=>`<tr><td><b>${esc(m.label)}</b></td><td class="r">${m.total}</td><td class="r">${m.filled+m.virtual}</td><td class="r">${m.skipped}</td><td class="r">${n2(m.module==='LT'||m.module==='PUMP'?m.hitRate:m.winRate,1)}</td><td class="r ${cl(m.netR)}">${sg(m.netR)}</td><td class="r">${m.avgR==null?'–':sg(m.avgR)}</td></tr>`).join('')}</tbody></table></div>
  <h2>AI karar doğruluğu (gölge ölçüm)</h2>${acRows.length?`<div class="tw"><table><thead><tr><th>AI kararı</th><th class="r">Örnek</th><th class="r">Ort. R</th><th class="r">TP1 oranı%</th><th class="r">Kazanç%</th></tr></thead><tbody>${acRows.map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td class="r">${v.n}</td><td class="r ${cl(v.avgR)}">${sg(v.avgR)}</td><td class="r">${v.tp1Rate}</td><td class="r">${v.winRate}</td></tr>`).join('')}</tbody></table></div><div class="note">${esc(ac.note)}</div>`:emptyCard('Henüz ölçüm yok (AI kararlarından sonra fiyat TP1/SL\'e gidince dolar).')}
  <h2>En çok ret üreten kontrol maddeleri</h2>${rs.items.length?`<div class="tw"><table><tbody>${rs.items.slice(0,15).map(x=>`<tr><td>${esc(x.check)}</td><td class="r">${x.count}</td></tr>`).join('')}</tbody></table></div>`:emptyCard('Henüz veri yok.')}
  <h2>Son kararlar</h2><pre>${esc(dc.items.slice(0,25).map(x=>new Date(x.t).toLocaleTimeString('tr-TR')+' '+x.type+' '+(x.base||'')+' '+(x.dir||'')+' '+(x.setup||x.result||'')+' '+(x.decision||'')+' '+(x.reason||x.res||'')).join('\n'))}</pre>`;
}
async function vAi(){
  const [a,h]=await Promise.all([api('/api/ai/status'),api('/api/ai/history')]);
  const m=a.market||{};
  return `<div class="card"><div class="row"><div><b>Piyasa yönü (AI, 15m)</b><div class="note">${esc(m.dir||'NOTR')} · ${m.score||0}/100 · ${esc(m.reason||'')} · ${m.provider?esc(m.provider)+'/'+esc(m.model):''} · ${tm(m.at)}</div></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="b ${a.settingsEnabled?'pri':''}" onclick="tgAi()">AI ${a.settingsEnabled?'Kapat':'Aç'}</button><button class="b" onclick="act('/api/ai/market','Piyasa yönü yenileniyor')">Yönü yenile</button><button class="b" onclick="act('/api/ai/discover','Model keşfi başladı (1-2 dk)')">Model keşfi</button><button class="b" onclick="aiTest()">Test</button><button class="b" onclick="act('/api/ai/reset','Soğumalar sıfırlandı')">Soğumaları sıfırla</button></div></div></div>
  <h2>Sağlayıcılar</h2><div class="tw"><table><thead><tr><th>Sağlayıcı</th><th>Anahtar</th><th>Modeller</th><th class="r">Bugün</th><th class="r">Başarı/Hata/Geçersiz</th><th>Durum</th><th>Son hata</th></tr></thead><tbody>${a.providers.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.hasKey?'<span class="up">var</span>':'<span class="dn">yok</span>'}</td><td class="mut" style="white-space:normal;max-width:260px">${esc(p.models.join(', '))}</td><td class="r">${p.dayCount}/${p.dayLimit}</td><td class="r">${p.ok}/${p.fail}/${p.invalid}</td><td>${p.cooldownSec>0?'<span class="acc">bekliyor '+Math.round(p.cooldownSec/60)+' dk</span>':'<span class="up">hazır</span>'}</td><td class="mut" style="white-space:normal;max-width:340px;font-size:11px">${esc((p.lastError||'').slice(0,200))}</td></tr>`).join('')}</tbody></table></div>
  <h2>Son AI kararları</h2><div class="tw"><table><thead><tr><th>Zaman</th><th>Tür</th><th>Coin</th><th>Yön</th><th>Karar</th><th>Gerekçe</th><th>Model</th><th>Gölge</th></tr></thead><tbody>${h.items.slice(0,40).map(x=>`<tr><td>${tm(x.at)}</td><td class="mut">${esc(x.kind)}</td><td><b>${esc(x.base)}</b></td><td>${x.dir?dirB(x.dir):''}</td><td>${esc(x.decisionV85||x.verdict||'')}</td><td style="white-space:normal;max-width:340px">${esc(x.reason||'')}</td><td class="mut">${esc(x.model||'')}</td><td>${x.shadowResult?`<span class="${cl(x.shadowResult.R)}">${esc(x.shadowResult.res)} ${sg(x.shadowResult.R)}R</span>`:'–'}</td></tr>`).join('')}</tbody></table></div>`;
}
async function vSet(){
  const s=S.settings;
  const f=(k,l,t='number',extra='')=>`<label>${l}<input data-k="${k}" type="${t}" ${extra} value="${esc(s[k])}"></label>`;
  return `<h2>Ayarlar</h2><div class="card"><div class="form">
  <label>İşlem modu<select data-k="tradeMode"><option value="paper" ${s.tradeMode==='paper'?'selected':''}>Paper</option><option value="live" ${s.tradeMode==='live'?'selected':''}>Canlı (Bitget)</option></select></label>
  ${f('margin','Maks. marjin (USDT)')}${f('leverage','Kaldıraç')}${f('riskPct','İşlem başı risk %','number','step="0.05"')}${f('autoMaxOpen','OtoTrade maks. açık')}${f('dailyLossPct','Günlük zarar limiti %')}${f('stallSec','Hareketsizlik çıkışı (sn)')}${f('autoAiPerHour','OtoTrade AI/saat bütçesi')}${f('paperEquity','Paper bakiye')}
  <label>Hisse benzeri semboller (OtoTrade/Scalp)<select data-k="includeStocks"><option value="false" ${!s.includeStocks?'selected':''}>Hariç</option><option value="true" ${s.includeStocks?'selected':''}>Dahil</option></select></label>
  </div><div style="margin-top:10px"><button class="b pri" onclick="saveSet()">Kaydet</button> <button class="b red" onclick="if(confirm('Paper bakiye ve geçmişi sıfırlansın mı?'))act('/api/paper/reset','Sıfırlandı')">Paper sıfırla</button></div></div>
  <h2>Bitget bağlantı teşhisi</h2><div class="card"><div class="note">Hata kodu 40018 "Invalid IP" ise: Bitget → API Yönetimi → anahtar → IP beyaz listesine sunucunun çıkış IP'sini ekle (Render panelinde Connect → Outbound listesindeki IP'ler).</div>
  <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="b" onclick="diag('/api/myip')">Sunucu IP'si</button><button class="b" onclick="diag('/api/live/diag')">Bakiye / anahtar testi</button><button class="b" onclick="diag('/api/live/positions')">Borsa pozisyonları</button></div><pre id="dg">–</pre></div>`;
}
const VIEWS={home:vHome,auto:vAuto,scalp:vScalp,lt:vLt,stats:vStats,ai:vAi,set:vSet};

/* ── eylemler ── */
async function act(p,msg){try{const r=await post(p);toast(msg||'Tamam');refresh(true);return r}catch(e){toast('Hata: '+e.message)}}
async function tgAuto(){try{const r=await post('/api/auto/toggle');toast(r.note||('OtoTrade '+(r.enabled?'açıldı':'kapandı')));refresh(true)}catch(e){toast(e.message)}}
async function tgAi(){try{const r=await post('/api/ai/toggle',{enabled:!S.settings.aiEnabled});toast(r.note||('AI '+(r.settingsEnabled?'açıldı':'kapandı')));refresh(true)}catch(e){toast(e.message)}}
async function closeSig(id){if(!confirm('Sinyal kapatılsın mı?'))return;try{await post('/api/signal/'+id+'/close');toast('Kapatıldı');refresh(true)}catch(e){toast(e.message)}}
async function closePos(id,live){if(!confirm('Pozisyon kapatılsın mı?'))return;try{await post((live?'/api/live/':'/api/paper/')+id+'/close');toast('Kapatıldı');refresh(true)}catch(e){toast(e.message)}}
async function aiTest(){try{const r=await api('/api/ai/test');toast(r.providers.map(p=>p.name+': '+(p.results.length?p.results.map(x=>x.ok?'✔':'✘').join(''):'–')).join(' | '))}catch(e){toast(e.message)}}
async function saveSet(){const b={};document.querySelectorAll('[data-k]').forEach(el=>{let v=el.value;if(v==='true')v=true;else if(v==='false')v=false;else if(el.type==='number')v=Number(v);b[el.dataset.k]=v});
  try{const r=await post('/api/paper/settings',b);if(b.tradeMode){const m=await post('/api/trade/mode',{mode:b.tradeMode});if(m.warning)toast(m.warning);else toast('Kaydedildi')}else toast('Kaydedildi');refresh(true)}catch(e){toast('Hata: '+e.message)}}
async function diag(p){const el=$('#dg');el.textContent='…';try{el.textContent=JSON.stringify(await api(p),null,2)}catch(e){el.textContent='Hata: '+e.message}}

/* ── grafik: TradingView tarzı (lightweight-charts) ── */
let CH=null;
function openSym(sym,tf,up,lo){showChart('/api/chart?symbol='+encodeURIComponent(sym)+'&tf='+tf+'&upper='+(up||0)+'&lower='+(lo||0),sym)}
function openChart(id){showChart('/api/chart/'+id,'')}
async function showChart(url,title){
  if(!window.LightweightCharts){toast('Grafik kütüphanesi yüklenemedi (internet/CDN)');return}
  $('#modal').style.display='block';$('#mt').textContent=title||'Yükleniyor…';$('#mi').textContent='';
  if(CH){CH.remove();CH=null}
  try{
    const d=await api(url);
    $('#mt').innerHTML=esc(d.base)+' · '+esc(d.tf)+(d.triangle?' · '+esc(d.triangle.shape||'üçgen'):'');
    $('#mi').innerHTML=`<a href="${esc(d.tradingview)}" target="_blank" style="color:var(--blue)">TradingView'da aç ↗</a>`;
    const el=$('#chart');el.innerHTML='';
    CH=LightweightCharts.createChart(el,{layout:{background:{color:'#131824'},textColor:'#8791a7'},grid:{vertLines:{color:'#1a2132'},horzLines:{color:'#1a2132'}},timeScale:{timeVisible:true,rightOffset:12},rightPriceScale:{borderColor:'#252d40'},crosshair:{mode:0}});
    const cs=CH.addCandlestickSeries({upColor:'#0ecb81',downColor:'#f6465d',borderVisible:false,wickUpColor:'#0ecb81',wickDownColor:'#f6465d'});
    const data=d.candles.map(c=>({time:Math.floor(c[0]/1000),open:c[1],high:c[2],low:c[3],close:c[4]}));cs.setData(data);
    const noScale={autoscaleInfoProvider:()=>null};
    const ln=(arr,color,w,style)=>{if(!arr||!arr.length)return;const s=CH.addLineSeries(Object.assign({color,lineWidth:w,lineStyle:style||0,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false},noScale));
      const seen=new Set(),pts=[];for(const [t,v] of arr){const k=Math.floor(t/1000);if(!seen.has(k)){seen.add(k);pts.push({time:k,value:v})}}s.setData(pts.sort((a,b)=>a.time-b.time))};
    const e20=CH.addLineSeries({color:'#4c8dff55',lineWidth:1,priceLineVisible:false,lastValueVisible:false});e20.setData(d.candles.map((c,i)=>d.ema20[i]?{time:Math.floor(c[0]/1000),value:d.ema20[i]}:null).filter(Boolean));
    if(d.triangle){ln(d.triangle.upperFull,'#f6465d',2);ln(d.triangle.lowerFull,'#0ecb81',2);
      const mk=(d.triangle.pivots||[]).map(p=>({time:Math.floor(p.t/1000),position:p.side==='H'?'aboveBar':'belowBar',color:p.side==='H'?'#f6465d':'#0ecb81',shape:p.side==='H'?'arrowDown':'arrowUp',size:0.6})).sort((a,b)=>a.time-b.time);cs.setMarkers(mk)}
    (d.supportResistance||[]).forEach(l=>cs.createPriceLine({price:l.v,color:l.kind==='R'?'#f6465d88':'#0ecb8188',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:l.l}));
    const sg=d.signal||{};
    [['entry','#f0b90b','Giriş'],['sl','#f6465d','Stop'],['tp1','#0ecb81','TP1'],['tp2','#0ecb81','TP2']].forEach(([k,c,t])=>{if(sg[k]>0)cs.createPriceLine({price:sg[k],color:c,lineWidth:1,lineStyle:k==='entry'?0:2,axisLabelVisible:true,title:t})});
    const n=data.length;CH.timeScale().setVisibleLogicalRange({from:Math.max(0,n-(d.triangle?320:150)),to:n+30});
    new ResizeObserver(()=>{if(CH)CH.applyOptions({width:el.clientWidth,height:el.clientHeight})}).observe(el);
  }catch(e){$('#mt').textContent='Hata: '+e.message}
}
function closeChart(){$('#modal').style.display='none';if(CH){CH.remove();CH=null}}

/* ── döngü ── */
async function refresh(force){
  if(busy&&!force)return;busy=true;
  try{S=await api('/api/state');renderTop();const y=window.scrollY;const html=await VIEWS[tab]();
    if(!document.activeElement||!['INPUT','SELECT'].includes(document.activeElement.tagName)){$('#view').innerHTML=html;window.scrollTo(0,y)}}
  catch(e){$('#view').innerHTML='<div class="card dn">Bağlantı hatası: '+esc(e.message)+'</div>'}
  busy=false;
}
renderNav();refresh(true);setInterval(()=>{if($('#modal').style.display!=='block')refresh()},6000);
</script>
