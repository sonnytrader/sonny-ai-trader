function dirChip(d){return d==="LONG"?'<span class="chip long"><i class="fa-solid fa-arrow-up"></i>LONG</span>':d==="SHORT"?'<span class="chip short"><i class="fa-solid fa-arrow-down"></i>SHORT</span>':'<span class="chip neutral">NÖTR</span>';}
function mktChip(d){return d==="LONG"?'<span class="mkt long"><i class="fa-solid fa-arrow-trend-up"></i>YÜKSELİŞ</span>':d==="SHORT"?'<span class="mkt short"><i class="fa-solid fa-arrow-trend-down"></i>DÜŞÜŞ</span>':'<span class="mkt neutral"><i class="fa-solid fa-minus"></i>NÖTR</span>';}
function resChip(r){var k=/^(TP1|TP2)$/.test(r)?"long":/^SL$/.test(r)?"short":/^(FADE|MOMENTUM|ZAYIF_IVME|STALL|APPROVAL_EXPIRED|AI_EXIT|AI_.*)$/.test(r)?"gold":"neutral";return '<span class="chip '+k+'">'+esc(RES[r]||r||"-")+'</span>';}
function verdictChip(a){if(!a||!a.verdict)return "";var v=String(a.verdict).toUpperCase(),k=v==="ONY"?"long":v==="RED"?"short":"gold";var l=a.verdictLabel||(v==="ONY"?"GİRİLİR":v==="RED"?"GİRİLMEZ":"BEKLE");return '<span class="chip '+k+'"><i class="fa-solid fa-brain"></i> '+esc(l)+(a.trust?" · "+esc(a.trust):"")+(a.score!=null?" "+num(a.score,0):"")+'</span>';}
function evDecisionChip(d){var k=d==="CANDIDATE"?"long":d==="REJECT"?"short":d==="INSUFFICIENT_DATA"?"gold":"neutral";return '<span class="chip '+k+'">'+esc(EV_DEC_TR[d]||d||"İZLE")+'</span>';}
function evPhaseChip(p){var idx={PRE_BREAKOUT:0,TRIGGER_PENDING:1,CONFIRMED:2,LATE:3,INVALID:4,EARLY:4,CONTINUATION:2,PULLBACK:1,EXHAUSTION:3,UNCLEAR:4}[p]||4;return '<span class="phase-chip p'+idx+'">'+esc(EV_PH_TR[p]||p||"—")+'</span>';}
function listHtml(a){if(!a||!a.length)return '<span class="mut">—</span>';return a.map(function(x){return '<div style="display:flex;gap:7px;margin:4px 0"><span class="gold">•</span><span>'+esc(x)+'</span></div>';}).join("");}
function sec(t,r){return '<div class="sec"><h3>'+t+'</h3><div class="line"></div>'+(r?'<div class="more">'+r+'</div>':"")+'</div>';}
function pageHead(t,sub,r){return '<div style="display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap"><div><h1 style="margin:0;font-size:21px">'+t+'</h1>'+(sub?'<p style="margin:5px 0 0;font-size:12.5px;color:var(--mut)">'+sub+'</p>':"")+'</div>'+(r?'<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">'+r+'</div>':"")+'</div>';}
function statCard(l,v,s,c){return '<div class="card kpi '+(c||"")+'"><div class="l">'+esc(l)+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':"")+'</div>';}
function noteBox(icon,html,extra){return '<div class="card note" style="'+(extra||"")+'"><i class="fa-solid '+icon+'" style="color:var(--gold);margin-right:6px"></i>'+html+'</div>';}

function indicatorTag(k,v){
  if(typeof v!=="number")return "";k=String(k).toLowerCase();var l="",c="";
  if(k==="adx"){if(v>=30){l="GÜÇLÜ TREND";c="ok";}else if(v>=20){l="NÖTR";c="warn";}else{l="ZAYIF TREND";c="bad";}}
  else if(k==="volratio"){if(v>=1.5){l="GÜÇLÜ HACİM";c="ok";}else if(v>=1){l="NÖTR";c="warn";}else{l="ZAYIF HACİM";c="bad";}}
  else if(k==="rsi"){if(v>70||v<30){l=v>70?"AŞIRI ALIM":"AŞIRI SATIM";c="bad";}else{l="NORMAL";c="ok";}}
  else if(k==="spreadpct"){if(v<=0.1){l="DAR SPREAD";c="ok";}else if(v<=0.3){l="NÖTR";c="warn";}else{l="GENİŞ SPREAD";c="bad";}}
  else if(k==="riskpct"){if(v<=0.5){l="DAR STOP";c="ok";}else if(v<=1.5){l="NÖTR";c="warn";}else{l="GENİŞ STOP";c="bad";}}
  return l?'<span class="tag '+c+'">'+l+'</span>':"";
}
function analysisCard(a,title,note){
  if(!a)return '<div class="card empty" style="padding:12px">'+esc(note||"Analiz yok")+'</div>';
  var conf=clamp(Number(a.score)||0,0,100),col=conf>=70?"var(--green)":conf>=50?"var(--gold)":"var(--red)",meta=[];
  if(a.providerName)meta.push(esc(a.providerName)+(a.model?" · "+esc(a.model):""));
  if(a.latencyMs)meta.push(num(a.latencyMs,0)+" ms");
  if(a.at)meta.push(new Date(a.at).toLocaleString("tr-TR"));
  var p=function(t,st){return t?'<p style="font-size:12px;line-height:1.6;margin:8px 0 0;'+(st||"")+'">'+t+'</p>':"";};
  var phaseChip=a.phase?'<span class="phase-chip p0">'+esc(a.phase)+'</span>':"";
  return '<div class="card" style="padding:14px 16px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:12.5px">'+esc(title)+'</b>'+verdictChip(a)+phaseChip+(a.riskLevel?'<span class="chip neutral">Risk: '+esc(a.riskLevel)+'</span>':"")+(a.source==="ai"?'<span class="chip gold">AI</span>':'<span class="chip neutral">KURAL</span>')+'</div>'+
   (meta.length?'<div style="font-size:10.5px;color:var(--mut-2);margin-top:5px">'+meta.join(" · ")+'</div>':"")+
   '<div style="display:flex;align-items:center;gap:8px;margin-top:10px"><div class="bar" style="height:5px;flex:1"><i style="width:'+conf+'%;background:'+col+'"></i></div><b class="num" style="font-size:11px">'+conf+'/100</b></div>'+
   p(a.simpleSummary&&'<b>'+esc(a.simpleSummary)+'</b>')+p(a.summary&&esc(a.summary),"color:#c9ced6")+(a.reason&&a.reason!==a.summary?p('<b>Neden:</b> '+esc(a.reason),"color:#c9ced6"):"")+
   (a.reasons&&a.reasons.length?'<div style="margin-top:10px;font-size:11.5px"><b class="mut">Gerekçeler</b>'+listHtml(a.reasons)+'</div>':"")+
   (a.risks&&a.risks.length?'<div style="margin-top:8px;font-size:11.5px"><b class="mut">Riskler</b>'+listHtml(a.risks)+'</div>':"")+
   p(a.suggested&&'<b class="up">Plan:</b> '+esc(a.suggested))+'</div>';
}

function sigCard(s){
  var act=s.status==="AKTIF",pAI=s.status==="AI_BEKLIYOR",pAp=s.status==="ONAY_BEKLIYOR";
  var pct=act?g(s,"livePct",null):g(s,"pnlPct",null),conf=clamp(Number(s.conf)||0,0,100),i=s.info||{},tags="";
  var stopVal=s.tp1Hit?s.entry:(s.curSl||s.sl); 
  var stopLabel=s.tp1Hit?' <span class="chip long">BE</span>':'';

  if(s.marketAlign==="TERS")tags+='<span class="chip gold">PİYASAYA TERS</span>';else if(s.marketAlign==="UYUMLU")tags+='<span class="chip long">PİYASA UYUMLU</span>';
  if(s.module==="PUMP"&&i.tf)tags+='<span class="chip neutral">'+esc(i.tf)+'</span>';
  if(i.setup)tags+='<span class="chip neutral">'+esc(i.setup)+'</span>';
  if(i.source==="ai")tags+='<span class="chip gold"><i class="fa-solid fa-wand-magic-sparkles"></i> AI</span>';
  if(pAI)tags+='<span class="chip gold"><i class="fa-solid fa-hourglass-half"></i> AI BEKLİYOR</span>';
  else if(pAp)tags+='<span class="chip gold"><i class="fa-solid fa-hand"></i> ONAY</span>';
  else if(s.aiGate&&s.aiGate.state==="APPROVED")tags+='<span class="chip long">AI ONAYLI</span>';
  if(act&&s.tp1Hit)tags+='<span class="chip long">TP1 ✔</span>';
  if(!act&&!pAI&&!pAp)tags+=resChip(s.result);
  var bar="";
  if(pAp)bar='<button class="btn green" style="padding:7px;font-size:12px;width:100%" data-act="execSig" data-id="'+esc(s.id)+'">Onayla ve Aç</button>';
  return '<article class="sig '+(s.dir==="LONG"?"long":"short")+'" data-act="open" data-id="'+esc(s.id)+'"><div class="sig-h"><div class="sym">'+esc(s.base)+'<span>USDT</span></div>'+dirChip(s.dir)+'<span class="age">'+dur(Date.now()-s.createdAt)+'</span></div>'+
   '<div class="sig-mod"><i class="fa-solid fa-microchip"></i> '+esc(MODN[s.module]||s.module)+'</div>'+
   '<div class="sig-px"><div><span>Giriş</span><b>'+px(s.entry)+'</b></div><div><span>Hedef</span><b class="up">'+px(s.tp1)+'</b></div><div><span>Stop</span><b class="dn">'+px(stopVal)+stopLabel+'</b></div></div>'+
   '<div class="sig-f"><div class="conf"><div class="bar"><i style="width:'+conf+'%;background:'+(conf>=70?"var(--green)":conf>=50?"var(--gold)":"var(--red)")+'"></i></div><em>'+num(conf,0)+'</em></div><span class="pnl '+(pct==null?"mut":cls(pct))+'">'+(pct==null?"—":sgn(pct,2)+"%")+'</span></div>'+bar+(tags?'<div class="sig-tags">'+tags+'</div>':"")+'</article>';
}

function ltWatchTable(limit){
  var ltw=g(S.watch,"lt.items",[]);
  if(!ltw.length)return '<div class="card empty"><i class="fa-regular fa-circle-check"></i>Kırılıma yaklaşan üçgen yok</div>';
  return '<div class="card scroll"><table class="tbl"><thead><tr><th>Coin</th><th>TF</th><th>Fiyat</th><th>Üst</th><th>Alt</th><th>Üste %</th><th>Alta %</th><th>Yakın</th><th>Sistem</th><th>AI Değerlendirmesi</th></tr></thead><tbody>'+
    ltw.slice(0,limit||40).map(function(w){
      var up=w.distUpper!=null?w.distUpper:((w.upper/w.price-1)*100);
      var lo=w.distLower!=null?w.distLower:((1-w.lower/w.price)*100);
      var aiCell='<span class="mut" style="font-size:11px">AI bekleniyor…</span>';
      if(w.ai&&w.ai.ev){
        var ev=w.ai.ev;
        aiCell='<div class="ai-cell">'+evDecisionChip(ev.decision)+evPhaseChip(ev.phase)+' <b>'+num(ev.score,0)+'</b> · '+esc(CONF_TR[ev.confidence]||ev.confidence||'');
        if(ev.dataQuality&&ev.dataQuality!=="GOOD")aiCell+=' <span class="chip neutral">'+esc(DQ_TR[ev.dataQuality]||ev.dataQuality)+'</span>';
        if(ev.summary)aiCell+='<div style="margin-top:3px;color:#c9ced6">'+esc(ev.summary.slice(0,180))+'</div>';
        aiCell+='<div style="margin-top:3px;font-size:10px;color:var(--mut-2)">'+esc(w.ai.provider||'AI')+(w.ai.model?' · '+esc(w.ai.model):'')+' · <button class="btn ghost" style="padding:1px 5px;font-size:9.5px" data-act="aiWatch" data-kind="lt" data-base="'+esc(w.base)+'">Yenile</button></div></div>';
      } else if(w.ai&&w.ai.verdict){aiCell=verdictChip(w.ai)+' <button class="btn ghost" style="padding:1px 5px;font-size:9.5px" data-act="aiWatch" data-kind="lt" data-base="'+esc(w.base)+'">Yenile</button>';}
      else {aiCell='<button class="btn ghost" style="padding:1px 5px;font-size:9.5px" data-act="aiWatch" data-kind="lt" data-base="'+esc(w.base)+'">AI</button>';}
      return '<tr><td>'+chartCell(w)+'</td><td class="mut">'+esc(w.tf||'')+'</td><td>'+px(w.price)+'</td><td class="dn">'+px(w.upper)+'</td><td class="up">'+px(w.lower)+'</td><td class="'+cls(-up)+'">'+sgn(-up,2)+'%</td><td class="'+cls(-lo)+'">'+sgn(-lo,2)+'%</td><td><span class="chip '+(w.nearSide==='ÜST'?'long':'short')+'">'+esc(w.nearSide||w.dirHint||'')+'</span> '+num(w.nearPct,2)+'%</td><td><span class="chip neutral">'+esc(w.status||'')+'</span></td><td>'+aiCell+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

function rejTable(limit){
  var all=g(S.rejections,'items',[]);
  var filtered=S.rejFilter==='ALL'?all:all.filter(function(r){return r.mod===S.rejFilter;});
  var filters='<div class="rej-filter">'+['ALL','AUTO','PUMP','LT'].map(function(f){
    return '<button class="btn ghost '+(S.rejFilter===f?'on':'')+'" data-act="rejFilter" data-id="'+f+'">'+f+'</button>';
  }).join('')+'</div>';
  var byCode=g(S.rejections,'byCode',{});
  var summary=Object.keys(byCode).length?'<div style="margin-bottom:8px;font-size:11px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap">'+Object.keys(byCode).sort(function(a,b){return byCode[b]-byCode[a];}).slice(0,10).map(function(c){return '<span class="chip neutral">'+esc(c)+': '+byCode[c]+'</span>';}).join('')+'</div>':'';
  if(!filtered.length)return filters+summary+'<div class="card empty">Son dakikalarda elenen yok</div>';
  return filters+summary+'<div class="card scroll"><table class="tbl"><thead><tr><th>Saat</th><th>Modül</th><th>Coin</th><th>Kod</th><th>Neden</th><th>Sayı</th></tr></thead><tbody>'+filtered.slice(0,limit||30).map(function(r){

function drawChartLW(el, d) {
  if (!el || !d || !d.candles || !d.candles.length) return;
  if (!window.LightweightCharts) { el.innerHTML = "<div class='empty'>Grafik kütüphanesi yüklenemedi.</div>"; return; }
  el.innerHTML = "";
  const chart = LightweightCharts.createChart(el, {
    layout: { background: { color: '#181a20' }, textColor: '#848e9c' },
    grid: { vertLines: { color: '#1f242b' }, horzLines: { color: '#1f242b' } },
    timeScale: { timeVisible: true, rightOffset: 12 },
    rightPriceScale: { borderColor: '#2b3139' },
    crosshair: { mode: 0 }
  });
  const cs = chart.addCandlestickSeries({ upColor: '#0ecb81', downColor: '#f6465d', borderVisible: false, wickUpColor: '#0ecb81', wickDownColor: '#f6465d' });
  const cdata = d.candles.map(c => ({ time: Math.floor(c[0] / 1000), open: c[1], high: c[2], low: c[3], close: c[4] }));
  cs.setData(cdata);

  const noScale = { autoscaleInfoProvider: () => null };
  const drawLine = (arr, color, w, style) => {
    if (!arr || !arr.length) return;
    const s = chart.addLineSeries(Object.assign({ color, lineWidth: w, lineStyle: style || 0, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }, noScale));
    const seen = new Set(), pts = [];
    for (const [t, v] of arr) { const k = Math.floor(t / 1000); if (!seen.has(k)) { seen.add(k); pts.push({ time: k, value: v }); } }
    s.setData(pts.sort((a, b) => a.time - b.time));
  };

  const e20 = chart.addLineSeries({ color: '#f0b90b', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  e20.setData(d.candles.map((c, i) => d.ema20[i] ? { time: Math.floor(c[0] / 1000), value: d.ema20[i] } : null).filter(Boolean));
  const e50 = chart.addLineSeries({ color: '#4b9cf5', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  e50.setData(d.candles.map((c, i) => d.ema50[i] ? { time: Math.floor(c[0] / 1000), value: d.ema50[i] } : null).filter(Boolean));

  if (d.triangle) {
    drawLine(d.triangle.upperFull, '#f6465d', 2);
    drawLine(d.triangle.lowerFull, '#0ecb81', 2);
    const mk = (d.triangle.pivots || []).map(p => ({ time: Math.floor(p.t / 1000), position: p.side === 'H' ? 'aboveBar' : 'belowBar', color: p.side === 'H' ? '#f6465d' : '#0ecb81', shape: p.side === 'H' ? 'arrowDown' : 'arrowUp', size: 0.6 })).sort((a, b) => a.time - b.time);
    cs.setMarkers(mk);
  }

  (d.supportResistance || []).forEach(l => cs.createPriceLine({ price: l.v, color: l.kind === 'R' ? '#f6465d88' : '#0ecb8188', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: l.l }));
  (d.levels || []).forEach(l => cs.createPriceLine({ price: l.v, color: l.col || '#848e9c', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: l.l }));

  const sg = d.signal || {};
  [['entry', '#eaecef', 'Giriş'], ['sl', '#f6465d', 'Stop'], ['tp1', '#0ecb81', 'TP1'], ['tp2', '#0ecb81', 'TP2']].forEach(([k, c, t]) => {
    if (sg[k] > 0) cs.createPriceLine({ price: sg[k], color: c, lineWidth: 1, lineStyle: k === 'entry' ? 0 : 2, axisLabelVisible: true, title: t });
  });

  const n = cdata.length;
  chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - (d.triangle ? 320 : 150)), to: n + 30 });
  new ResizeObserver(() => { if (chart) chart.applyOptions({ width: el.clientWidth, height: el.clientHeight }); }).observe(el);
}

      }
    }
    else if(a==="runBt"){
      var b={module:document.getElementById("b_mod").value,coins:Number(document.getElementById("b_coins").value)||10};
      var rs=await post("/api/backtest",b);if(!rs||!rs.id){toast("Başlamadı","err");return;}S.jobId=rs.id;S.job={status:"çalışıyor",progress:0};render();pollJob();
    }
  }catch(err){console.error(err);toast("Hata","err");}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});
function pollJob(){if(!S.jobId)return;api("/api/backtest/"+S.jobId).then(function(j){if(j){S.job=j;if(S.tab==="bt")render();}if(j&&j.status==="çalışıyor")setTimeout(pollJob,2000);});}

async function init() {
  renderNav();
  renderTop();
  await refresh();
  
  // AI'yi otomatik aç (eğer kullanıcı localstorage üzerinden elle kapatmadıysa)
  if (!localStorage.getItem('ai_manual_off')) {
    var st = await api('/api/state');
    if (st && st.settings && st.settings.aiEnabled === false) {
      await post('/api/ai/toggle', { enabled: true });
      await refresh();
      toast('AI otomatik açıldı', 'ok');
    }
  }
  
  setInterval(refresh, 5000);
}

init();
</script>
